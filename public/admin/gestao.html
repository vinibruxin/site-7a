<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A0A0A">
<title>Gestão | 7A Produtora</title>
<link rel="icon" href="/img/logo-7a.png">
<link rel="manifest" href="/admin/manifest.json">
<link rel="apple-touch-icon" href="/admin/icone-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="7A Gestão">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600;700&display=swap">
<style>
:root {
  --preto: #0A0A0A; --vermelho: #B5121B; --vermelho-2: #9A0F17; --offwhite: #F2EFEA; --grafite: #2B2B2B; --grafite-2: #3A3A3A; --cinza: #B8B2AA; --ouro: #F2D27C;
  --f-display: "Anton", Impact, "Arial Narrow Bold", sans-serif;
  --f-texto: "Montserrat", "Segoe UI", Arial, sans-serif;
  --m: max(20px, env(safe-area-inset-left, 0px));
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--preto); }
body { margin: 0; min-height: 100svh; background: var(--preto); color: var(--offwhite); font: 400 15px/1.5 var(--f-texto); -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--ouro); outline-offset: 2px; }
a { color: inherit; }
.display { font-family: var(--f-display); font-weight: 400; text-transform: uppercase; line-height: .95; margin: 0; letter-spacing: -0.01em; }
.num { font-variant-numeric: tabular-nums; }

/* barra de cima */
.topo { display: flex; align-items: center; gap: 20px; padding: 10px var(--m); background: var(--preto); position: sticky; top: 0; z-index: 20; }
.topo .marca { display: flex; align-items: center; gap: 12px; text-decoration: none; margin-right: auto; }
.topo .marca img { width: 28px; height: auto; }
.topo .marca span { font: 400 18px/1 var(--f-display); text-transform: uppercase; }
.topo .sec { font-weight: 600; font-size: 14px; background: none; border: 0; text-decoration: none; cursor: pointer; padding: 10px 0; }
.topo .sec:hover { color: var(--cinza); }
.abas { display: flex; gap: 4px; }
.abas a { font: 400 21px/1 var(--f-display); text-transform: uppercase; text-decoration: none; color: var(--grafite-2); padding: 6px 10px; transition: color .2s; }
.abas a:hover { color: var(--cinza); }
.abas a[aria-current="page"] { color: var(--offwhite); }

/* botões */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: 700 14px/1 var(--f-texto); padding: 11px 16px; min-height: 40px; background: var(--vermelho); color: var(--offwhite); border: 0; cursor: pointer; text-decoration: none; transition: transform .15s, background-color .2s; }
.btn:hover { background: var(--vermelho-2); }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .55; cursor: wait; }
.btn-sec { background: var(--grafite); }
.btn-sec:hover { background: var(--grafite-2); }
.btn-claro { background: var(--offwhite); color: var(--preto); }
.btn-claro:hover { background: var(--cinza); }
.texto-btn { background: none; border: 0; color: var(--cinza); font-weight: 600; font-size: 14px; cursor: pointer; padding: 10px 0; text-decoration: underline; text-underline-offset: 3px; }
.texto-btn:hover { color: var(--offwhite); }
.perigo { color: #FF8A8F; }

/* campos */
label { display: grid; gap: 5px; font-weight: 600; font-size: 13px; color: var(--cinza); align-content: start; }
input, select, textarea { width: 100%; padding: 9px 12px; min-height: 40px; background: var(--grafite); border: 0; border-radius: 0; color: var(--offwhite); font-size: 15px; }
input:focus, select:focus, textarea:focus { background: var(--grafite-2); }
textarea { resize: vertical; min-height: 80px; line-height: 1.5; }
input[type="checkbox"], input[type="radio"] { width: 22px; height: 22px; min-height: 0; accent-color: var(--vermelho); margin: 0; flex: none; }
.marcar { display: flex; gap: 12px; align-items: center; color: var(--offwhite); font-weight: 500; font-size: 16px; cursor: pointer; }
.erro { margin: 0; color: #FF8A8F; font-weight: 600; }

/* entrada */
.entrada { min-height: 100svh; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.entrada .lado { background: var(--vermelho); padding: 40px var(--m); display: flex; flex-direction: column; justify-content: space-between; gap: 40px; }
.entrada .lado img { width: 72px; }
.entrada .lado h1 { font-size: clamp(72px, 10vw, 160px); color: var(--preto); }
.entrada form { align-self: center; justify-self: center; width: min(420px, 100% - 40px); display: grid; gap: 16px; padding: 48px 0; }
.entrada form p { margin: 0 0 8px; font-size: 18px; }

/* conteúdo */
main { padding: 4px var(--m) 140px; max-width: 1080px; }
.cabeca { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px 24px; margin: 24px 0 28px; }
.cabeca h1 { font-size: clamp(34px, 3.6vw, 52px); }
.cabeca p { margin: 6px 0 0; color: var(--cinza); font-size: 15px; }
h2.display { font-size: clamp(22px, 2.2vw, 28px); margin: 40px 0 12px; }
.ajuda { margin: 0 0 16px; max-width: 46em; font-size: 15px; }
.vazio { margin: 0; padding: 18px; background: var(--grafite); font-size: 15px; max-width: 46em; }
.vazio .btn { margin-top: 16px; }

/* números de hoje */
.numeros { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 8px; }
.numeros > div { background: var(--grafite); padding: 14px 16px 16px; display: grid; gap: 8px; align-content: space-between; min-height: 104px; }
.numeros > div:first-child { background: var(--vermelho); }
.numeros dt { font-weight: 600; font-size: 14px; }
.numeros dd { margin: 0; font: 400 clamp(28px, 3vw, 42px)/1 var(--f-display); letter-spacing: -0.01em; }
.numeros small { display: block; font: 500 13px/1.4 var(--f-texto); color: var(--offwhite); opacity: .8; }

/* listas */
.lista { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; align-items: center; padding: 11px 14px; background: var(--grafite); text-decoration: none; transition: background-color .15s; }
a.item:hover { background: var(--grafite-2); }
a.item:active { transform: scale(.995); }
.item .nome { font-weight: 700; font-size: 16px; line-height: 1.25; overflow-wrap: anywhere; }
.item .meta { grid-column: 1; color: var(--cinza); font-size: 14px; overflow-wrap: anywhere; }
.item .lado { grid-row: 1 / span 2; grid-column: 2; display: grid; justify-items: end; gap: 6px; text-align: right; }
.item .valor { font-weight: 700; font-size: 15px; }
.atrasado { color: #FF8A8F; font-weight: 700; }

.show-item { grid-template-columns: 64px minmax(0, 1fr) auto; }
.show-item .quando { grid-row: 1 / span 2; display: grid; justify-items: start; line-height: 1; }
.show-item .quando .dia { font: 400 30px/1 var(--f-display); }
.show-item .quando .mes { font-weight: 700; font-size: 13px; color: var(--cinza); margin-top: 4px; }
.show-item .nome, .show-item .meta { grid-column: 2; }
.show-item .lado { grid-column: 3; }
.cancelado .nome { text-decoration: line-through; }

.etiqueta { display: inline-block; font: 700 13px/1 var(--f-texto); padding: 6px 8px; background: var(--grafite-2); color: var(--offwhite); white-space: nowrap; }
.e-reservado, .e-contatado { background: var(--cinza); color: var(--preto); }
.e-confirmado, .e-negociando { background: var(--vermelho); }
.e-realizado, .e-fechado { background: var(--offwhite); color: var(--preto); }
.e-cancelado, .e-perdido { background: var(--preto); color: var(--cinza); }
.e-site { background: var(--ouro); color: var(--preto); }
.e-bloqueado { background: #FF8A8F; color: var(--preto); }
.e-andamento { background: var(--vermelho); }
.e-pausada { background: var(--cinza); color: var(--preto); }
.e-concluida { background: var(--offwhite); color: var(--preto); }
.e-cancelada { background: var(--preto); color: var(--cinza); }

/* whatsapp, campanhas, importação */
.aviso { margin: 0 0 12px; padding: 12px 16px; border-left: 4px solid var(--ouro); background: var(--grafite); max-width: 52em; font-size: 15px; }
.aviso-forte { border-left-color: #FF8A8F; }
.aviso .texto-btn { padding: 0 0 0 6px; }
.texto-msg { margin: 0; padding: 14px 16px; background: var(--grafite-2); white-space: pre-wrap; overflow-wrap: anywhere; max-width: 46em; font-size: 15px; line-height: 1.55; }
.caixa-zap, .fila { background: var(--grafite); padding: 18px; margin: 0 0 24px; max-width: 900px; }
.caixa-zap .ficha { max-width: none; }
.caixa-zap textarea, .caixa-zap select { background: var(--grafite-2); }
.fila .acoes-rapidas { margin: 14px 0 6px; }
.fila-topo { margin: 0; color: var(--cinza); font-weight: 600; font-size: 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn-grande { min-height: 52px; padding: 16px 26px; font-size: 16px; }
.acoes-msg { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 6px; }
.notas .etiqueta { justify-self: end; }
.paginas { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 16px; color: var(--cinza); font-weight: 600; font-size: 14px; }
.linha-marcas { display: flex; flex-wrap: wrap; gap: 8px 24px; margin: 0 0 16px; }
.linha-marcas .marcar { font-size: 15px; }
.item-texto { display: block; }
.item-texto summary { display: grid; gap: 4px; cursor: pointer; list-style: none; }
.item-texto summary::-webkit-details-marker { display: none; }
.item-texto .texto-msg { margin-top: 10px; }
.variaveis { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-weight: 600; font-size: 13px; color: var(--cinza); }
.variaveis .btn { min-height: 32px; padding: 6px 10px; font-size: 13px; font-weight: 600; }

/* filtros */
.filtros { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin: 0 calc(var(--m) * -1) 16px; padding-left: var(--m); padding-right: var(--m); scrollbar-width: none; }
.filtros::-webkit-scrollbar { display: none; }
.filtros button { flex: none; font-weight: 600; font-size: 14px; padding: 8px 12px; min-height: 36px; background: var(--grafite); border: 0; cursor: pointer; white-space: nowrap; transition: background-color .15s; }
.filtros button:hover { background: var(--grafite-2); }
.filtros button[aria-pressed="true"] { background: var(--offwhite); color: var(--preto); }
.filtros .conta { margin-left: 6px; opacity: .7; }
.busca { display: flex; gap: 8px; margin-bottom: 12px; max-width: 640px; }
.mes-titulo { font: 400 22px/1 var(--f-display); text-transform: uppercase; margin: 26px 0 8px; }
.mes-titulo:first-child { margin-top: 0; }

/* ficha (formulário de contratante e de show) */
.voltar { display: inline-block; font-weight: 600; font-size: 14px; text-decoration: none; color: var(--cinza); padding: 8px 0; margin-top: 4px; }
.voltar:hover { color: var(--offwhite); }
.ficha { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px 10px; max-width: 860px; }
.ficha > * { grid-column: span 3; }
.ficha .c2 { grid-column: span 2; }
.ficha .c1 { grid-column: span 1; }
.ficha .c3 { grid-column: span 3; }
.ficha .c4 { grid-column: span 4; }
.ficha .c6 { grid-column: 1 / -1; }
.ficha .dica { display: block; margin-top: 6px; font-size: 13px; font-weight: 500; color: var(--cinza); }
.acoes-rapidas { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 20px; }
.salvar-barra { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 10px 0 calc(14px + env(safe-area-inset-bottom, 0px)); background: var(--preto); margin-top: 24px; z-index: 5; }
.salvar-barra .estado { margin: 0; font-weight: 600; }
.estado.ok { color: #9BE3A3; }
.estado.ruim { color: #FF8A8F; }
.salvar-barra .apagar { margin-left: auto; }

/* conta do show */
.conta-show { grid-column: 1 / -1; background: var(--grafite); padding: 20px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 4px 32px; }
.conta-show dl { margin: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; align-content: start; }
.conta-show dt { color: var(--cinza); font-weight: 500; }
.conta-show dd { margin: 0; font-weight: 700; text-align: right; }
.conta-show .total dt, .conta-show .total dd { color: var(--offwhite); font: 400 22px/1.1 var(--f-display); text-transform: uppercase; padding-top: 6px; }
.conta-show .total dd { color: var(--offwhite); }
.conta-show p { grid-column: 1 / -1; margin: 12px 0 0; color: var(--cinza); font-size: 14px; }

.notas { display: grid; gap: 8px; margin: 16px 0 0; padding: 0; list-style: none; max-width: 900px; }
.notas li { background: var(--grafite); padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; }
.notas .quando { color: var(--cinza); font-size: 14px; font-weight: 600; }
.notas .texto { grid-column: 1 / -1; white-space: pre-wrap; overflow-wrap: anywhere; }
.notas .texto-btn { padding: 0; font-size: 14px; }
.nova-nota { display: grid; gap: 8px; max-width: 900px; }
.nova-nota .btn { justify-self: start; }

.marcas { border: 0; padding: 0; margin: 0; display: grid; gap: 12px; }
.marcas legend { font-weight: 600; font-size: 14px; color: var(--cinza); margin-bottom: 12px; padding: 0; }
.ajustes { display: grid; gap: 20px; max-width: 560px; }
.radios { display: grid; gap: 12px; }

@media (max-width: 860px) {
  .numeros { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .numeros > div:first-child { grid-column: 1 / -1; }
  .conta-show { grid-template-columns: minmax(0, 1fr); gap: 16px; }
}
@media (max-width: 760px) {
  .topo { gap: 16px; }
  input, select, textarea, .btn { min-height: 44px; font-size: 16px; }
  .cabeca h1 { font-size: 40px; }
  .topo .marca span { font-size: 18px; }
  /* no celular, as abas viram uma barra fixa embaixo, ao alcance do polegar */
  .abas { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--grafite); padding: 0 0 env(safe-area-inset-bottom, 0px); gap: 0; }
  .abas a { flex: 1; text-align: center; font: 600 13px/1 var(--f-texto); text-transform: none; color: var(--cinza); padding: 20px 2px 18px; position: relative; }
  .abas a[aria-current="page"] { color: var(--offwhite); }
  .abas a[aria-current="page"]::before { content: ""; position: absolute; left: 22%; right: 22%; top: 0; height: 4px; background: var(--vermelho); }
  main { padding-bottom: 120px; }
  .entrada { grid-template-columns: minmax(0, 1fr); }
  .entrada .lado { min-height: 36svh; }
  .ficha { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .ficha > *, .ficha .c1, .ficha .c2, .ficha .c3, .ficha .c4 { grid-column: 1 / -1; }
  .ficha .meia { grid-column: span 1; }
  .numeros > div { min-height: 120px; padding: 16px; }
  .numeros dd { font-size: 34px; }
  .numeros > div:first-child dd { font-size: 48px; }
  .item { padding: 14px 16px; }
  .show-item { grid-template-columns: 52px minmax(0, 1fr); }
  .show-item .lado { grid-column: 2; grid-row: auto; justify-items: start; text-align: left; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .show-item .quando .dia { font-size: 34px; }
  .lista-contratantes .item { grid-template-columns: minmax(0, 1fr); }
  .lista-contratantes .item .lado { grid-row: auto; grid-column: 1; justify-items: start; text-align: left; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<section class="entrada" id="tela-entrada" hidden>
  <div class="lado">
    <img src="/img/logo-7a.png" alt="7A Produtora" width="72" height="85">
    <h1 class="display">Gestão</h1>
  </div>
  <form id="form-entrar">
    <p>Entre com a senha da 7A para ver contratantes, shows e cachês.</p>
    <label>Senha<input type="password" id="senha" autocomplete="current-password" required></label>
    <p class="erro" id="erro-entrar" role="alert" hidden></p>
    <button class="btn" type="submit">Entrar</button>
  </form>
</section>

<div id="tela-app" hidden>
  <header class="topo">
    <a class="marca" href="#hoje"><img src="/img/logo-7a.png" alt="" width="34" height="40"><span>7A Gestão</span></a>
    <nav class="abas" aria-label="Seções">
      <a href="#hoje" data-aba="hoje">Hoje</a>
      <a href="#contratantes" data-aba="contratantes">Contratantes</a>
      <a href="#campanhas" data-aba="campanhas">Campanhas</a>
      <a href="#shows" data-aba="shows">Shows</a>
      <a href="#ajustes" data-aba="ajustes">Ajustes</a>
    </nav>
    <a class="sec" href="/admin/">Editar o site</a>
    <button class="sec" type="button" id="sair">Sair</button>
  </header>
  <main id="tela" aria-live="polite"></main>
</div>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const tela = $("#tela");
  let D = null;          // { contratantes, shows, config }
  let artistas = {};     // slug -> nome, vindo do conteúdo do site
  let sujo = false;      // ficha com mudança não salva
  const filtro = { etapa: "", busca: "", status: "", passados: false, perfil: "", bloqueados: false, arquivados: false, pagina: 1 };
  let modelos = null;    // modelos de mensagem, carregados quando precisa

  const ETAPAS = [["contatar", "A contatar"], ["contatado", "Contatado"], ["negociando", "Negociando"], ["fechado", "Fechado"], ["perdido", "Perdido"]];
  const TIPOS = [["casa", "Bar ou casa de show"], ["restaurante", "Restaurante"], ["festival", "Festival"], ["evento", "Evento"], ["empresa", "Empresa"], ["particular", "Festa particular"], ["outro", "Outro"]];
  const STATUS = [["consulta", "Consulta"], ["reservado", "Reservado"], ["confirmado", "Confirmado"], ["realizado", "Realizado"], ["cancelado", "Cancelado"]];
  const PERFIS = [["", "Não definido"], ["autoral", "Som autoral"], ["classicos", "Clássicos do rock"], ["ambos", "Autoral e clássicos"]];
  const ETAPAS_MODELO = [["primeiro", "Primeiro contato"], ["cobranca", "Cobrança"], ["proposta", "Proposta"], ["outro", "Outro"]];
  const LISTAS = [["contatar", "A contatar"], ["cobrar", "Cobrar hoje"], ["abertas", "Todas em aberto"]];
  const STATUS_CAMP = { rascunho: "Rascunho", andamento: "Em andamento", pausada: "Pausada", cancelada: "Cancelada", concluida: "Concluída" };
  const SIT_DEST = { pendente: "Na fila", aberta: "Aberta, falta confirmar", aguardando: "Esperando cobrança", enviada: "Enviada", cobrada: "Cobrada", respondeu: "Respondeu", bloqueado: "Bloqueado", pulado: "Pulado", cancelado: "Cancelado" };
  const SIT_MSG = { aberta: "Falta confirmar", enviada: "Enviada", desistiu: "Não enviada" };
  const TIPO_MSG = { abordagem: "Primeiro contato", cobranca: "Cobrança", avulsa: "Mensagem" };
  const VARIAVEIS = ["primeiro_nome", "nome_contato", "casa", "cidade", "site"];
  const nomeDe = (lista, k) => (lista.find((x) => x[0] === k) || [k, k])[1];
  const MESES = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
  const DIAS = ["domingo", "segunda", "terça", "quarta", "quinta", "sexta", "sábado"];

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const hoje = () => new Intl.DateTimeFormat("en-CA", { timeZone: "America/Sao_Paulo" }).format(new Date());
  const dia = (d) => { const [a, m, x] = d.split("-").map(Number); return new Date(Date.UTC(a, m - 1, x)); };
  const dataCurta = (d) => (d ? d.split("-").reverse().slice(0, 2).join("/") : "");
  const diasEntre = (a, b) => Math.round((dia(b) - dia(a)) / 86400e3);
  const moeda = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
  const reais = (c) => (c == null ? "—" : moeda.format(c / 100));
  // aceita "1.500", "1500,50", "1500.5", "R$ 1.500,00"
  function centavos(t) {
    let s = String(t || "").replace(/[^\d,.-]/g, "");
    if (!s) return 0;
    if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
    else if (/\.\d{3}$/.test(s)) s = s.replace(/\./g, "");
    const n = Math.round(parseFloat(s) * 100);
    return Number.isFinite(n) && n > 0 ? n : 0;
  }
  const campoReais = (c) => (c ? (c / 100).toFixed(2).replace(".", ",") : "");
  const dataHora = (iso) => new Date(iso).toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  // identifica cada toque de "abrir": repetir o mesmo toque não cria um segundo registro
  const chaveNova = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 12));
  const carregarModelos = () => (modelos ? Promise.resolve(modelos) : api("gestao/modelos").then((r) => (modelos = Array.isArray(r) ? r : [])));

  function api(rota, metodo = "GET", corpo) {
    return fetch("/api/" + rota, {
      method: metodo, credentials: "same-origin",
      headers: corpo ? { "content-type": "application/json" } : {},
      body: corpo ? JSON.stringify(corpo) : undefined,
    }).then((r) => r.json().catch(() => ({})).then((j) => { if (j && typeof j === "object") j._status = r.status; return j; }));
  }

  // mesma conta do servidor (src/gestao.js, função contas)
  function contas(s) {
    const c = D.config;
    const pct = s.pct != null && s.pct !== "" ? Number(s.pct) : c.pct_padrao === "" ? null : Number(c.pct_padrao);
    const base = c.base === "liquido" ? Math.max(0, s.cache - s.despesas) : s.cache;
    const comissao = pct == null ? null : Math.round((base * pct) / 100);
    const repasse = comissao == null ? null : s.cache - s.despesas - comissao;
    return { pct, comissao, repasse, falta_receber: s.cache - s.recebido, falta_repassar: repasse == null ? null : repasse - s.repassado };
  }
  const contratante = (id) => D.contratantes.find((c) => c.id === id);
  const nomeArtista = (s) => artistas[s.artista] || s.artista_texto || s.artista || "Artista";
  const soDigitos = (t) => String(t || "").replace(/\D/g, "");
  function whats(tel) {
    let d = soDigitos(tel);
    if (!d) return "";
    if (d.length <= 11) d = "55" + d.replace(/^0/, "");
    return "https://wa.me/" + d;
  }

  /* ---------- entrada ---------- */
  function mostrarEntrada() { $("#tela-entrada").hidden = false; $("#tela-app").hidden = true; $("#senha").focus(); }
  $("#form-entrar").addEventListener("submit", (ev) => {
    ev.preventDefault();
    const erro = $("#erro-entrar"); erro.hidden = true;
    api("entrar", "POST", { senha: $("#senha").value }).then((r) => {
      if (r.ok) { $("#senha").value = ""; abrir(); }
      else { erro.textContent = r.erro || "Não deu para entrar."; erro.hidden = false; }
    });
  });
  $("#sair").addEventListener("click", () => api("sair", "POST").then(() => { sujo = false; location.hash = ""; location.reload(); }));

  function abrir() {
    Promise.all([api("gestao/dados"), api("conteudo")]).then(([dados, conteudo]) => {
      if (dados._status === 401) return mostrarEntrada();
      if (!dados.contratantes) { tela.innerHTML = '<p class="vazio">Não deu para carregar os dados. Recarregue a página.</p>'; return; }
      D = dados;
      artistas = {};
      for (const [s, a] of Object.entries(conteudo.artistas || {})) artistas[s] = a.nome;
      $("#tela-entrada").hidden = true; $("#tela-app").hidden = false;
      rota();
    });
  }

  /* ---------- rotas pelo endereço (o botão voltar do celular funciona) ---------- */
  window.addEventListener("hashchange", () => {
    if (sujo && !confirm("Sair sem salvar as mudanças?")) { history.pushState(null, "", ultimo); return; }
    sujo = false; rota();
  });
  window.addEventListener("beforeunload", (ev) => { if (sujo) { ev.preventDefault(); ev.returnValue = ""; } });
  let ultimo = "#hoje";

  function rota() {
    if (!D) return;
    const h = location.hash || "#hoje";
    ultimo = h;
    const [nome, id] = h.slice(1).split("/");
    const aba = { contratante: "contratantes", importar: "contratantes", show: "shows", campanha: "campanhas", modelos: "campanhas", modelo: "campanhas" }[nome] || nome;
    document.querySelectorAll("[data-aba]").forEach((a) => (a.dataset.aba === aba ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current")));
    const telas = {
      hoje: telaHoje, contratantes: telaContratantes, contratante: () => fichaContratante(id), importar: telaImportar,
      campanhas: telaCampanhas, campanha: () => fichaCampanha(id), modelos: telaModelos, modelo: () => fichaModelo(id),
      shows: telaShows, show: () => fichaShow(id), ajustes: telaAjustes,
    };
    (telas[nome] || telaHoje)();
    window.scrollTo(0, 0);
  }

  /* ---------- hoje ---------- */
  function telaHoje() {
    desenharHoje();
    // números e listas do dia sempre frescos
    api("gestao/dados").then((r) => { if (r.contratantes && (location.hash || "#hoje") === "#hoje") { D = r; desenharHoje(); } });
  }
  function desenharHoje() {
    const h = hoje(), d = dia(h);
    const ativos = D.shows.filter((s) => s.status === "confirmado" || s.status === "realizado");
    const aReceber = ativos.reduce((t, s) => t + Math.max(0, s.cache - s.recebido), 0);
    const aRepassar = ativos.reduce((t, s) => { const k = contas(s); return t + Math.max(0, k.falta_repassar || 0); }, 0);
    const mes = h.slice(0, 7);
    const doMes = ativos.filter((s) => s.data.startsWith(mes));
    const comissaoMes = doMes.reduce((t, s) => t + (contas(s).comissao || 0), 0);
    const semPct = D.config.pct_padrao === "" && doMes.some((s) => s.pct == null);
    const fazer = D.fazer || [];
    const proximos = D.shows.filter((s) => s.data && s.data >= h && s.status !== "cancelado" && diasEntre(h, s.data) <= 60);
    const ind = D.indicadores || { hoje: { abordagens: 0, limite: 20 }, sem_confirmar: 0 };
    const camp = D.campanhas || [];

    tela.innerHTML = `
      <div class="cabeca"><div><h1 class="display">Hoje</h1><p>${DIAS[d.getUTCDay()]}, ${d.getUTCDate()} de ${MESES[d.getUTCMonth()]}</p></div>
        <a class="btn" href="#contratante/novo">Novo contratante</a></div>
      ${D.config.simulacao === "1" ? '<p class="aviso">Modo simulação ligado: as mensagens são registradas como teste e o WhatsApp não abre. Desligue em <a href="#ajustes">Ajustes</a>.</p>' : ""}
      <dl class="numeros">
        <div><dt>A receber dos contratantes</dt><dd class="num">${reais(aReceber)}</dd><small>Shows confirmados e realizados</small></div>
        <div><dt>A repassar aos artistas</dt><dd class="num">${D.config.pct_padrao === "" && aRepassar === 0 && ativos.length ? "—" : reais(aRepassar)}</dd></div>
        <div><dt>Comissão 7A em ${MESES[d.getUTCMonth()]}</dt><dd class="num">${semPct ? "—" : reais(comissaoMes)}</dd>${semPct ? '<small>Defina o % da 7A em <a href="#ajustes">Ajustes</a></small>' : ""}</div>
      </dl>
      <h2 class="display">WhatsApp</h2>
      <dl class="numeros numeros-zap">
        <div><dt>Novas abordagens hoje</dt><dd class="num">${ind.hoje.abordagens} de ${ind.hoje.limite}</dd><small>Limite diário, para proteger o número</small></div>
        <div><dt>Abertas sem confirmar</dt><dd class="num">${ind.sem_confirmar}</dd><small>Marque se enviou ou não</small></div>
        <div><dt>Respostas em 30 dias</dt><dd class="num">${ind.respostas ?? 0}</dd><small>${ind.taxa_resposta != null ? ind.taxa_resposta + "% das enviadas" : "Nenhuma enviada ainda"}</small></div>

      ${camp.length ? `<ul class="lista" style="margin-top:8px">${camp.map((c) => `<li><a class="item" href="#campanha/${c.id}"><span class="nome">${esc(c.nome)}</span><span class="lado"><span class="etiqueta e-andamento">${c.na_vez ? c.na_vez + " na vez" : "Em dia"}</span></span><span class="meta">Campanha em andamento${c.simulada ? " (simulação)" : ""}</span></a></li>`).join("")}</ul>` : ""}
      <h2 class="display">Para fazer hoje</h2>
      ${fazer.length ? `<ul class="lista lista-contratantes">${fazer.map((c) => itemContratante(c, true)).join("")}</ul>`
        : `<p class="vazio">${D.contratantes.length ? "Nenhuma ação marcada para hoje. Abra um contratante e marque a próxima ação com data." : "Ainda não há contratantes. Comece pelas casas, festivais e eventos que a 7A quer abordar, um por um, com a próxima ação e a data."}${D.contratantes.length ? "" : '<br><a class="btn" href="#contratante/novo">Cadastrar o primeiro</a>'}</p>`}
      <h2 class="display">Próximos shows</h2>
      ${proximos.length ? `<ul class="lista">${proximos.map(itemShow).join("")}</ul>` : '<p class="vazio">Nenhum show nos próximos 60 dias. Quando uma data for pedida, cadastre como consulta em <a href="#show/novo">Novo show</a>.</p>'}`;
  }

  /* ---------- contratantes ---------- */
  function itemContratante(c, comAcao) {
    const h = hoje();
    const atraso = c.proxima_data && c.proxima_data < h ? diasEntre(c.proxima_data, h) : 0;

      <span class="nome">${esc(c.nome)}</span>
      <span class="lado">${etiqueta}${quando}</span>

      <div class="linha-marcas"><label class="marcar"><input type="checkbox" id="f-bloq"${filtro.bloqueados ? " checked" : ""}> Só os bloqueados</label><label class="marcar"><input type="checkbox" id="f-arq"${filtro.arquivados ? " checked" : ""}> Arquivados</label></div>
      <div id="resultado"><p class="vazio">Carregando...</p></div>`;
    const carregar = () => {
      const q = new URLSearchParams({ busca: filtro.busca, etapa: filtro.etapa, perfil: filtro.perfil, pagina: filtro.pagina, por: 50 });
      if (filtro.bloqueados) q.set("bloqueados", "1");
      if (filtro.arquivados) q.set("arquivados", "1");
      const seq = ++buscaSeq;
      api("gestao/contratantes?" + q).then((r) => {
        if (seq !== buscaSeq || !$("#resultado")) return;
        if (!r.itens) { $("#resultado").innerHTML = `<p class="vazio">${esc(r.erro || "Não deu para carregar.")}</p>`; return; }
        const todos = Object.values(r.contagens).reduce((a, b) => a + b, 0);
        $("#etapas").innerHTML = `<button type="button" data-etapa="" aria-pressed="${!filtro.etapa}">Todos<span class="conta">${todos}</span></button>`
          + ETAPAS.map(([k, n]) => `<button type="button" data-etapa="${k}" aria-pressed="${filtro.etapa === k}">${n}<span class="conta">${r.contagens[k] || 0}</span></button>`).join("");
        const paginas = Math.max(1, Math.ceil(r.total / r.por));
        $("#resultado").innerHTML = r.itens.length
          ? `<ul class="lista lista-contratantes">${r.itens.map((c) => itemContratante(c)).join("")}</ul>
             ${paginas > 1 ? `<div class="paginas"><button class="btn btn-sec" type="button" data-pag="${r.pagina - 1}"${r.pagina <= 1 ? " disabled" : ""}>Anterior</button><span>Página ${r.pagina} de ${paginas} · ${r.total} contratantes</span><button class="btn btn-sec" type="button" data-pag="${r.pagina + 1}"${r.pagina >= paginas ? " disabled" : ""}>Próxima</button></div>` : ""}`
          : `<p class="vazio">${todos || filtro.busca || filtro.arquivados || filtro.bloqueados ? "Nenhum contratante com esse filtro." : "Nenhum contratante ainda. Cadastre cada casa, festival, evento ou empresa que a 7A vai abordar, ou importe uma planilha."}</p>`;
      });
    };
    $("#etapas").addEventListener("click", (ev) => { const b = ev.target.closest("[data-etapa]"); if (!b) return; filtro.etapa = b.dataset.etapa; filtro.pagina = 1; carregar(); });

    carregar();

  const opcoes = (lista, sel) => lista.map(([k, n]) => `<option value="${k}"${k === sel ? " selected" : ""}>${esc(n)}</option>`).join("");

        ${c.email ? `<a class="btn btn-sec" href="mailto:${esc(c.email)}">E-mail</a>` : ""}
        ${c.instagram ? `<a class="btn btn-sec" href="https://instagram.com/${encodeURIComponent(c.instagram)}" target="_blank" rel="noopener">Instagram</a>` : ""}
        <a class="btn btn-sec" href="#show/novo?c=${c.id}">Novo show</a></div>

      ${f.campanhas.length ? `<h2 class="display">Campanhas</h2><ul class="lista">${f.campanhas.map((x) => `<li><a class="item" href="#campanha/${x.id}"><span class="nome">${esc(x.nome)}</span><span class="lado"><span class="etiqueta">${SIT_DEST[x.situacao] || x.situacao}</span></span><span class="meta">${STATUS_CAMP[x.status] || x.status}${x.situacao === "aguardando" && x.cobrar_em ? " · cobrança em " + dataCurta(x.cobrar_em) : ""}</span></a></li>`).join("")}</ul>` : ""}
      <h2 class="display">Histórico</h2>
      <div class="nova-nota"><label>O que aconteceu<textarea id="texto-nota" rows="2" placeholder="Liguei, pediu proposta para março"></textarea></label><button class="btn btn-sec" type="button" id="anotar">Anotar</button></div>
      <ul class="notas" id="notas"><li><span class="quando">Carregando...</span></li></ul>
      <h2 class="display">Shows</h2>
      ${seus.length ? `<ul class="lista">${seus.map(itemShow).join("")}</ul>` : '<p class="vazio">Nenhum show com este contratante ainda.</p>'}`}`;

    const form = $("#ficha");
    form.addEventListener("input", () => { sujo = true; estado(""); });
    // CEP: com 8 dígitos busca o endereço nos Correios (ViaCEP) e preenche rua, bairro e cidade
    let ultimoCep = "";
    form.cep.addEventListener("input", () => {
      const d = soDigitos(form.cep.value).slice(0, 8);
      form.cep.value = d.length > 5 ? d.slice(0, 5) + "-" + d.slice(5) : d;
      if (d.length !== 8 || d === ultimoCep) return;
      ultimoCep = d;
      const dica = $("#dica-cep");
      dica.textContent = "Buscando o endereço...";
      fetch(`https://viacep.com.br/ws/${d}/json/`).then((r) => r.json()).then((e) => {
        if (e.erro) { dica.textContent = "CEP não encontrado. Preencha o endereço à mão."; return; }
        if (e.logradouro) form.endereco.value = e.logradouro;
        if (e.bairro) form.bairro.value = e.bairro;
        if (e.localidade) form.cidade.value = e.localidade;
        if (e.uf) form.uf.value = e.uf;
        dica.textContent = "Endereço preenchido. Complete com o número.";
        form.numero.focus();
      }).catch(() => { dica.textContent = "Não consegui buscar o CEP agora. Preencha à mão."; });
    });
    $("#salvar").addEventListener("click", () => {
      const dados = Object.fromEntries(new FormData(form));
      if (!dados.nome.trim()) { estado("Dê um nome ao contratante.", "ruim"); form.nome.focus(); return; }
      salvar(novo ? "gestao/contratantes" : "gestao/contratantes/" + c.id, novo ? "POST" : "PUT", dados, (r) => {
        guardarLeve(r);
        sujo = false;
        if (novo) location.hash = "#contratante/" + r.id;
        else { estado("Salvo.", "ok"); if (r.telefone_norm !== c.telefone_norm) desenharFicha({ ...f, contratante: r }); else Object.assign(c, r); }
      }, (r) => {
        // telefone ou e-mail já cadastrado: mostra o cadastro que já existe
        if (r.existente) $("#estado").innerHTML = `${esc(r.erro)} <a href="#contratante/${r.existente.id}">Abrir ${esc(r.existente.nome)}</a>`;
        if (r.campo && form[r.campo]) form[r.campo].focus();
      });
    });
    if (novo) { form.nome.focus(); return; }

    const recarregar = (msg) => api("gestao/contratantes/" + c.id).then((nf) => { if (nf.contratante) { guardarLeve(nf.contratante); desenharFicha(nf); if (msg) acaoEstado(msg, "ok"); } });
    const acaoEstado = (t, tipo) => { const e = $("#estado-acao"); if (e) { e.textContent = t; e.className = "estado" + (tipo ? " " + tipo : ""); } };
    if ($("#apagar")) $("#apagar").addEventListener("click", () => {
      if (!confirm(`Arquivar ${c.nome}? Sai das listas e das campanhas, mas o histórico fica guardado e dá para restaurar.`)) return;
      api("gestao/contratantes/" + c.id, "DELETE").then((r) => {
        if (!r.ok) return estado(r.erro || "Não deu para arquivar.", "ruim");
        D.contratantes = D.contratantes.filter((x) => x.id !== c.id);
        sujo = false; location.hash = "#contratantes";
      });
    });
    if ($("#restaurar")) $("#restaurar").addEventListener("click", () => api(`gestao/contratantes/${c.id}/restaurar`, "POST").then(() => recarregar("Restaurado.")));
    if ($("#desbloquear")) $("#desbloquear").addEventListener("click", () => {
      const motivo = prompt("Por que desbloquear? Escreva a prova do novo pedido (por exemplo: \"pediu para voltar a receber em 10/11\"). Fica registrado.");
      if (!motivo) return;
      if (!confirm(`Desbloquear ${c.nome}? A casa volta a poder receber mensagens.`)) return;
      api(`gestao/contratantes/${c.id}/desbloquear`, "POST", { confirmo: true, motivo }).then((r) => (r.erro ? alert(r.erro) : recarregar("Desbloqueado.")));
    });
    if ($("#respondeu")) $("#respondeu").addEventListener("click", (ev) => {
      ev.target.disabled = true;
      api(`gestao/contratantes/${c.id}/respondeu`, "POST", {}).then((r) => (r.erro ? acaoEstado(r.erro, "ruim") : recarregar("Marcado: respondeu. Etapa em negociação e próxima ação para hoje.")));
    });
    if ($("#parar")) $("#parar").addEventListener("click", () => {
      const detalhe = prompt(`${c.nome} pediu para não receber mais mensagens? Se quiser, cole o que a pessoa escreveu (fica como prova).`, "");
      if (detalhe === null) return;
      api(`gestao/contratantes/${c.id}/parar`, "POST", { detalhe }).then((r) => (r.erro ? acaoEstado(r.erro, "ruim") : recarregar("Bloqueado. A casa saiu de todas as campanhas.")));
    });
    if ($("#zap")) $("#zap").addEventListener("click", () => abrirCaixaZap(c, () => recarregar()));
    ligarMensagens($("#mensagens"), () => recarregar());

    const desenharNotas = (lista) => {
      $("#notas").innerHTML = lista.length ? lista.map((n) => `<li data-n="${n.id}"><span class="quando">${new Date(n.criado).toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo", day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" })}</span><button class="texto-btn" type="button" data-tirar>Apagar</button><span class="texto">${esc(n.texto)}</span></li>`).join("")
        : '<li><span class="texto">Nada anotado ainda. Registre cada contato para saber onde a conversa parou.</span></li>';
    };
    let notas = [];
    api(`gestao/contratantes/${c.id}/notas`).then((r) => { notas = Array.isArray(r) ? r : []; if ($("#notas")) desenharNotas(notas); });
    $("#anotar").addEventListener("click", () => {
      const t = $("#texto-nota");
      if (!t.value.trim()) { t.focus(); return; }
      api(`gestao/contratantes/${c.id}/notas`, "POST", { texto: t.value }).then((r) => {
        if (!r.id) return estado(r.erro || "Não deu para anotar.", "ruim");
        notas.unshift(r); t.value = ""; desenharNotas(notas);
      });
    });
    $("#notas").addEventListener("click", (ev) => {
      if (!ev.target.hasAttribute("data-tirar")) return;
      const li = ev.target.closest("[data-n]"), nid = Number(li.dataset.n);
      if (!confirm("Apagar esta anotação?")) return;
      api("gestao/notas/" + nid, "DELETE").then((r) => { if (r.ok) { notas = notas.filter((n) => n.id !== nid); desenharNotas(notas); } });
    });
  }

  /* ---------- whatsapp ---------- */
  // abre o WhatsApp com o link que o servidor devolveu; a janela é aberta já no toque para o navegador não bloquear
  function abrirNoWhats(registrar) {
    let janela = null;
    if (D.config.simulacao !== "1") { try { janela = window.open("", "_blank"); } catch { janela = null; } }
    return registrar().then((r) => {
      if (!r.link || r.simulada || r.repetida) { if (janela) janela.close(); return r; }
      if (janela) { janela.opener = null; janela.location.href = r.link; } else location.href = r.link;
      return r;
    }).catch(() => { if (janela) janela.close(); return { erro: "Sem conexão. Tente de novo." }; });
  }

  function listaMensagens(lista) {
    if (!lista || !lista.length) return '<p class="vazio">Nenhuma mensagem aberta pelo sistema ainda.</p>';
    return `<ul class="notas">${lista.map((m) => `<li data-m="${m.id}">
      <span class="quando">${dataHora(m.criado)} · ${TIPO_MSG[m.tipo] || m.tipo}${m.modelo ? " · " + esc(m.modelo) : ""}${m.simulada ? " · simulação" : ""}</span>
      <span class="etiqueta ${m.situacao === "aberta" ? "e-site" : m.situacao === "enviada" ? "e-fechado" : "e-cancelado"}">${SIT_MSG[m.situacao] || m.situacao}</span>
      <span class="texto">${esc(m.texto)}</span>
      ${m.situacao === "aberta" ? `<span class="acoes-msg"><button class="btn" type="button" data-enviou="1">Enviei</button><button class="btn btn-sec" type="button" data-enviou="0">Não enviei</button><button class="texto-btn" type="button" data-reabrir>Abrir de novo</button></span>` : ""}
    </li>`).join("")}</ul>`;
  }
  function ligarMensagens(caixa, depois) {
    if (!caixa) return;
    caixa.addEventListener("click", (ev) => {
      const li = ev.target.closest("[data-m]");
      if (!li) return;
      const id = li.dataset.m;
      if (ev.target.hasAttribute("data-enviou")) {
        ev.target.disabled = true;
        api(`gestao/mensagens/${id}/confirmar`, "POST", { enviou: ev.target.dataset.enviou === "1" }).then((r) => { if (r.erro) alert(r.erro); depois(); });
      } else if (ev.target.hasAttribute("data-reabrir")) {
        if (!confirm("Abrir esta mesma mensagem de novo no WhatsApp? Não cria um registro novo.")) return;
        abrirNoWhats(() => api(`gestao/mensagens/${id}/reabrir`, "POST", {})).then((r) => { if (r.erro) alert(r.erro); });
      }
    });
  }

  // caixa da ficha: escolhe o modelo, confere o texto e abre no WhatsApp
  function abrirCaixaZap(c, depois) {
    const caixa = $("#caixa-zap");
    if (!caixa.hidden) { caixa.hidden = true; return; }
    caixa.hidden = false;
    caixa.innerHTML = '<p class="ajuda">Carregando os modelos...</p>';
    const chave = chaveNova();
    let regra = null;
    carregarModelos().then(() => {
      const ativos = modelos.filter((m) => m.ativo);
      // sugere o modelo da etapa da casa, de preferência o do mesmo perfil musical
      const etapa = { contatar: "primeiro", contatado: "cobranca", negociando: "proposta" }[c.etapa] || "outro";
      const daEtapa = ativos.filter((m) => m.etapa === etapa);
      const sugerido = daEtapa.find((m) => c.perfil && m.perfil === c.perfil) || daEtapa.find((m) => !m.perfil) || null;
      caixa.innerHTML = `
        <div class="ficha">
          <label class="c6">Modelo<select id="zap-modelo">${ativos.map((m) => `<option value="${m.id}"${m === sugerido ? " selected" : ""}>${esc(m.nome)} (${nomeDe(ETAPAS_MODELO, m.etapa)})</option>`).join("")}<option value=""${sugerido ? "" : " selected"}>Escrever sem modelo</option></select></label>
          <label class="c6">Mensagem (pode ajustar antes de abrir)<textarea id="zap-texto" rows="8"></textarea></label>
        </div>
        <p class="estado" id="zap-aviso" role="status"></p>
        <div class="acoes-rapidas" style="margin:12px 0 0"><button class="btn" type="button" id="zap-abrir">Abrir no WhatsApp</button><button class="texto-btn" type="button" id="zap-fechar">Cancelar</button></div>
        <p class="ajuda" style="margin:12px 0 0">Versão gratuita: o sistema abre o seu WhatsApp com o texto pronto, e quem envia é você. Não há envio automático nem aviso de entregue ou lida. As respostas chegam só no celular: marque aqui "Respondeu" ou "Pediu para parar".</p>`;
      const aviso = (t, tipo) => { const e = $("#zap-aviso"); e.textContent = t; e.className = "estado" + (tipo ? " " + tipo : ""); };
      const previa = () => {
        const id = $("#zap-modelo").value;
        api("gestao/mensagens/previa", "POST", { contratante_id: c.id, modelo_id: id ? Number(id) : null, texto: id ? null : $("#zap-texto").value }).then((r) => {
          if (id) $("#zap-texto").value = r.texto || "";
          regra = r.regra;
          const problemas = [...(r.erros || []), ...(r.regra && !r.regra.ok ? [r.regra.erro] : [])];
          aviso(problemas.join(" ") || (r.simulacao ? "Modo simulação: a mensagem fica registrada como teste e o WhatsApp não abre." : r.tipo === "abordagem" ? "Primeiro contato: conta no limite diário de novas abordagens." : ""), problemas.length ? "ruim" : "");
        });
      };
      $("#zap-modelo").addEventListener("change", previa);
      $("#zap-fechar").addEventListener("click", () => { caixa.hidden = true; });
      $("#zap-abrir").addEventListener("click", () => {
        let forcar = false;
        if (regra && !regra.ok && regra.codigo === "intervalo") {
          if (!confirm(regra.erro + "\n\nAbrir mesmo assim?")) return;
          forcar = true;
        }
        const b = $("#zap-abrir"); b.disabled = true;
        const id = $("#zap-modelo").value;
        abrirNoWhats(() => api("gestao/mensagens", "POST", { chave, contratante_id: c.id, modelo_id: id ? Number(id) : null, texto: $("#zap-texto").value, forcar })).then((r) => {
          b.disabled = false;
          if (r.erro) return aviso(r.erro, "ruim");
          caixa.hidden = true;
          depois();
        });
      });
      if (!ativos.length) aviso("Nenhum modelo ativo. Escreva a mensagem ou crie um modelo em Campanhas > Modelos.");
      previa();
    });
  }

  /* ---------- importar ---------- */
  function telaImportar() {
    const exemplo = "﻿Nome;Contato;Telefone;E-mail;Cidade;UF;Categoria;Perfil;Observações\r\nBar do Exemplo;Ana Souza;(31) 99999-0000;contato@bardoexemplo.com.br;Betim;MG;Bar ou casa de show;Autoral;Toca rock às sextas\r\n";
    tela.innerHTML = `
      <a class="voltar" href="#contratantes">Voltar para contratantes</a>
      <div class="cabeca"><h1 class="display">Importar planilha</h1></div>
      <p class="ajuda">Salve a planilha como CSV (no Excel: Arquivo > Salvar como > CSV; no Google Planilhas: Arquivo > Fazer download > CSV). A primeira linha precisa ter os títulos. Colunas reconhecidas: Nome, Contato, Telefone (ou WhatsApp), E-mail, Cidade, UF, Categoria, Perfil, Instagram, Observações. Até 1.000 linhas por vez.</p>
      <p class="ajuda">Antes de gravar, o sistema mostra quantas linhas entram e quais ficam de fora, com o motivo. Quem é importado entra como "a contatar": a importação não conta como contato feito nem autoriza mensagens.</p>
      <div class="acoes-rapidas"><a class="btn btn-sec" download="modelo-contratantes-7a.csv" href="data:text/csv;charset=utf-8,${encodeURIComponent(exemplo)}">Baixar planilha de exemplo</a></div>
      <label style="max-width:520px">Arquivo CSV<input type="file" id="arquivo" accept=".csv,text/csv"></label>
      <p class="estado" id="estado" role="status" style="margin-top:12px"></p>
      <div id="previa-csv"></div>`;
    let csv = "";
    $("#arquivo").addEventListener("change", (ev) => {
      const arq = ev.target.files[0];
      if (!arq) return;
      $("#previa-csv").innerHTML = "";
      estado("Lendo o arquivo...");
      arq.arrayBuffer().then((buf) => {
        // Excel em português costuma salvar em Windows-1252; Google Planilhas, em UTF-8
        try { csv = new TextDecoder("utf-8", { fatal: true }).decode(buf); } catch { csv = new TextDecoder("windows-1252").decode(buf); }
        return api("gestao/contratantes/importar", "POST", { csv });
      }).then((r) => {
        if (r.erro) return estado(r.erro, "ruim");
        estado("");
        $("#previa-csv").innerHTML = `
          <dl class="numeros" style="margin-top:8px"><div><dt>Entram</dt><dd class="num">${r.entram}</dd><small>de ${r.total} linhas</small></div><div><dt>Ficam de fora</dt><dd class="num">${r.recusadas.length}</dd></div><div><dt>Colunas reconhecidas</dt><dd style="font:600 15px/1.4 var(--f-texto)">${r.colunas.map(esc).join(", ")}</dd></div></dl>
          ${r.amostra.length ? `<h2 class="display">Como vão entrar</h2><ul class="lista">${r.amostra.map((x) => `<li><div class="item"><span class="nome">${esc(x.nome)}</span><span class="meta">${[x.contato, x.telefone, x.cidade].filter(Boolean).map(esc).join(" · ") || "&nbsp;"}</span></div></li>`).join("")}</ul>${r.entram > r.amostra.length ? `<p class="ajuda">E mais ${r.entram - r.amostra.length}.</p>` : ""}` : ""}
          ${r.recusadas.length ? `<h2 class="display">Ficam de fora</h2><ul class="lista">${r.recusadas.map((x) => `<li><div class="item"><span class="nome">Linha ${x.linha}: ${esc(x.nome)}</span><span class="meta">${esc(x.motivo)}</span></div></li>`).join("")}</ul>` : ""}
          ${r.entram ? `<div class="salvar-barra"><button class="btn" type="button" id="importar">Importar ${r.entram} contato${r.entram > 1 ? "s" : ""}</button><p class="estado" id="estado-imp" role="status"></p></div>` : '<p class="vazio">Nenhuma linha pode entrar. Corrija o arquivo e escolha de novo.</p>'}`;
        if (!r.entram) return;
        $("#importar").addEventListener("click", (ev) => {
          ev.target.disabled = true;
          api("gestao/contratantes/importar", "POST", { csv, confirmar: true }).then((f) => {
            if (f.erro) { ev.target.disabled = false; $("#estado-imp").textContent = f.erro; return; }
            $("#previa-csv").innerHTML = `<p class="aviso">${f.inseridos} contato${f.inseridos === 1 ? "" : "s"} importado${f.inseridos === 1 ? "" : "s"}${f.recusadas.length ? `, ${f.recusadas.length} linha${f.recusadas.length > 1 ? "s" : ""} de fora` : ""}. <a href="#contratantes">Ver contratantes</a></p>`;
            $("#arquivo").value = "";
            api("gestao/dados").then((d) => { if (d.contratantes) D = d; });
          });
        });
      }).catch(() => estado("Não deu para ler o arquivo.", "ruim"));
    });
  }

  /* ---------- shows ---------- */
  function itemShow(s) {
    const c = contratante(s.contratante_id);
    const onde = [s.evento, s.local || (c && c.nome), s.cidade].filter(Boolean).map(esc).join(" · ");
    const quando = s.data ? `<span class="dia num">${s.data.slice(8)}</span><span class="mes">${MESES[Number(s.data.slice(5, 7)) - 1].slice(0, 3)}</span>` : '<span class="mes">Sem data</span>';
    return `<li><a class="item show-item${s.status === "cancelado" ? " cancelado" : ""}" href="#show/${s.id}">
      <span class="quando">${quando}</span>
      <span class="nome">${esc(nomeArtista(s))}</span>
      <span class="lado"><span class="etiqueta e-${s.status}">${nomeDe(STATUS, s.status)}</span>${s.cache ? `<span class="valor num">${reais(s.cache)}</span>` : ""}</span>
      <span class="meta">${onde || "&nbsp;"}</span></a></li>`;
  }

  function telaShows() {
    const h = hoje();
    const conta = (st) => D.shows.filter((s) => (!st || s.status === st) && (filtro.passados || !s.data || s.data >= h)).length;
    const lista = D.shows
      .filter((s) => (!filtro.status || s.status === filtro.status) && (filtro.passados || !s.data || s.data >= h))
      .sort((a, b) => filtro.passados ? (b.data || "9").localeCompare(a.data || "9") : (a.data || "9").localeCompare(b.data || "9"));
    let html = "", mesAtual = null;
    for (const s of lista) {
      const m = s.data ? s.data.slice(0, 7) : "sem";
      if (m !== mesAtual) {
        if (mesAtual !== null) html += "</ul>";
        html += `<h2 class="mes-titulo">${m === "sem" ? "Sem data" : MESES[Number(m.slice(5)) - 1] + (m.slice(0, 4) !== h.slice(0, 4) ? " " + m.slice(0, 4) : "")}</h2><ul class="lista">`;
        mesAtual = m;
      }
      html += itemShow(s);
    }
    if (mesAtual !== null) html += "</ul>";
    tela.innerHTML = `
      <div class="cabeca"><h1 class="display">Shows</h1><a class="btn" href="#show/novo">Novo show</a></div>
      <div class="filtros" role="group" aria-label="Status do show">
        <button type="button" data-status="" aria-pressed="${!filtro.status}">Todos<span class="conta">${conta("")}</span></button>
        ${STATUS.map(([k, n]) => `<button type="button" data-status="${k}" aria-pressed="${filtro.status === k}">${n}<span class="conta">${conta(k)}</span></button>`).join("")}
      </div>
      <p><label class="marcar"><input type="checkbox" id="passados"${filtro.passados ? " checked" : ""}> Mostrar shows que já passaram</label></p>
      ${html || `<p class="vazio">${D.shows.length ? "Nenhum show com esse filtro." : "Nenhum show ainda. Cadastre cada pedido de data como consulta e vá mudando o status até realizado."}</p>`}`;
    tela.querySelectorAll("[data-status]").forEach((x) => x.addEventListener("click", () => { filtro.status = x.dataset.status; telaShows(); }));
    $("#passados").addEventListener("change", (ev) => { filtro.passados = ev.target.checked; telaShows(); });
  }

  function fichaShow(id) {
    const [chave, query] = String(id || "").split("?");
    const novo = chave === "novo";
    const doContratante = novo ? Number(new URLSearchParams(query || "").get("c")) || null : null;
    const base = contratante(doContratante);
    const s = novo
      ? { data: "", hora: "", artista: Object.keys(artistas)[0] || "", artista_texto: "", contratante_id: doContratante, evento: "", local: base ? base.nome : "", cidade: base ? base.cidade : "", status: "consulta", cache: 0, pct: D.config.pct_padrao === "" ? null : Number(D.config.pct_padrao), despesas: 0, recebido: 0, repassado: 0, publicar: 1, link: "", obs: "" }
      : D.shows.find((x) => x.id === Number(chave));
    if (!s) { tela.innerHTML = '<a class="voltar" href="#shows">Voltar para shows</a><p class="vazio">Show não encontrado.</p>'; return; }
    const listaArt = [...Object.entries(artistas), ["", "Outro artista"]];

        <label class="meia">Data<input name="data" type="date" value="${esc(s.data)}"></label>
        <label class="meia">Hora<input name="hora" type="time" value="${esc(s.hora)}"></label>
        <label class="c6">Contratante<select name="contratante_id">${opcoes(listaCont, s.contratante_id ? String(s.contratante_id) : "")}</select></label>
        <label class="c2">Nome do evento<input name="evento" value="${esc(s.evento)}" placeholder="Opcional" autocomplete="off"></label>
        <label class="c2">Local<input name="local" value="${esc(s.local)}" autocomplete="off"></label>
        <label class="c2">Cidade<input name="cidade" value="${esc(s.cidade)}" placeholder="Betim, MG" autocomplete="off"></label>
        <label class="meia">Cachê (R$)<input name="cache" inputmode="decimal" value="${campoReais(s.cache)}" placeholder="0,00" autocomplete="off"></label>
        <label class="meia">% da 7A<input name="pct" inputmode="decimal" value="${s.pct == null ? "" : String(s.pct).replace(".", ",")}" placeholder="${D.config.pct_padrao === "" ? "Defina em Ajustes" : "Padrão: " + String(D.config.pct_padrao).replace(".", ",")}" autocomplete="off"></label>
        <label class="c2 meia" title="Transporte, som, hospedagem">Despesas (R$)<input name="despesas" inputmode="decimal" value="${campoReais(s.despesas)}" placeholder="Transporte, som, hospedagem" autocomplete="off"></label>
        <label class="c2 meia">Recebido (R$)<input name="recebido" inputmode="decimal" value="${campoReais(s.recebido)}" placeholder="0,00" autocomplete="off"></label>
        <label class="c2 meia">Repassado (R$)<input name="repassado" inputmode="decimal" value="${campoReais(s.repassado)}" placeholder="0,00" autocomplete="off"></label>
        <div class="conta-show" id="conta" aria-live="polite"></div>
        <label class="c6 marcar"><input type="checkbox" name="publicar"${s.publicar ? " checked" : ""}> Mostrar na agenda do site quando estiver confirmado</label>
        <label class="c6">Link de ingressos<input name="link" type="url" value="${esc(s.link)}" placeholder="https://" autocomplete="off"></label>
        <label class="c6">Observações<textarea name="obs" rows="3" placeholder="Horário de passagem de som, rider, forma de pagamento">${esc(s.obs)}</textarea></label>
      </form>
      <div class="salvar-barra">
        <button class="btn" type="button" id="salvar">${novo ? "Cadastrar show" : "Salvar"}</button>
        <p class="estado" id="estado" role="status"></p>
        ${novo ? "" : '<button class="texto-btn perigo apagar" type="button" id="apagar">Apagar show</button>'}
      </div></div>
      ${novo ? "" : `
      <h2 class="display">Proposta</h2>
      <p class="ajuda">Uma página com a marca da 7A, a carta do artista, data, local e cachê deste show. Você manda o link para o contratante, e ele abre no celular ou salva em PDF.</p>
      <form class="ficha" id="ficha-proposta" novalidate>
        <label>Formato<select name="formato">${opcoesLivres(PADRAO.formato)}</select></label>
        <label>Duração<select name="duracao">${opcoesLivres(PADRAO.duracao)}</select></label>
        <label class="c6 outro-texto" data-outro="formato" hidden>Escreva o formato<input name="formato_outro" autocomplete="off"></label>
        <label class="c6 outro-texto" data-outro="duracao" hidden>Escreva a duração<input name="duracao_outro" autocomplete="off"></label>
        <fieldset class="c6 marcas"><legend>O que está incluso</legend>${PADRAO.inclui.map((t) => `<label class="marcar"><input type="checkbox" name="inclui" value="${esc(t)}"> ${esc(t)}</label>`).join("")}</fieldset>
        <label class="c6">Condições de pagamento<select name="condicoes">${opcoesLivres(PADRAO.condicoes)}</select></label>
        <label class="c6 outro-texto" data-outro="condicoes" hidden>Escreva as condições<input name="condicoes_outro" autocomplete="off"></label>
        <fieldset class="c6 marcas"><legend>O contratante oferece</legend>${PADRAO.rider.map((t) => `<label class="marcar"><input type="checkbox" name="rider" value="${esc(t)}"> ${esc(t)}</label>`).join("")}</fieldset>
        <label class="c2">Validade da proposta<select name="prazo"><option value="7">7 dias</option><option value="15" selected>15 dias</option><option value="30">30 dias</option></select></label>
        <p class="c4 ajuda" id="validade-txt" style="align-self:end;margin:0 0 14px"></p>
      </form>
      <div class="acoes-rapidas" style="margin-top:20px">
        <button class="btn" type="button" id="gerar">Gerar proposta</button>
        <p class="estado" id="estado-proposta" role="status" style="align-self:center;margin:0;font-weight:600"></p>
      </div>
      <div class="acoes-rapidas" id="links-proposta" hidden>
        <a class="btn btn-claro" id="abrir-proposta" target="_blank" rel="noopener">Abrir a proposta</a>
        <a class="btn btn-sec" id="zap-proposta" target="_blank" rel="noopener">Enviar no WhatsApp</a>
        <button class="btn btn-sec" type="button" id="email-proposta">Enviar por e-mail</button>
        <button class="btn btn-sec" type="button" id="copiar-proposta">Copiar link</button>
      </div>
      <div class="ficha" id="caixa-email" hidden>
        <label class="c6">E-mail do contratante<input type="email" id="email-para" autocomplete="off" placeholder="contato@casa.com.br"></label>
        <label class="c6">Recado extra (opcional)<textarea id="email-msg" rows="3" placeholder="Ex.: Temos datas livres em novembro. Se quiser, respondo ainda hoje."></textarea></label>
        <p class="ajuda c6" style="margin:0">O e-mail já sai com "Olá, nome!", os dados do show, a carta do artista, o botão da proposta e a assinatura. O recado entra antes do fechamento. As respostas vão para contato@7aprodutora.com.br.</p>
        <div class="c6 acoes-rapidas" style="margin:0"><button class="btn" type="button" id="email-enviar">Enviar e-mail</button><button class="texto-btn" type="button" id="email-cancelar">Cancelar</button></div>
      </div>`}`;

    const form = $("#ficha");
    const ler = () => {
      const f = Object.fromEntries(new FormData(form));
      const pct = f.pct.trim() === "" ? null : Number(f.pct.replace(",", "."));
      return { ...f, contratante_id: f.contratante_id ? Number(f.contratante_id) : null, cache: centavos(f.cache), despesas: centavos(f.despesas), recebido: centavos(f.recebido), repassado: centavos(f.repassado), pct, publicar: form.publicar.checked ? 1 : 0, artista_texto: f.artista ? "" : f.artista_texto || "" };
    };
    const desenharConta = () => {
      const x = ler(), k = contas(x);
      const pctTxt = k.pct == null ? "" : ` (${String(k.pct).replace(".", ",")}%)`;
      $("#conta").innerHTML = `
        <dl>
          <dt>Cachê</dt><dd class="num">${reais(x.cache)}</dd>
          <dt>Despesas</dt><dd class="num">− ${reais(x.despesas)}</dd>
          <dt>Comissão 7A${pctTxt}</dt><dd class="num">${k.comissao == null ? "Falta o %" : "− " + reais(k.comissao)}</dd>
          <dt class="total">Repasse ao artista</dt><dd class="total num">${reais(k.repasse)}</dd>
        </dl>
        <dl>
          <dt>Falta receber</dt><dd class="num">${reais(k.falta_receber)}</dd>
          <dt>Falta repassar</dt><dd class="num">${reais(k.falta_repassar)}</dd>
        </dl>
        <p>A comissão é calculada sobre ${D.config.base === "liquido" ? "o cachê menos as despesas" : "o cachê bruto"}. Dá para mudar em <a href="#ajustes">Ajustes</a>.</p>`;
    };
    desenharConta();
    form.addEventListener("input", (ev) => {
      sujo = true; estado("");
      if (ev.target.name === "artista") $("#outro").hidden = !!ev.target.value;
      desenharConta();
    });
    form.addEventListener("change", (ev) => {
      if (ev.target.name === "contratante_id" && novo && ev.target.value) {
        const c = contratante(Number(ev.target.value));
        if (c && !form.local.value) form.local.value = c.nome;
        if (c && !form.cidade.value) form.cidade.value = c.cidade;
      }
    });
    $("#salvar").addEventListener("click", () => {
      const dados = ler();
      if (dados.pct != null && !(dados.pct >= 0 && dados.pct <= 100)) { estado("O % da 7A precisa ficar entre 0 e 100.", "ruim"); form.pct.focus(); return; }
      if (!dados.data && dados.status !== "consulta") { estado("Preencha a data. Só uma consulta pode ficar sem data.", "ruim"); form.data.focus(); return; }
      if (!dados.artista && !dados.artista_texto.trim()) { estado("Escreva o nome do artista.", "ruim"); form.artista_texto.focus(); return; }
      salvar(novo ? "gestao/shows" : "gestao/shows/" + s.id, novo ? "POST" : "PUT", dados, (r) => {
        if (novo) D.shows.push(r); else Object.assign(s, r);
        sujo = false;
        if (novo) location.hash = "#show/" + r.id; else estado(r.status === "confirmado" && r.publicar && r.data >= hoje() ? "Salvo. Já aparece na agenda do site." : "Salvo.", "ok");
      });
    });
    if (novo) return;
    montarProposta(s);
    $("#apagar").addEventListener("click", () => {
      if (!confirm("Apagar este show? Se ele não aconteceu, prefira marcar como cancelado.")) return;
      api("gestao/shows/" + s.id, "DELETE").then((r) => {
        if (!r.ok) return estado(r.erro || "Não deu para apagar.", "ruim");
        D.shows = D.shows.filter((x) => x.id !== s.id);
        sujo = false; location.hash = "#shows";
      });
    });
  }

  /* ---------- proposta ---------- */
  // opções padronizadas da proposta; "Outro" abre um campo para escrever
  const PADRAO = {
    formato: ["Banda completa", "Acústico", "Voz e violão", "Duo acústico", "Cabine de DJ"],
    duracao: ["1 hora", "1h30", "2 horas", "2 sets de 1 hora", "3 horas", "3 sets de 1 hora", "4 horas", "5 horas"],
    inclui: ["Som e equipamento de palco do artista", "Transporte dos músicos", "Passagem de som antes do evento", "Divulgação do show nas redes da 7A"],
    condicoes: ["À vista, por Pix, até o dia do show", "50% na confirmação e 50% no dia do show, por Pix", "100% na confirmação, por Pix", "Pix no dia do show, antes da apresentação"],
    rider: ["Ponto de energia perto do palco", "Espaço coberto para a apresentação", "Alimentação e água para os músicos", "Local para descarregar o equipamento"],
  };
  const OUTRO = "__outro";
  const opcoesLivres = (lista) => lista.map((t) => `<option>${esc(t)}</option>`).join("") + `<option value="${OUTRO}">Outro (escrever)</option>`;
  const FORMATOS = { "ordem-mor": "Banda completa", "sub-rosa": "Banda completa", "ossos-do-banquete": "Banda completa", "athos-tibaes": "Voz e violão", aenima: "Duo acústico", "dj-ivan-lennon": "Cabine de DJ" };
  const dataSP = (ms) => new Intl.DateTimeFormat("en-CA", { timeZone: "America/Sao_Paulo" }).format(new Date(ms));

  function montarProposta(s) {
    const form = $("#ficha-proposta"), msg = $("#estado-proposta");
    const aviso = (t, tipo) => { msg.textContent = t; msg.className = "estado" + (tipo ? " " + tipo : ""); };
    let validadeAtual = "";
    const validade = () => validadeAtual || dataSP(Date.now() + Number(form.prazo.value) * 86400e3);
    const mostrarValidade = () => { $("#validade-txt").textContent = "Válida até " + validade().split("-").reverse().join("/"); };
    const outros = () => document.querySelectorAll("[data-outro]").forEach((l) => { l.hidden = form[l.dataset.outro].value !== OUTRO; });
    // coloca um valor salvo no menu; se não for uma das opções, vai para "Outro"
    const escolher = (campo, valor) => {
      const sel = form[campo];
      if (!valor) return;
      if ([...sel.options].some((o) => o.value === valor)) sel.value = valor;
      else { sel.value = OUTRO; form[campo + "_outro"].value = valor; }
    };
    // itens salvos fora do padrão (propostas antigas) aparecem marcados, para poder desmarcar
    const marcar = (campo, texto) => {
      const itens = (texto || "").split("\n").map((t) => t.trim()).filter(Boolean);
      const caixa = form.querySelector(`[name=${campo}]`).closest("fieldset");
      itens.filter((t) => !PADRAO[campo].includes(t)).forEach((t) => caixa.insertAdjacentHTML("beforeend", `<label class="marcar"><input type="checkbox" name="${campo}" value="${esc(t)}"> ${esc(t)}</label>`));
      form.querySelectorAll(`[name=${campo}]`).forEach((c) => { c.checked = itens.includes(c.value); });
    };
    const ler = () => {
      const valor = (campo) => (form[campo].value === OUTRO ? form[campo + "_outro"].value.trim() : form[campo].value);
      const marcados = (campo) => [...form.querySelectorAll(`[name=${campo}]:checked`)].map((c) => c.value).join("\n");
      return { formato: valor("formato"), duracao: valor("duracao"), condicoes: valor("condicoes"), inclui: marcados("inclui"), rider: marcados("rider"), validade: validade() };
    };
    let link = "";
    const mostrarLinks = (token) => {
      link = location.origin + "/proposta/" + token;
      const c = contratante(s.contratante_id);
      const texto = `Olá${c && c.contato ? ", " + c.contato.split(" ")[0] : ""}! Segue a proposta da 7A Produtora para o show de ${nomeArtista(s)}: ${link}`;
      $("#abrir-proposta").href = link;
      const w = c ? whats(c.telefone) : "";
      $("#zap-proposta").href = (w || "https://wa.me/") + "?text=" + encodeURIComponent(texto);
      $("#copiar-proposta").onclick = () => navigator.clipboard.writeText(link).then(() => aviso("Link copiado.", "ok"), () => prompt("Copie o link:", link));
      $("#links-proposta").hidden = false;
      $("#gerar").textContent = "Atualizar proposta";
    };
    api(`gestao/shows/${s.id}/proposta`).then((p) => {
      escolher("formato", p.formato ?? FORMATOS[s.artista]);
      escolher("duracao", p.duracao || "2 horas");
      escolher("condicoes", p.condicoes || PADRAO.condicoes[0]);
      marcar("inclui", p.token ? p.inclui : PADRAO.inclui.slice(0, 2).join("\n"));
      marcar("rider", p.token ? p.rider : "Alimentação e água para os músicos");
      validadeAtual = p.validade || "";
      outros(); mostrarValidade();
      if (p.token) mostrarLinks(p.token);
    });
    form.addEventListener("change", (ev) => {
      aviso(""); outros();
      if (ev.target.name === "prazo") { validadeAtual = ""; mostrarValidade(); }
    });
    $("#gerar").addEventListener("click", () => {
      if (sujo) return aviso("Salve o show antes, para a proposta sair com os dados novos.", "ruim");
      const dados = ler();
      if (!dados.formato || !dados.duracao || !dados.condicoes) return aviso("Escreva o texto do campo marcado como Outro.", "ruim");
      if (!s.cache) aviso("Atenção: o cachê está vazio, a proposta vai dizer \"a combinar\".");
      const b = $("#gerar"); b.disabled = true;
      api(`gestao/shows/${s.id}/proposta`, "PUT", dados).then((r) => {
        b.disabled = false;
        if (!r.token) return aviso(r.erro || "Não deu para gerar a proposta.", "ruim");
        validadeAtual = r.validade; mostrarValidade();
        mostrarLinks(r.token);
        aviso(s.cache ? "Proposta pronta. O link mostra sempre os dados atuais do show." : "Proposta pronta, com o cachê a combinar.", "ok");
      }).catch(() => { b.disabled = false; aviso("Sem conexão. Tente de novo.", "ruim"); });
    });

    // e-mail pelo Resend
    $("#email-proposta").addEventListener("click", () => {
      if (!D.config.email_ativo) return aviso("O envio por e-mail ainda não está ligado: falta a chave do Resend na Cloudflare.", "ruim");
      const c = contratante(s.contratante_id);
      $("#email-para").value = (c && c.email) || "";
      $("#email-msg").value = "";
      $("#caixa-email").hidden = false;
      $("#email-para").focus();
    });
    $("#email-cancelar").addEventListener("click", () => { $("#caixa-email").hidden = true; });
    $("#email-enviar").addEventListener("click", () => {
      const b = $("#email-enviar"), para = $("#email-para").value.trim();
      if (!para) return $("#email-para").focus();
      b.disabled = true; aviso("Enviando...");
      api(`gestao/shows/${s.id}/proposta/email`, "POST", { para, mensagem: $("#email-msg").value }).then((r) => {
        b.disabled = false;
        if (!r.ok) return aviso(r.erro || "Não deu para enviar.", "ruim");
        $("#caixa-email").hidden = true;
        aviso("E-mail enviado para " + para + ". Ficou anotado no histórico do contratante.", "ok");
      }).catch(() => { b.disabled = false; aviso("Sem conexão. Tente de novo.", "ruim"); });
    });
  }

  /* ---------- campanhas ---------- */
  const VERSAO_GRATIS = '<p class="ajuda">Versão gratuita: o sistema monta cada mensagem e abre o seu WhatsApp com o texto pronto; você confere e toca em enviar, uma por vez. Não há envio automático, disparo em lote, nem aviso de entregue ou lida. As respostas chegam só no celular: marque "Respondeu" ou "Pediu para parar" aqui.</p>';

  function telaCampanhas() {
    tela.innerHTML = `
      <div class="cabeca"><h1 class="display">Campanhas</h1><div class="acoes-rapidas" style="margin:0"><a class="btn btn-sec" href="#modelos">Modelos de mensagem</a><a class="btn" href="#campanha/nova">Nova campanha</a></div></div>
      ${VERSAO_GRATIS}
      <div class="filtros" id="periodo" role="group" aria-label="Período dos números">${[7, 30, 90].map((n) => `<button type="button" data-dias="${n}" aria-pressed="${n === 30}">${n} dias</button>`).join("")}</div>
      <dl class="numeros" id="indicadores"><div><dt>Carregando...</dt><dd>&nbsp;</dd></div></dl>
      <h2 class="display">Campanhas</h2>
      <div id="lista-camp"><p class="vazio">Carregando...</p></div>`;
    const indicadores = (dias) => api("gestao/indicadores?dias=" + dias).then((r) => {
      if (!$("#indicadores") || r.enviadas == null) return;
      $("#indicadores").innerHTML = `
        <div><dt>Mensagens enviadas</dt><dd class="num">${r.enviadas}</dd><small>${r.por_tipo.abordagem} primeiros contatos · ${r.por_tipo.cobranca} cobranças · ${r.por_tipo.avulsa} avulsas</small></div>
        <div><dt>Responderam</dt><dd class="num">${r.respostas}</dd><small>${r.taxa_resposta != null ? r.taxa_resposta + "% das enviadas" : "—"}</small></div>
        <div><dt>Pediram para parar</dt><dd class="num">${r.bloqueios}</dd><small>No funil hoje: ${r.funil.negociando} negociando, ${r.funil.fechado} fechados</small></div>`;
    });
    $("#periodo").addEventListener("click", (ev) => {
      const b = ev.target.closest("[data-dias]"); if (!b) return;
      $("#periodo").querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === b));
      indicadores(Number(b.dataset.dias));
    });
    indicadores(30);
    api("gestao/campanhas").then((r) => {
      if (!$("#lista-camp")) return;
      if (!Array.isArray(r)) { $("#lista-camp").innerHTML = `<p class="vazio">${esc(r.erro || "Não deu para carregar.")}</p>`; return; }
      $("#lista-camp").innerHTML = r.length ? `<ul class="lista">${r.map((c) => `<li><a class="item" href="#campanha/${c.id}">
        <span class="nome">${esc(c.nome)}</span>
        <span class="lado"><span class="etiqueta e-${c.status}">${STATUS_CAMP[c.status]}</span>${c.simulada ? "<span>Simulação</span>" : ""}</span>
        <span class="meta">${c.status === "rascunho" ? "Falta revisar a prévia e confirmar" : `${c.total} casas · ${c.pendentes} na fila · ${c.cobrar_hoje ? c.cobrar_hoje + " cobranças para hoje · " : ""}${c.respostas} respostas`}</span></a></li>`).join("")}</ul>`
        : '<p class="vazio">Nenhuma campanha ainda. Uma campanha junta as casas de um público (por exemplo, todas "a contatar" de Betim com perfil autoral) e mostra uma por uma, com a mensagem pronta para abrir no WhatsApp.<br><a class="btn" href="#campanha/nova">Criar a primeira</a></p>';
    });
  }

  function fichaCampanha(id) {
    const voltar = '<a class="voltar" href="#campanhas">Voltar para campanhas</a>';
    if (id === "nova") return carregarModelos().then(() => formCampanha(null));
    tela.innerHTML = voltar + '<p class="vazio">Carregando...</p>';
    Promise.all([api("gestao/campanhas/" + Number(id)), carregarModelos()]).then(([f]) => {
      if (location.hash !== "#campanha/" + id) return;
      if (!f.campanha) { tela.innerHTML = voltar + '<p class="vazio">Campanha não encontrada.</p>'; return; }
      if (f.campanha.status === "rascunho") formCampanha(f.campanha);
      else painelCampanha(f);
    });
  }

  function formCampanha(ca) {
    const novo = !ca;
    const pub = ca ? JSON.parse(ca.publico || "{}") : { lista: "contatar", perfil: "", cidade: "", tipo: "" };
    const v = ca || { nome: "", objetivo: "", modelo_id: null, cobranca_modelo_id: null, cobranca_dias: 3, inicio: "" };
    const ativos = modelos.filter((m) => m.ativo);
    const cidades = [...new Set(D.contratantes.map((c) => c.cidade).filter(Boolean))].sort((a, b) => a.localeCompare(b, "pt-BR"));
    tela.innerHTML = `

        <label class="c2">Público<select name="lista">${opcoes(LISTAS, pub.lista)}</select></label>
        <label class="c2">Perfil musical<select name="perfil"><option value="">Todos</option>${opcoes(PERFIS.slice(1), pub.perfil)}</select></label>
        <label class="c2">Cidade<input name="cidade" list="cidades" value="${esc(pub.cidade)}" placeholder="Todas" autocomplete="off"><datalist id="cidades">${cidades.map((c) => `<option value="${esc(c)}">`).join("")}</datalist></label>
        <label class="c2">Tipo de casa<select name="tipo"><option value="">Todos</option>${opcoes(TIPOS, pub.tipo)}</select></label>
        <label class="c4">Modelo de mensagem<select name="modelo_id"><option value="">Automático (pela etapa e pelo perfil de cada casa)</option>${ativos.map((m) => `<option value="${m.id}"${m.id === v.modelo_id ? " selected" : ""}>${esc(m.nome)}</option>`).join("")}</select></label>
        <label class="c2">Início<input name="inicio" type="datetime-local" value="${esc(v.inicio)}"><span class="dica">Vazio: começa ao confirmar.</span></label>
        <label class="c2">Cobrança sem resposta<select name="cobranca_dias">${[[0, "Sem cobrança"], [3, "3 dias depois"], [5, "5 dias depois"], [7, "7 dias depois"]].map(([n, t]) => `<option value="${n}"${Number(v.cobranca_dias) === n ? " selected" : ""}>${t}</option>`).join("")}</select></label>
        <label class="c4">Modelo da cobrança<select name="cobranca_modelo_id"><option value="">Automático (modelo de cobrança do perfil)</option>${ativos.filter((m) => m.etapa === "cobranca").map((m) => `<option value="${m.id}"${m.id === v.cobranca_modelo_id ? " selected" : ""}>${esc(m.nome)}</option>`).join("")}</select></label>

        ${novo ? "" : '<button class="texto-btn perigo apagar" type="button" id="cancelar">Descartar rascunho</button>'}

    const form = $("#ficha");
    form.addEventListener("input", () => { sujo = true; estado(""); $("#previa").innerHTML = ""; });
    const ler = () => {
      const f = Object.fromEntries(new FormData(form));
      return { nome: f.nome, objetivo: f.objetivo, publico: { lista: f.lista, perfil: f.perfil, cidade: f.cidade.trim(), tipo: f.tipo }, modelo_id: f.modelo_id ? Number(f.modelo_id) : null, cobranca_modelo_id: f.cobranca_modelo_id ? Number(f.cobranca_modelo_id) : null, cobranca_dias: Number(f.cobranca_dias), inicio: f.inicio };

  // o que o operador precisa ver antes de iniciar; a confirmação manda a assinatura desta lista
  function mostrarPrevia(ca, avisoMudou) {
    const caixa = $("#previa");
    caixa.innerHTML = '<p class="vazio">Montando a prévia...</p>';
    api(`gestao/campanhas/${ca.id}/previa`).then((p) => desenharPrevia(ca, p, avisoMudou));
  }
  function desenharPrevia(ca, p, avisoMudou) {
    const caixa = $("#previa");
    if (!caixa) return;
    if (!p.incluidos) { caixa.innerHTML = `<p class="vazio">${esc(p.erro || "Não deu para montar a prévia.")}</p>`; return; }
    const e = p.estimativa;
    const porMotivo = {};
    p.excluidos.forEach((x) => { const k = x.motivo.replace(/ \(.*\)$/, "").replace(/"[^"]*"/, "outra"); porMotivo[k] = (porMotivo[k] || 0) + 1; });
    caixa.innerHTML = `
      <h2 class="display">Prévia</h2>
      ${avisoMudou ? `<p class="aviso aviso-forte">${esc(avisoMudou)}</p>` : ""}
      ${p.alertas.map((a) => `<p class="aviso">${esc(a)}</p>`).join("")}
      <dl class="numeros">
        <div><dt>Destinatários</dt><dd class="num">${p.incluidos.length}</dd><small>${e.toques} toques para abrir, um por mensagem, e um para confirmar cada envio</small></div>
        <div><dt>Excluídos</dt><dd class="num">${p.excluidos.length}</dd><small>${Object.entries(porMotivo).map(([k, n]) => `${n} ${k.toLowerCase()}`).join(" · ") || "Nenhum"}</small></div>
        <div><dt>Quando</dt><dd style="font:700 16px/1.4 var(--f-texto)">${p.inicio ? `${dataCurta(p.inicio.slice(0, 10))} às ${p.inicio.slice(11)}` : "Ao confirmar"}</dd><small>${e.abordagens} primeiros contatos · limite de ${e.limite} por dia${e.dias > 1 ? ` · uns ${e.dias} dias` : ""}${p.cobranca.dias ? ` · cobrança ${p.cobranca.dias} dias depois, sem resposta (${esc(p.cobranca.modelo)})` : " · sem cobrança"}</small></div>
      </dl>
      ${p.incluidos.length ? `<h2 class="display">Quem recebe</h2><ul class="lista">${p.incluidos.map((x, i) => `<li><details class="item item-texto"><summary><span class="nome">${i + 1}. ${esc(x.nome)}</span><span class="meta">${[x.cidade, x.telefone, x.modelo].filter(Boolean).map(esc).join(" · ")}</span></summary><p class="texto-msg">${esc(x.texto)}</p></details></li>`).join("")}</ul>` : ""}
      ${p.excluidos.length ? `<h2 class="display">Ficam de fora</h2><ul class="lista">${p.excluidos.map((x) => `<li><a class="item" href="#contratante/${x.contratante_id}"><span class="nome">${esc(x.nome)}</span><span class="meta">${esc(x.motivo)}</span></a></li>`).join("")}</ul>` : ""}
      ${p.incluidos.length ? `<div class="salvar-barra"><button class="btn" type="button" id="confirmar">Confirmar e iniciar com ${p.incluidos.length} casa${p.incluidos.length > 1 ? "s" : ""}</button><p class="estado" id="estado-conf" role="status"></p></div>` : ""}`;
    if (!p.incluidos.length) return;
    $("#confirmar").addEventListener("click", (ev) => {
      if (sujo) return ($("#estado-conf").textContent = "Salve as mudanças antes de confirmar.");
      if (!confirm(`Iniciar "${ca.nome}" com ${p.incluidos.length} casas? A fila grava exatamente esta lista. Cada mensagem ainda depende do seu toque.`)) return;
      ev.target.disabled = true;
      api(`gestao/campanhas/${ca.id}/confirmar`, "POST", { assinatura: p.assinatura }).then((r) => {
        if (r.codigo === "mudou") return desenharPrevia(ca, r.previa, r.erro);
        if (r.erro) { ev.target.disabled = false; $("#estado-conf").textContent = r.erro; return; }
        fichaCampanha(String(ca.id));
      });
    });
  }

      <h2 class="display">Histórico</h2>
