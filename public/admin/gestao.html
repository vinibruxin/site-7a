  /* ---------- conversa da casa: o que ela respondeu, o que a equipe enviou e o rascunho da Évora ---------- */
  function telaConversa(id) {
    tela.innerHTML = '<a class="voltar" href="#funil">Voltar para o funil</a><p class="vazio">Carregando...</p>';
    api(`gestao/contratantes/${Number(id)}/conversa`).then((r) => {
      if (location.hash !== "#conversa/" + id) return;
      if (r.erro) { tela.innerHTML = `<a class="voltar" href="#funil">Voltar para o funil</a><p class="vazio">${esc(r.erro)}</p>`; return; }
      const c = r.contratante;
      const fone = String(c.telefone || "").replace(/^55/, "").replace(/^(\d{2})(\d{4,5})(\d{4})$/, "($1) $2-$3");
      const quando = (iso) => new Date(iso).toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
      const bolhas = r.itens.map((i) => {
        if (i.quem === "casa") return `<div class="bolha casa">${esc(i.texto)}<small>${esc(c.nome)} · ${quando(i.criado)}</small></div>`;
        if (i.quem === "evora") return `<div class="bolha evora">${esc(i.texto)}<small>Rascunho da Évora · ${quando(i.criado)}</small>
            <div class="acoes-rapidas"><a class="btn btn-sec" href="#mensagem/${i.mensagemId}">Editar</a><button class="btn" type="button" data-conv="abrir" data-id="${i.mensagemId}">Enviar no WhatsApp</button><button class="texto-btn" type="button" data-conv="descartar" data-id="${i.mensagemId}">Descartar</button></div></div>`;
        const etiqueta = i.situacao === "enviada" ? "Enviada" : "Falta confirmar";
        const botoes = i.situacao === "aberta" ? `<div class="acoes-rapidas"><button class="btn btn-sec" type="button" data-conv="reabrir" data-id="${i.mensagemId}">Abrir de novo</button><button class="btn" type="button" data-conv="enviei" data-id="${i.mensagemId}">Enviei</button><button class="texto-btn" type="button" data-conv="nao" data-id="${i.mensagemId}">Não enviei</button></div>` : "";
        return `<div class="bolha equipe">${esc(i.texto)}<small>${etiqueta} · ${quando(i.criado)}</small>${botoes}</div>`;
      }).join("");
      tela.innerHTML = `<a class="voltar" href="#funil">Voltar para o funil</a>
        <div class="cabeca"><h1 class="display">${esc(c.nome)}</h1><a class="btn btn-sec" href="#contratante/${c.id}">Ficha da casa</a></div>
        <p class="ajuda">${fone ? "WhatsApp " + esc(fone) : "Sem WhatsApp cadastrado"}</p>
        <div class="conversa" id="conversa">${bolhas || '<p class="vazio">Ainda não há conversa com esta casa.</p>'}</div>
        <div class="nova-nota" style="width:100%"><label>Resposta da casa<textarea id="conv-texto" rows="3" placeholder="Cole aqui o que a casa mandou no WhatsApp"></textarea></label><button class="btn" type="button" id="conv-registrar">Registrar resposta</button><p class="estado" id="conv-estado" role="status"></p></div>`;
      window.scrollTo(0, document.body.scrollHeight);
      const recarregar = () => telaConversa(id);
      $("#conv-registrar").addEventListener("click", () => {
        const texto = $("#conv-texto").value.trim(), e = $("#conv-estado");
        if (!texto) { e.textContent = "Cole a mensagem que a casa mandou."; e.className = "estado ruim"; return; }
        api(`gestao/contratantes/${c.id}/resposta`, "POST", { texto }).then((x) => (x.erro ? (e.textContent = x.erro, e.className = "estado ruim") : recarregar()));
      });
      $("#conversa").addEventListener("click", (ev) => {
        const b = ev.target.closest && ev.target.closest("[data-conv]");
        if (!b) return;
        const mid = b.dataset.id, acao = b.dataset.conv;
        if (acao === "abrir") abrirNoWhats(() => api(`gestao/mensagens/${mid}/abrir`, "POST", {})).then((x) => (x.erro ? alert(x.erro) : recarregar()));
        else if (acao === "reabrir") abrirNoWhats(() => api(`gestao/mensagens/${mid}/reabrir`, "POST", {})).then((x) => (x.erro ? alert(x.erro) : recarregar()));
        else if (acao === "descartar") { if (confirm("Descartar este rascunho?")) api(`gestao/mensagens/${mid}/descartar`, "POST", {}).then((x) => (x.erro ? alert(x.erro) : recarregar())); }
        else api(`gestao/mensagens/${mid}/confirmar`, "POST", { enviou: acao === "enviei" }).then((x) => (x.erro ? alert(x.erro) : recarregar()));
      });
    });
  }

  /* ---------- mensagem: ler por completo, editar e enviar ---------- */
  function telaMensagem(id) {
    tela.innerHTML = '<a class="voltar" href="#whatsapp">Voltar para WhatsApp</a><p class="vazio">Carregando...</p>';
    api(`gestao/mensagens/${Number(id)}`).then((r) => {
      if (location.hash !== "#mensagem/" + id) return;
      if (r.erro || !r.mensagem) { tela.innerHTML = '<a class="voltar" href="#whatsapp">Voltar para WhatsApp</a><p class="vazio">Mensagem não encontrada.</p>'; return; }
      const m = r.mensagem, nome = r.contratante ? r.contratante.nome : "Contratante";
      const fone = String(m.telefone || "").replace(/^55/, "").replace(/^(\d{2})(\d{4,5})(\d{4})$/, "($1) $2-$3");
      const aberta = m.situacao === "aberta", rascunho = m.situacao === "rascunho", editavel = aberta || rascunho;
      const situacao = rascunho ? "pronta para enviar" : aberta ? "aberta, falta confirmar o envio" : (SIT_MSG[m.situacao] || m.situacao);
      tela.innerHTML = `<a class="voltar" href="#whatsapp">Voltar para WhatsApp</a>
        <div class="cabeca"><h1 class="display">${esc(nome)}</h1></div>
        <p class="ajuda">Para ${esc(fone)} · ${esc(situacao)}</p>
        <div class="nova-nota" style="width:100%"><label>Mensagem<textarea id="msg-texto" rows="8" ${editavel ? "" : "disabled"}>${esc(m.texto)}</textarea></label></div>
        <p class="estado" id="msg-estado" role="status"></p>
        <div class="acoes-rapidas">
          ${editavel ? '<button class="btn btn-sec" type="button" id="msg-salvar">Salvar texto</button>' : ""}
          ${editavel ? `<button class="btn" type="button" id="msg-enviar">${aberta ? "Abrir de novo no WhatsApp" : "Enviar no WhatsApp"}</button>` : ""}
          ${aberta ? '<button class="btn btn-sec" type="button" id="msg-enviei">Enviei</button><button class="texto-btn" type="button" id="msg-nao">Não enviei</button>' : ""}
          ${rascunho ? '<button class="texto-btn perigo" type="button" id="msg-descartar">Descartar</button>' : ""}
        </div>`;
      const estado = (t, tipo) => { const e = $("#msg-estado"); e.textContent = t; e.className = "estado" + (tipo ? " " + tipo : ""); };
      const salvar = () => {
        const texto = $("#msg-texto").value.trim();
        return api(`gestao/mensagens/${m.id}/texto`, "PUT", { texto }).then((x) => (x.erro ? (estado(x.erro, "ruim"), null) : x));
      };
      if ($("#msg-salvar")) $("#msg-salvar").addEventListener("click", () => salvar().then((x) => x && estado("Texto salvo.", "ok")));
      if ($("#msg-enviar")) $("#msg-enviar").addEventListener("click", () => {
        // se o texto mudou, salva antes de abrir: o WhatsApp abre com o que está na tela
        const mudou = $("#msg-texto").value.trim() !== m.texto;
        (mudou ? salvar() : Promise.resolve({ mensagem: m })).then((x) => {
          if (!x) return;
          abrirNoWhats(() => api(`gestao/mensagens/${m.id}/${aberta ? "reabrir" : "abrir"}`, "POST", {})).then((y) => {
            if (y.erro) return estado(y.erro, "ruim");
            telaMensagem(id); // recarrega já com os botões de confirmação
          });
        });
      });
      if ($("#msg-enviei")) $("#msg-enviei").addEventListener("click", () => api(`gestao/mensagens/${m.id}/confirmar`, "POST", { enviou: true }).then((x) => (x.erro ? estado(x.erro, "ruim") : (location.hash = "#whatsapp"))));
      if ($("#msg-nao")) $("#msg-nao").addEventListener("click", () => api(`gestao/mensagens/${m.id}/confirmar`, "POST", { enviou: false }).then((x) => (x.erro ? estado(x.erro, "ruim") : (location.hash = "#whatsapp"))));
      if ($("#msg-descartar")) $("#msg-descartar").addEventListener("click", () => { if (confirm("Descartar esta mensagem?")) api(`gestao/mensagens/${m.id}/descartar`, "POST", {}).then((x) => (x.erro ? estado(x.erro, "ruim") : (location.hash = "#whatsapp"))); });
    });
  }

  // fila: rascunhos da Évora (abrir ou descartar) e mensagens abertas (confirmar se foram enviadas)
  // vista: "enviar" (rascunhos e mensagens aguardando confirmação) ou "enviadas"
  function carregarFila(vista = "enviar") {
    const box = $("#fila-mensagens");
    if (!box) return;
    api("gestao/fila").then((f) => {
      if (f.erro) { box.innerHTML = `<p class="vazio">${esc(f.erro)}</p>`; return; }
      const aEnviar = f.rascunhos.length + f.abertas.length;
      const abas = `<div class="acoes-rapidas"><button class="${vista === "enviar" ? "btn" : "btn btn-sec"}" type="button" data-vista="enviar">A enviar (${aEnviar})</button><button class="${vista === "enviadas" ? "btn" : "btn btn-sec"}" type="button" data-vista="enviadas">Enviadas (${f.enviadas.length})</button></div>`;
      if (vista === "enviadas") {
        const fone0 = (t) => { const d = String(t || "").replace(/^55/, ""); return d.replace(/^(\d{2})(\d{4,5})(\d{4})$/, "($1) $2-$3") || t; };
        const itens = f.enviadas.map((m) => `<li data-m="${m.id}">
          <a class="item" href="#mensagem/${m.id}"><span class="nome">${esc(m.nome)}</span><span class="lado"><span class="etiqueta">Enviada</span></span><span class="meta">Para ${esc(fone0(m.telefone))}</span><span class="meta">${esc(m.texto).replace(/\n/g, "<br>")}</span></a>
        </li>`).join("");
        box.innerHTML = abas + (itens ? `<ul class="lista">${itens}</ul>` : '<p class="vazio">Nenhuma mensagem enviada ainda.</p>');
        return;
      }
      // número como aparece para a pessoa: (31) 99223-3295
      const fone = (t) => { const d = String(t || "").replace(/^55/, ""); return d.replace(/^(\d{2})(\d{4,5})(\d{4})$/, "($1) $2-$3") || t; };
      const rascunhos = f.rascunhos.map((m) => `<li data-m="${m.id}">
          <a class="item" href="#mensagem/${m.id}"><span class="nome">${esc(m.nome)}</span><span class="lado"><span class="etiqueta">Pronta para enviar</span></span><span class="meta">Para ${esc(fone(m.telefone))}</span><span class="meta">${esc(m.texto).replace(/\n/g, "<br>")}</span></a>
          <div class="acoes-rapidas"><button class="btn" type="button" data-fila="abrir" data-id="${m.id}">Enviar no WhatsApp</button><button class="texto-btn" type="button" data-fila="descartar" data-id="${m.id}">Descartar</button></div>
        </li>`).join("");
      const abertas = f.abertas.map((m) => `<li data-m="${m.id}">
          <a class="item" href="#mensagem/${m.id}"><span class="nome">${esc(m.nome)}</span><span class="lado"><span class="etiqueta">Falta confirmar</span></span><span class="meta">Para ${esc(fone(m.telefone))}</span><span class="meta">${esc(m.texto).replace(/\n/g, "<br>")}</span></a>
          <div class="acoes-rapidas"><button class="btn btn-sec" type="button" data-fila="reabrir" data-id="${m.id}">Abrir de novo</button><button class="btn" type="button" data-fila="enviei" data-id="${m.id}">Enviei</button><button class="texto-btn" type="button" data-fila="nao" data-id="${m.id}">Não enviei</button></div>
        </li>`).join("");
      box.innerHTML = abas + (!rascunhos && !abertas
        ? '<p class="vazio">Nenhuma mensagem para enviar. Quando a Évora preparar um rascunho, ele aparece aqui.</p>'
        : `${rascunhos ? `<ul class="lista">${rascunhos}</ul>` : ""}${abertas ? `<ul class="lista">${abertas}</ul>` : ""}`);
    });
  }
  // delegação: os botões da fila são recriados a cada carga
  document.addEventListener("click", (ev) => {
    const aba = ev.target.closest && ev.target.closest("[data-vista]");
    if (aba) { carregarFila(aba.dataset.vista); return; }
    const b = ev.target.closest && ev.target.closest("[data-fila]");
    if (!b) return;
    const id = b.dataset.id, acao = b.dataset.fila;
    if (acao === "abrir") abrirNoWhats(() => api(`gestao/mensagens/${id}/abrir`, "POST", {})).then((r) => { if (r.erro) alert(r.erro); carregarFila(); });
    else if (acao === "reabrir") abrirNoWhats(() => api(`gestao/mensagens/${id}/reabrir`, "POST", {})).then((r) => { if (r.erro) alert(r.erro); carregarFila(); });
    else if (acao === "descartar") { if (confirm("Descartar este rascunho?")) api(`gestao/mensagens/${id}/descartar`, "POST", {}).then((r) => { if (r.erro) alert(r.erro); carregarFila(); }); }
    else api(`gestao/mensagens/${id}/confirmar`, "POST", { enviou: acao === "enviei" }).then((r) => { if (r.erro) alert(r.erro); carregarFila(); });
  });

  function desenharHoje() {
    const h = hoje(), d = dia(h);
    const ativos = D.shows.filter((s) => s.status === "confirmado" || s.status === "realizado");
    const aReceber = ativos.reduce((t, s) => t + Math.max(0, s.cache - s.recebido), 0);
    const aRepassar = ativos.reduce((t, s) => { const k = contas(s); return t + Math.max(0, k.falta_repassar || 0); }, 0);
    const mes = h.slice(0, 7);
    const doMes = ativos.filter((s) => s.data.startsWith(mes));
    const comissaoMes = doMes.reduce((t, s) => t + (contas(s).comissao || 0), 0);
    const semPct = D.config.pct_padrao === "" && doMes.some((s) => s.pct == null);
    const fazer = D.fazer || [];
    const atrasadas = fazer.filter((c) => c.proxima_data < h);
    const deHoje = fazer.filter((c) => c.proxima_data === h);
    const vivos = D.shows.filter((s) => s.data && s.data >= h && s.status !== "cancelado");
    const semana = vivos.filter((s) => diasEntre(h, s.data) <= 7);
    const depois = vivos.filter((s) => diasEntre(h, s.data) > 7 && diasEntre(h, s.data) <= 60);
    // o que falta em cada show da semana, para nada chegar no dia sem estar resolvido
    const pendencias = (s) => [s.status !== "confirmado" && s.status !== "realizado" ? "falta confirmar" : "", s.cache > s.recebido ? "falta receber " + reais(s.cache - s.recebido) : "", !s.hora ? "sem horário" : ""].filter(Boolean);
    const contagem = Object.fromEntries(ETAPAS.map(([k]) => [k, 0]));
    D.contratantes.forEach((c) => { contagem[c.etapa] = (contagem[c.etapa] || 0) + 1; });
    const plural = (n, um, varios) => `${n} ${n === 1 ? um : varios}`;

    tela.innerHTML = `
      <div class="cabeca"><div><h1 class="display">Hoje</h1><p>${DIAS[d.getUTCDay()]}, ${d.getUTCDate()} de ${MESES[d.getUTCMonth()]}</p></div>
        <div class="acoes-rapidas" style="margin:0"><a class="btn btn-sec" href="#contratante/novo">Nova casa</a><a class="btn" href="#show/novo">Novo show</a></div></div>
      ${D.config.simulacao === "1" ? '<p class="aviso">Modo simulação ligado: as mensagens são registradas como teste e o WhatsApp não abre. Desligue em <a href="#ajustes">Ajustes</a>.</p>' : ""}
      <p class="resumo-dia">${fazer.length ? `${plural(fazer.length, "casa pede", "casas pedem")} ação${atrasadas.length ? `, ${plural(atrasadas.length, "atrasada", "atrasadas")}` : ""}` : "Nenhuma casa esperando ação"} · ${semana.length ? plural(semana.length, "show nesta semana", "shows nesta semana") : "nenhum show nesta semana"}<span id="resumo-fila"></span></p>

      <h2 class="display">Para fazer</h2>
      ${fazer.length ? `
        ${atrasadas.length ? `<h3 class="sub">Atrasadas</h3><ul class="lista lista-contratantes">${atrasadas.map((c) => itemContratante(c, true)).join("")}</ul>` : ""}
        ${deHoje.length ? `<h3 class="sub">Para hoje</h3><ul class="lista lista-contratantes">${deHoje.map((c) => itemContratante(c, true)).join("")}</ul>` : ""}`
        : `<p class="vazio">${D.contratantes.length ? 'Nada marcado para hoje. Abra o <a href="#funil">funil</a>, escolha as casas em negociação e marque a próxima ação com data.' : "Ainda não há casas no funil. Cadastre as casas, festivais e eventos que a 7A quer abordar, com a próxima ação e a data."}${D.contratantes.length ? "" : '<br><a class="btn" href="#contratante/novo">Cadastrar a primeira</a>'}</p>`}

      <h2 class="display">Shows desta semana</h2>
      ${semana.length ? `<ul class="lista">${semana.map((s) => { const p = pendencias(s); return itemShow(s) + (p.length ? `<li class="pendencia">${esc(p.join(" · "))}</li>` : ""); }).join("")}</ul>` : '<p class="vazio">Nenhum show nos próximos 7 dias.</p>'}

      <h2 class="display">Funil</h2>
      <a class="funil-faixa" href="#funil">${ETAPAS.filter(([k]) => k !== "perdido").map(([k, n]) => `<span><b class="num">${contagem[k] || 0}</b>${n}</span>`).join("")}</a>

      <h2 class="display">Dinheiro</h2>
      <dl class="numeros">
        <div><dt>A receber dos contratantes</dt><dd class="num">${reais(aReceber)}</dd><small>Shows confirmados e realizados</small></div>
        <div><dt>A repassar aos artistas</dt><dd class="num">${D.config.pct_padrao === "" && aRepassar === 0 && ativos.length ? "—" : reais(aRepassar)}</dd></div>
        <div><dt>Comissão 7A em ${MESES[d.getUTCMonth()]}</dt><dd class="num">${semPct ? "—" : reais(comissaoMes)}</dd>${semPct ? '<small>Defina o % da 7A em <a href="#ajustes">Ajustes</a></small>' : ""}</div>
      </dl>

      <h2 class="display">Próximos shows</h2>
      ${depois.length ? `<ul class="lista">${depois.map(itemShow).join("")}</ul>` : '<p class="vazio">Nada marcado entre 8 e 60 dias. Quando uma data for pedida, cadastre como consulta em <a href="#show/novo">Novo show</a>.</p>'}`;

    tela.querySelectorAll(".numeros dd, .funil-faixa b").forEach(contarAte);
    // mensagens prontas para enviar: só um aviso aqui, o trabalho fica em Mensagens
    api("gestao/fila").then((f) => {
      const n = (f.rascunhos || []).length + (f.abertas || []).length;
      const alvo = $("#resumo-fila");
      if (alvo && n) alvo.innerHTML = ` · <a href="#whatsapp">${plural(n, "mensagem esperando você", "mensagens esperando você")}</a>`;
    });
  }

  /* ---------- funil em colunas ---------- */
  let verPerdidos = false;
  function telaFunil() {
    const colunas = ETAPAS.filter(([k]) => verPerdidos || k !== "perdido");
    tela.innerHTML = `
      <div class="cabeca"><h1 class="display">Funil</h1><a class="btn" href="#contratante/novo">Nova casa</a></div>
      ${subabas(SUB_FUNIL, "funil")}
      <div class="busca"><input type="search" id="f-busca" placeholder="Filtrar por nome ou cidade" aria-label="Filtrar casas"><label class="marcar" style="flex:none;font-size:15px"><input type="checkbox" id="f-perdidos"${verPerdidos ? " checked" : ""}> Perdidas</label></div>
      <p class="estado" id="funil-estado" role="status"></p>
      <div class="kanban" id="kanban" style="--cols:${colunas.length}">${colunas.map(([k, n]) => `
        <section class="coluna" data-etapa="${k}" aria-label="${n}"><h2 class="coluna-topo"><span>${n}</span><span class="num conta" data-conta="${k}">…</span></h2><div class="cartoes" data-lista="${k}"></div></section>`).join("")}</div>
      <p class="ajuda" style="margin-top:16px">No computador, arraste a casa para outra coluna. No celular, use "Mover para" no cartão. Toda mudança fica no histórico da casa.</p>`;

    const cartao = (c) => {
      const h = hoje();
      const atraso = c.proxima_data && c.proxima_data < h;
      const quando = !c.proxima_data ? "" : atraso ? `<span class="atrasado">${dataCurta(c.proxima_data)}</span>` : c.proxima_data === h ? "<span>Hoje</span>" : `<span>${dataCurta(c.proxima_data)}</span>`;
      return `<article class="cartao" draggable="true" data-id="${c.id}" data-busca="${esc((c.nome + " " + c.cidade).toLowerCase())}">
        <a class="cartao-nome" href="#contratante/${c.id}">${esc(c.nome)}</a>
        <span class="cartao-meta">${[c.cidade, nomeDe(TIPOS, c.tipo)].filter(Boolean).map(esc).join(" · ")}</span>
        ${c.proxima_acao || quando ? `<span class="cartao-acao">${quando}${c.proxima_acao ? `<span>${esc(c.proxima_acao)}</span>` : ""}</span>` : !["fechado", "perdido"].includes(c.etapa) ? '<span class="cartao-acao sem">Sem próxima ação</span>' : ""}
        ${c.comunicacao === "bloqueado" ? '<span class="etiqueta e-bloqueado">Bloqueado</span>' : c.origem === "site" && c.etapa === "contatar" ? '<span class="etiqueta e-site">Pedido do site</span>' : ""}
        <label class="mover">Mover para<select data-mover="${c.id}">${ETAPAS.map(([k, n]) => `<option value="${k}"${k === c.etapa ? " selected" : ""}>${n}</option>`).join("")}</select></label>
      </article>`;
    };

    const dados = {};
    const desenharColuna = (k) => {
      const caixa = $(`[data-lista="${k}"]`);
      if (!caixa) return;
      const itens = dados[k] || [];
      caixa.innerHTML = itens.length ? itens.map(cartao).join("") : '<p class="coluna-vazia">Nenhuma casa aqui.</p>';
      $(`[data-conta="${k}"]`).textContent = itens.length;
      filtrar();
    };
    const filtrar = () => {
      const q = ($("#f-busca") ? $("#f-busca").value : "").trim().toLowerCase();
      document.querySelectorAll(".cartao").forEach((el) => { el.hidden = !!q && !el.dataset.busca.includes(q); });
    };
    colunas.forEach(([k]) => api("gestao/contratantes?" + new URLSearchParams({ etapa: k, por: 100 })).then((r) => {
      dados[k] = r.itens || [];
      desenharColuna(k);
      if (r.total > 100) $("#funil-estado").textContent = `A coluna ${nomeDe(ETAPAS, k)} mostra as 100 primeiras. Use "Lista e busca" para ver todas.`;
    }));

    const mover = (id, para) => {
      const de = Object.keys(dados).find((k) => dados[k].some((c) => c.id === id));
      if (!de || de === para) return;
      const c = dados[de].find((x) => x.id === id);
      const estado = $("#funil-estado");
      api(`gestao/contratantes/${id}/etapa`, "POST", { etapa: para }).then((r) => {
        if (r.erro) { estado.textContent = r.erro; estado.className = "estado ruim"; desenharColuna(de); return; }
        dados[de] = dados[de].filter((x) => x.id !== id);
        if (dados[para]) dados[para].unshift({ ...c, ...r });
        desenharColuna(de); desenharColuna(para);
        const novo = $(`.cartao[data-id="${id}"]`);
        if (novo) { novo.classList.add("chegou"); novo.addEventListener("animationend", () => novo.classList.remove("chegou"), { once: true }); }
        const leve = D.contratantes.find((x) => x.id === id);
        if (leve) leve.etapa = para;
        estado.className = "estado ok";
        estado.innerHTML = para === "fechado"
          ? `${esc(c.nome)} fechou. <a href="#show/novo?c=${id}">Cadastrar o show</a>`
          : `${esc(c.nome)} foi para ${nomeDe(ETAPAS, para)}.`;
      });
    };

    const k = $("#kanban");
    k.addEventListener("change", (ev) => { const s = ev.target.closest("[data-mover]"); if (s) mover(Number(s.dataset.mover), s.value); });
    k.addEventListener("dragstart", (ev) => { const el = ev.target.closest(".cartao"); if (!el) return; ev.dataTransfer.setData("text/plain", el.dataset.id); ev.dataTransfer.effectAllowed = "move"; el.classList.add("arrastando"); });
    k.addEventListener("dragend", (ev) => { const el = ev.target.closest(".cartao"); if (el) el.classList.remove("arrastando"); document.querySelectorAll(".coluna.alvo").forEach((x) => x.classList.remove("alvo")); });
    k.addEventListener("dragover", (ev) => { const col = ev.target.closest(".coluna"); if (!col) return; ev.preventDefault(); document.querySelectorAll(".coluna.alvo").forEach((x) => x !== col && x.classList.remove("alvo")); col.classList.add("alvo"); });
    k.addEventListener("drop", (ev) => { const col = ev.target.closest(".coluna"); if (!col) return; ev.preventDefault(); col.classList.remove("alvo"); mover(Number(ev.dataTransfer.getData("text/plain")), col.dataset.etapa); });
    $("#f-busca").addEventListener("input", filtrar);
    $("#f-perdidos").addEventListener("change", (ev) => { verPerdidos = ev.target.checked; telaFunil(); });
  }

  /* ---------- contratantes ---------- */
  function itemContratante(c, comAcao) {
    const h = hoje();
    const atraso = c.proxima_data && c.proxima_data < h ? diasEntre(c.proxima_data, h) : 0;
    const quando = !c.proxima_data ? "" : atraso ? `<span class="atrasado">${atraso === 1 ? "Desde ontem" : `Há ${atraso} dias`}</span>` : c.proxima_data === h ? "<span>Hoje</span>" : `<span>${dataCurta(c.proxima_data)}</span>`;
    const meta = comAcao && c.proxima_acao ? esc(c.proxima_acao) : [nomeDe(TIPOS, c.tipo), c.cidade, c.perfil ? nomeDe(PERFIS, c.perfil) : ""].filter(Boolean).map(esc).join(" · ");
    const etiqueta = c.arquivado ? '<span class="etiqueta e-cancelado">Arquivado</span>'
      : c.comunicacao === "bloqueado" ? '<span class="etiqueta e-bloqueado">Bloqueado</span>'
      : c.origem === "site" && c.etapa === "contatar" ? '<span class="etiqueta e-site">Pedido do site</span>'
      : `<span class="etiqueta e-${c.etapa}">${nomeDe(ETAPAS, c.etapa)}</span>`;
    return `<li><a class="item" href="#contratante/${c.id}">
      <span class="nome">${esc(c.nome)}</span>
      <span class="lado">${etiqueta}${quando}</span>
      <span class="meta">${meta || "&nbsp;"}</span></a></li>`;
  }

  let buscaSeq = 0;
  // Casas: todas as casas cadastradas (menos arquivadas), com cidade, etapa, shows e contato direto
  const filtroCasas = { busca: "", tipo: "", cidade: "" };
  function telaCasas() {
    tela.innerHTML = `
      <div class="cabeca"><div><h1 class="display">Casas</h1><p>Todas as casas de show, bares, restaurantes e eventos cadastrados.</p></div><a class="btn" href="#contratante/novo">Nova casa</a></div>
      <div class="filtros" id="casas-tipos" role="group" aria-label="Tipo"></div>
      <div class="casas-filtros"><input type="search" id="casas-busca" placeholder="Buscar por nome, cidade ou contato" value="${esc(filtroCasas.busca)}" aria-label="Buscar casa"><select id="casas-cidade" aria-label="Cidade"><option value="">Todas as cidades</option></select></div>
      <div id="casas-lista"><p class="vazio">Carregando...</p></div>`;
    const todas = [];
    const pagina = (n) => api(`gestao/contratantes?por=100&pagina=${n}`).then((r) => {
      if (!r.itens) throw new Error(r.erro || "falha");
      todas.push(...r.itens);
      return todas.length < r.total && r.itens.length ? pagina(n + 1) : r;
    });
    pagina(1).then(() => {
      if (location.hash !== "#casas") return;
      const cidades = [...new Set(todas.map((c) => (c.cidade || "").trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b, "pt-BR"));
      $("#casas-cidade").insertAdjacentHTML("beforeend", cidades.map((c) => `<option${c === filtroCasas.cidade ? " selected" : ""}>${esc(c)}</option>`).join(""));
      const h = hoje();
      const showsDe = (id) => D.shows.filter((s) => s.contratante_id === id && s.status !== "cancelado");
      const desenhar = () => {
        const q = filtroCasas.busca.trim().toLowerCase();
        const base = todas.filter((c) => (!filtroCasas.cidade || (c.cidade || "").trim() === filtroCasas.cidade)
          && (!q || [c.nome, c.cidade, c.contato, c.bairro].some((v) => (v || "").toLowerCase().includes(q))));
        const conta = {}; base.forEach((c) => { conta[c.tipo] = (conta[c.tipo] || 0) + 1; });
        $("#casas-tipos").innerHTML = `<button type="button" data-tipo="" aria-pressed="${!filtroCasas.tipo}">Todas<span class="conta">${base.length}</span></button>`
          + TIPOS.filter(([k]) => conta[k]).map(([k, n]) => `<button type="button" data-tipo="${k}" aria-pressed="${filtroCasas.tipo === k}">${n}<span class="conta">${conta[k]}</span></button>`).join("");
        const lista = base.filter((c) => !filtroCasas.tipo || c.tipo === filtroCasas.tipo).sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR"));
        if (!todas.length) { $("#casas-lista").innerHTML = '<p class="vazio">Nenhuma casa cadastrada ainda. Use "Nova casa" ou importe uma planilha no Funil.</p>'; return; }
        if (!lista.length) { $("#casas-lista").innerHTML = '<p class="vazio">Nenhuma casa com esse filtro.</p>'; return; }
        $("#casas-lista").innerHTML = `<p class="casas-total">${lista.length} ${lista.length === 1 ? "casa" : "casas"}</p>
          <table class="tabela casas"><thead><tr><th scope="col">Casa</th><th scope="col">Cidade</th><th scope="col">Etapa</th><th scope="col">Shows</th><th scope="col">Último / próximo</th><th scope="col">Contato</th></tr></thead><tbody>
          ${lista.map((c) => {
            const ss = showsDe(c.id);
            const passados = ss.filter((s) => s.data && s.data < h).map((s) => s.data).sort();
            const futuros = ss.filter((s) => s.data && s.data >= h).map((s) => s.data).sort();
            const quando = [passados.length ? "Último " + dataCurta(passados[passados.length - 1]) : "", futuros.length ? "Próximo " + dataCurta(futuros[0]) : ""].filter(Boolean).join(" · ");
            const etapa = c.comunicacao === "bloqueado" ? '<span class="etiqueta e-bloqueado">Bloqueado</span>' : `<span class="etiqueta e-${c.etapa}">${nomeDe(ETAPAS, c.etapa)}</span>`;
            const w = c.comunicacao !== "bloqueado" && c.telefone_norm ? whats(c.telefone) : "";
            const contatos = [
              w ? `<a href="${w}" target="_blank" rel="noopener">WhatsApp</a>` : "",
              c.instagram ? `<a href="https://instagram.com/${encodeURIComponent(c.instagram.replace(/^@/, ""))}" target="_blank" rel="noopener">Instagram</a>` : "",
              c.email ? `<a href="mailto:${esc(c.email)}">E-mail</a>` : "",
            ].filter(Boolean).join("");
            return `<tr>
              <th scope="row"><a href="#contratante/${c.id}">${esc(c.nome)}</a><small>${esc([nomeDe(TIPOS, c.tipo), c.contato].filter(Boolean).join(" · "))}</small></th>
              <td data-r="Cidade">${esc([c.cidade, c.uf].filter(Boolean).join("/")) || '<span class="sem">Sem cidade</span>'}</td>
              <td>${etapa}</td>
              <td class="n" data-r="Shows">${ss.length}</td>
              <td data-r="Datas">${quando || '<span class="sem">Nenhum show</span>'}</td>
              <td class="contatos">${contatos || '<span class="sem">Sem contato</span>'}</td></tr>`;
          }).join("")}</tbody></table>`;
      };
      desenhar();
      let espera;
      $("#casas-busca").addEventListener("input", (ev) => { filtroCasas.busca = ev.target.value; clearTimeout(espera); espera = setTimeout(desenhar, 150); });
      $("#casas-cidade").addEventListener("change", (ev) => { filtroCasas.cidade = ev.target.value; desenhar(); });
      $("#casas-tipos").addEventListener("click", (ev) => { const b = ev.target.closest("[data-tipo]"); if (!b) return; filtroCasas.tipo = b.dataset.tipo; desenhar(); });
    }).catch(() => { if ($("#casas-lista")) $("#casas-lista").innerHTML = '<p class="vazio">Não deu para carregar as casas. Tente de novo.</p>'; });
  }

  function telaContratantes() {
    tela.innerHTML = `
      <div class="cabeca"><h1 class="display">Funil</h1><a class="btn" href="#contratante/novo">Nova casa</a></div>
      ${subabas(SUB_FUNIL, "contratantes")}
      <div class="filtros" id="etapas" role="group" aria-label="Etapa do funil"></div>
      <div class="busca"><input type="search" id="busca" placeholder="Buscar por nome, cidade, contato, e-mail ou telefone" value="${esc(filtro.busca)}" aria-label="Buscar contratante">
        <select id="f-perfil" aria-label="Perfil musical" style="max-width:200px"><option value="">Todos os perfis</option>${PERFIS.slice(1).map(([k, n]) => `<option value="${k}"${filtro.perfil === k ? " selected" : ""}>${n}</option>`).join("")}<option value="nenhum"${filtro.perfil === "nenhum" ? " selected" : ""}>Perfil não definido</option></select></div>
      <div class="linha-marcas"><label class="marcar"><input type="checkbox" id="f-bloq"${filtro.bloqueados ? " checked" : ""}> Só os bloqueados</label><label class="marcar"><input type="checkbox" id="f-arq"${filtro.arquivados ? " checked" : ""}> Arquivados</label></div>
      <div id="resultado"><p class="vazio">Carregando...</p></div>`;
    const carregar = () => {
      const q = new URLSearchParams({ busca: filtro.busca, etapa: filtro.etapa, perfil: filtro.perfil, pagina: filtro.pagina, por: 50 });
      if (filtro.bloqueados) q.set("bloqueados", "1");
      if (filtro.arquivados) q.set("arquivados", "1");
      const seq = ++buscaSeq;
      api("gestao/contratantes?" + q).then((r) => {
        if (seq !== buscaSeq || !$("#resultado")) return;
        if (!r.itens) { $("#resultado").innerHTML = `<p class="vazio">${esc(r.erro || "Não deu para carregar.")}</p>`; return; }
        const todos = Object.values(r.contagens).reduce((a, b) => a + b, 0);
        $("#etapas").innerHTML = `<button type="button" data-etapa="" aria-pressed="${!filtro.etapa}">Todos<span class="conta">${todos}</span></button>`
          + ETAPAS.map(([k, n]) => `<button type="button" data-etapa="${k}" aria-pressed="${filtro.etapa === k}">${n}<span class="conta">${r.contagens[k] || 0}</span></button>`).join("");
        const paginas = Math.max(1, Math.ceil(r.total / r.por));
        $("#resultado").innerHTML = r.itens.length
          ? `<ul class="lista lista-contratantes">${r.itens.map((c) => itemContratante(c)).join("")}</ul>
             ${paginas > 1 ? `<div class="paginas"><button class="btn btn-sec" type="button" data-pag="${r.pagina - 1}"${r.pagina <= 1 ? " disabled" : ""}>Anterior</button><span>Página ${r.pagina} de ${paginas} · ${r.total} contratantes</span><button class="btn btn-sec" type="button" data-pag="${r.pagina + 1}"${r.pagina >= paginas ? " disabled" : ""}>Próxima</button></div>` : ""}`
          : `<p class="vazio">${todos || filtro.busca || filtro.arquivados || filtro.bloqueados ? "Nenhum contratante com esse filtro." : "Nenhum contratante ainda. Cadastre cada casa, festival, evento ou empresa que a 7A vai abordar, ou importe uma planilha."}</p>`;
      });
    };
    $("#etapas").addEventListener("click", (ev) => { const b = ev.target.closest("[data-etapa]"); if (!b) return; filtro.etapa = b.dataset.etapa; filtro.pagina = 1; carregar(); });
    $("#resultado").addEventListener("click", (ev) => { const b = ev.target.closest("[data-pag]"); if (!b) return; filtro.pagina = Number(b.dataset.pag); carregar(); window.scrollTo(0, 0); });
    let espera;
    $("#busca").addEventListener("input", (ev) => { filtro.busca = ev.target.value; filtro.pagina = 1; clearTimeout(espera); espera = setTimeout(carregar, 250); });
    $("#f-perfil").addEventListener("change", (ev) => { filtro.perfil = ev.target.value; filtro.pagina = 1; carregar(); });
    $("#f-bloq").addEventListener("change", (ev) => { filtro.bloqueados = ev.target.checked; filtro.pagina = 1; carregar(); });
    $("#f-arq").addEventListener("change", (ev) => { filtro.arquivados = ev.target.checked; filtro.pagina = 1; carregar(); });
    carregar();
  }

  const opcoes = (lista, sel) => lista.map(([k, n]) => `<option value="${k}"${k === sel ? " selected" : ""}>${esc(n)}</option>`).join("");

  // mantém a lista leve (selects dos shows, propostas) igual ao servidor
  function guardarLeve(c) {
    D.contratantes = D.contratantes.filter((x) => x.id !== c.id);
    if (!c.arquivado) D.contratantes.push({ id: c.id, nome: c.nome, cidade: c.cidade, contato: c.contato, telefone: c.telefone, email: c.email, etapa: c.etapa });
  }

  function fichaContratante(id) {
    if (id === "novo") return desenharFicha(null);
    tela.innerHTML = '<a class="voltar" href="#funil">Voltar para o funil</a><p class="vazio">Carregando...</p>';
    api("gestao/contratantes/" + Number(id)).then((f) => {
      if (location.hash !== "#contratante/" + id) return;
      if (!f.contratante) { tela.innerHTML = '<a class="voltar" href="#funil">Voltar para o funil</a><p class="vazio">Contratante não encontrado.</p>'; return; }
      desenharFicha(f);
    });
  }

  function desenharFicha(f) {
    const novo = !f;
    const c = novo ? { nome: "", tipo: "casa", contato: "", telefone: "", email: "", instagram: "", cep: "", endereco: "", numero: "", complemento: "", bairro: "", cidade: "", uf: "", referencia: "", perfil: "", etapa: "contatar", proxima_acao: "", proxima_data: "", obs: "" } : f.contratante;
    const bloqueado = c.comunicacao === "bloqueado";
    const seus = novo ? [] : D.shows.filter((s) => s.contratante_id === c.id).sort((a, b) => (b.data || "").localeCompare(a.data || ""));
    const ultimaAut = !novo && f.consentimentos[0];
    tela.innerHTML = `
      <a class="voltar" href="#funil">Voltar para o funil</a>
      <div class="cabeca"><h1 class="display">${novo ? "Nova casa" : esc(c.nome)}</h1>${novo ? "" : `<span class="etiqueta e-${c.etapa}">${nomeDe(ETAPAS, c.etapa)}</span>`}</div>
      ${c.arquivado ? `<p class="aviso">Arquivado em ${dataCurta(c.arquivado)}. Não aparece nas listas nem nas campanhas. <button class="texto-btn" type="button" id="restaurar">Restaurar</button></p>` : ""}
      ${bloqueado ? `<p class="aviso aviso-forte">Pediu para não receber mensagens (${dataCurta(c.bloqueado_em.slice(0, 10))}). Nenhuma mensagem pode ser aberta para esta casa. <button class="texto-btn" type="button" id="desbloquear">Desbloquear</button></p>` : ""}
      ${novo || c.arquivado ? "" : `<div class="acoes-rapidas">
        ${!bloqueado && c.telefone_norm ? '<button class="btn" type="button" id="zap">Mensagem no WhatsApp</button>' : ""}
        ${!bloqueado && c.telefone && !c.telefone_norm ? '<span class="etiqueta e-bloqueado" style="align-self:center">Telefone fora do formato: corrija para usar o WhatsApp</span>' : ""}
        ${!bloqueado ? '<button class="btn btn-sec" type="button" id="respondeu">Respondeu</button><button class="btn btn-sec" type="button" id="parar">Pediu para parar</button>' : ""}
        ${c.telefone ? `<a class="btn btn-sec" href="tel:${soDigitos(c.telefone)}">Ligar</a>` : ""}
        ${c.email ? `<a class="btn btn-sec" href="mailto:${esc(c.email)}">E-mail</a>` : ""}
        ${c.instagram ? `<a class="btn btn-sec" href="https://instagram.com/${encodeURIComponent(c.instagram)}" target="_blank" rel="noopener">Instagram</a>` : ""}
        <a class="btn btn-sec" href="#conversa/${c.id}">Conversa</a>
        <a class="btn btn-sec" href="#show/novo?c=${c.id}">Novo show</a></div>
        <p class="estado" id="estado-acao" role="status" style="margin:-8px 0 16px"></p>
        <div class="caixa-zap" id="caixa-zap" hidden></div>`}
      <div class="bloco-ficha"><form class="ficha" id="ficha" novalidate>
        <label class="c6">Nome da casa, restaurante, evento ou empresa<input name="nome" value="${esc(c.nome)}" required autocomplete="off"></label>
        <h2 class="grupo-ficha">Negociação</h2>
        <label class="c2">Etapa do funil<select name="etapa">${opcoes(ETAPAS, c.etapa)}</select></label>
        <label class="c2">Próxima ação<input name="proxima_acao" value="${esc(c.proxima_acao)}" placeholder="Mandar o release da Ordem Mor" autocomplete="off"></label>
        <label class="c2">Quando<input name="proxima_data" type="date" value="${esc(c.proxima_data)}"></label>
        <h2 class="grupo-ficha">Contato</h2>
        <label class="c2">Pessoa de contato<input name="contato" value="${esc(c.contato)}" autocomplete="off"></label>
        <label class="c2">Telefone ou WhatsApp<input name="telefone" type="tel" value="${esc(c.telefone)}" placeholder="(31) 9..." autocomplete="off"></label>
        <label class="c2">Instagram<input name="instagram" value="${esc(c.instagram)}" placeholder="@casa" autocomplete="off"></label>
        <label class="c6">E-mail<input name="email" type="email" value="${esc(c.email)}" autocomplete="off"></label>
        <label>Tipo<select name="tipo">${opcoes(TIPOS, c.tipo)}</select></label>
        <label>Perfil musical<select name="perfil">${opcoes(PERFIS, c.perfil || "")}</select></label>
        <h2 class="grupo-ficha">Endereço</h2>
        <label class="c2">CEP<input name="cep" value="${esc(c.cep || "")}" placeholder="32600-000" inputmode="numeric" maxlength="9" autocomplete="off"><span class="dica" id="dica-cep">Preenche rua, bairro, cidade e UF.</span></label>
        <label class="c4">Rua<input name="endereco" value="${esc(c.endereco || "")}" placeholder="Rua do Rosário" autocomplete="off"></label>
        <label class="c1 meia">Número<input name="numero" value="${esc(c.numero || "")}" placeholder="120" autocomplete="off"></label>
        <label class="c2 meia">Complemento<input name="complemento" value="${esc(c.complemento || "")}" placeholder="Loja 2" autocomplete="off"></label>
        <label class="c3">Bairro<input name="bairro" value="${esc(c.bairro || "")}" placeholder="Centro" autocomplete="off"></label>
        <label class="c4 meia">Cidade<input name="cidade" value="${esc(c.cidade)}" placeholder="Betim" autocomplete="off"></label>
        <label class="c2 meia">UF<input name="uf" value="${esc(c.uf || "")}" placeholder="MG" maxlength="2" autocomplete="off"></label>
        <label class="c6">Ponto de referência (opcional)<input name="referencia" value="${esc(c.referencia || "")}" placeholder="Em frente à praça, entrada pelos fundos" autocomplete="off"></label>
        <label class="c6">Observações<textarea name="obs" rows="3" placeholder="Capacidade, estilo da casa, quem decide, quanto costuma pagar">${esc(c.obs)}</textarea></label>

      <div class="salvar-barra">
        <button class="btn" type="button" id="salvar">${novo ? "Cadastrar" : "Salvar"}</button>
        <p class="estado" id="estado" role="status"></p>
        ${novo || c.arquivado ? "" : '<button class="texto-btn perigo apagar" type="button" id="apagar">Arquivar contratante</button>'}
      </div></div>
      ${novo ? "" : `
      ${ultimaAut ? `<p class="ajuda">Autorização de contato: <strong>${{ livre: "livre", conversa: "em conversa", pediu_contato: "pediu contato", bloqueado: "bloqueado" }[ultimaAut.situacao] || ultimaAut.situacao}</strong> — ${esc(ultimaAut.prova)}</p>` : `<p class="ajuda">Autorização de contato: ${c.origem === "csv" ? "importado por planilha, sem autorização registrada" : "nenhuma registrada ainda"}. O primeiro contato é sempre manual, com o seu toque.</p>`}
      <h2 class="display">Shows</h2>
      ${seus.length ? `<ul class="lista">${seus.map(itemShow).join("")}</ul>` : '<p class="vazio">Nenhum show com este contratante ainda.</p>'}
      <h2 class="display">Mensagens no WhatsApp</h2>
      <div id="mensagens">${listaMensagens(f.mensagens)}</div>
      ${f.campanhas.length ? `<h2 class="display">Campanhas</h2><ul class="lista">${f.campanhas.map((x) => `<li><a class="item" href="#campanha/${x.id}"><span class="nome">${esc(x.nome)}</span><span class="lado"><span class="etiqueta">${SIT_DEST[x.situacao] || x.situacao}</span></span><span class="meta">${STATUS_CAMP[x.status] || x.status}${x.situacao === "aguardando" && x.cobrar_em ? " · cobrança em " + dataCurta(x.cobrar_em) : ""}</span></a></li>`).join("")}</ul>` : ""}
      <h2 class="display">Último cachê</h2>
      ${(f.ultimos_cache || []).length ? `<ul class="lista">${f.ultimos_cache.map((u) => `<li><span class="nome">${esc(artistas[u.artista] || u.artista)} — ${reais(u.valor)} — ${esc(u.origem)}</span></li>`).join("")}</ul>` : '<p class="vazio">Nenhum último cachê registrado. Enquanto isso, vale o piso padrão do artista.</p>'}
      <div class="nova-nota" style="width:100%"><label>Artista<select id="uc-artista">${Object.entries(artistas).map(([s, nome]) => `<option value="${esc(s)}">${esc(nome)}</option>`).join("")}</select></label><label>Valor (R$)<input id="uc-valor" inputmode="decimal" placeholder="0,00"></label><label>Origem<input id="uc-origem" placeholder="Show de 04/03/2025"></label><button class="btn btn-sec" type="button" id="uc-salvar">Registrar último cachê</button></div>
      <h2 class="display">Histórico</h2>
      <div class="nova-nota"><label>O que aconteceu<textarea id="texto-nota" rows="2" placeholder="Liguei, pediu proposta para março"></textarea></label><button class="btn btn-sec" type="button" id="anotar">Anotar</button></div>
      <ul class="notas" id="notas"><li><span class="quando">Carregando...</span></li></ul>
`}`;

    const form = $("#ficha");
    form.addEventListener("input", () => { sujo = true; estado(""); });
    // CEP: com 8 dígitos busca o endereço nos Correios (ViaCEP) e preenche rua, bairro e cidade
    let ultimoCep = "";
    form.cep.addEventListener("input", () => {
      const d = soDigitos(form.cep.value).slice(0, 8);
      form.cep.value = d.length > 5 ? d.slice(0, 5) + "-" + d.slice(5) : d;
      if (d.length !== 8 || d === ultimoCep) return;
      ultimoCep = d;
      const dica = $("#dica-cep");
      dica.textContent = "Buscando o endereço...";
      fetch(`https://viacep.com.br/ws/${d}/json/`).then((r) => r.json()).then((e) => {
        if (e.erro) { dica.textContent = "CEP não encontrado. Preencha o endereço à mão."; return; }
        if (e.logradouro) form.endereco.value = e.logradouro;
        if (e.bairro) form.bairro.value = e.bairro;
        if (e.localidade) form.cidade.value = e.localidade;
        if (e.uf) form.uf.value = e.uf;
        dica.textContent = "Endereço preenchido. Complete com o número.";
        form.numero.focus();
      }).catch(() => { dica.textContent = "Não consegui buscar o CEP agora. Preencha à mão."; });
    });
    $("#salvar").addEventListener("click", () => {
      const dados = Object.fromEntries(new FormData(form));
      if (!dados.nome.trim()) { estado("Dê um nome ao contratante.", "ruim"); form.nome.focus(); return; }
      salvar(novo ? "gestao/contratantes" : "gestao/contratantes/" + c.id, novo ? "POST" : "PUT", dados, (r) => {
        guardarLeve(r);
        sujo = false;
        if (novo) location.hash = "#contratante/" + r.id;
        else { estado("Salvo.", "ok"); if (r.telefone_norm !== c.telefone_norm) desenharFicha({ ...f, contratante: r }); else Object.assign(c, r); }
      }, (r) => {
        // telefone ou e-mail já cadastrado: mostra o cadastro que já existe
        if (r.existente) $("#estado").innerHTML = `${esc(r.erro)} <a href="#contratante/${r.existente.id}">Abrir ${esc(r.existente.nome)}</a>`;
        if (r.campo && form[r.campo]) form[r.campo].focus();
      });
    });
    if (novo) { form.nome.focus(); return; }

    const recarregar = (msg) => api("gestao/contratantes/" + c.id).then((nf) => { if (nf.contratante) { guardarLeve(nf.contratante); desenharFicha(nf); if (msg) acaoEstado(msg, "ok"); } });
    const acaoEstado = (t, tipo) => { const e = $("#estado-acao"); if (e) { e.textContent = t; e.className = "estado" + (tipo ? " " + tipo : ""); } };
    if ($("#apagar")) $("#apagar").addEventListener("click", () => {
      if (!confirm(`Arquivar ${c.nome}? Sai das listas e das campanhas, mas o histórico fica guardado e dá para restaurar.`)) return;
      api("gestao/contratantes/" + c.id, "DELETE").then((r) => {
        if (!r.ok) return estado(r.erro || "Não deu para arquivar.", "ruim");
        D.contratantes = D.contratantes.filter((x) => x.id !== c.id);
        sujo = false; location.hash = "#contratantes";
      });
    });
    if ($("#restaurar")) $("#restaurar").addEventListener("click", () => api(`gestao/contratantes/${c.id}/restaurar`, "POST").then(() => recarregar("Restaurado.")));
    if ($("#desbloquear")) $("#desbloquear").addEventListener("click", () => {
      const motivo = prompt("Por que desbloquear? Escreva a prova do novo pedido (por exemplo: \"pediu para voltar a receber em 10/11\"). Fica registrado.");
      if (!motivo) return;
      if (!confirm(`Desbloquear ${c.nome}? A casa volta a poder receber mensagens.`)) return;
      api(`gestao/contratantes/${c.id}/desbloquear`, "POST", { confirmo: true, motivo }).then((r) => (r.erro ? alert(r.erro) : recarregar("Desbloqueado.")));
    });
    if ($("#respondeu")) $("#respondeu").addEventListener("click", (ev) => {
      ev.target.disabled = true;
      api(`gestao/contratantes/${c.id}/respondeu`, "POST", {}).then((r) => (r.erro ? acaoEstado(r.erro, "ruim") : recarregar("Marcado: respondeu. Etapa em negociação e próxima ação para hoje.")));
    });
    if ($("#uc-salvar")) $("#uc-salvar").addEventListener("click", () => {
      const valor = centavos($("#uc-valor").value);
      const origem = $("#uc-origem").value.trim();
      if (!(valor > 0)) return acaoEstado("Informe o valor do último cachê.", "ruim");
      if (!origem) return acaoEstado("Diga de onde vem esse valor.", "ruim");
      api(`gestao/contratantes/${c.id}/ultimo-cache`, "POST", { artista: $("#uc-artista").value, valor, origem }).then((r) => (r.erro ? acaoEstado(r.erro, "ruim") : recarregar("Último cachê registrado.")));
    });
    if ($("#colar-resposta")) $("#colar-resposta").addEventListener("click", () => {
      const texto = $("#texto-resposta").value.trim();
      if (!texto) return acaoEstado("Cole a mensagem que a casa mandou.", "ruim");
      api(`gestao/contratantes/${c.id}/resposta`, "POST", { texto }).then((r) => (r.erro ? acaoEstado(r.erro, "ruim") : recarregar("Resposta registrada. Etapa em negociação.")));
    });
    if ($("#parar")) $("#parar").addEventListener("click", () => {
      const detalhe = prompt(`${c.nome} pediu para não receber mais mensagens? Se quiser, cole o que a pessoa escreveu (fica como prova).`, "");
      if (detalhe === null) return;
      api(`gestao/contratantes/${c.id}/parar`, "POST", { detalhe }).then((r) => (r.erro ? acaoEstado(r.erro, "ruim") : recarregar("Bloqueado. A casa saiu de todas as campanhas.")));
    });
    if ($("#zap")) $("#zap").addEventListener("click", () => abrirCaixaZap(c, () => recarregar()));
    ligarMensagens($("#mensagens"), () => recarregar());

    const desenharNotas = (lista) => {
      $("#notas").innerHTML = lista.length ? lista.map((n) => `<li data-n="${n.id}"><span class="quando">${new Date(n.criado).toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo", day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" })}</span><button class="texto-btn" type="button" data-tirar>Apagar</button><span class="texto">${esc(n.texto)}</span></li>`).join("")
        : '<li><span class="texto">Nada anotado ainda. Registre cada contato para saber onde a conversa parou.</span></li>';
    };
    let notas = [];
    api(`gestao/contratantes/${c.id}/notas`).then((r) => { notas = Array.isArray(r) ? r : []; if ($("#notas")) desenharNotas(notas); });
    $("#anotar").addEventListener("click", () => {
      const t = $("#texto-nota");
      if (!t.value.trim()) { t.focus(); return; }
      api(`gestao/contratantes/${c.id}/notas`, "POST", { texto: t.value }).then((r) => {
        if (!r.id) return estado(r.erro || "Não deu para anotar.", "ruim");
        notas.unshift(r); t.value = ""; desenharNotas(notas);
      });
    });
    $("#notas").addEventListener("click", (ev) => {
      if (!ev.target.hasAttribute("data-tirar")) return;
      const li = ev.target.closest("[data-n]"), nid = Number(li.dataset.n);
      if (!confirm("Apagar esta anotação?")) return;
      api("gestao/notas/" + nid, "DELETE").then((r) => { if (r.ok) { notas = notas.filter((n) => n.id !== nid); desenharNotas(notas); } });
    });
  }

  /* ---------- whatsapp ---------- */
  // abre o WhatsApp com o link que o servidor devolveu; a janela é aberta já no toque para o navegador não bloquear
  function abrirNoWhats(registrar) {
    let janela = null;
    if (D.config.simulacao !== "1") { try { janela = window.open("", "_blank"); } catch { janela = null; } }
    return registrar().then((r) => {
      if (!r.link || r.simulada || r.repetida) { if (janela) janela.close(); return r; }
      if (janela) { janela.opener = null; janela.location.href = r.link; } else location.href = r.link;
      return r;
    }).catch(() => { if (janela) janela.close(); return { erro: "Sem conexão. Tente de novo." }; });
  }

  function listaMensagens(lista) {
    if (!lista || !lista.length) return '<p class="vazio">Nenhuma mensagem aberta pelo sistema ainda.</p>';
    return `<ul class="notas">${lista.map((m) => `<li data-m="${m.id}">
      <span class="quando">${dataHora(m.criado)} · ${TIPO_MSG[m.tipo] || m.tipo}${m.modelo ? " · " + esc(m.modelo) : ""}${m.simulada ? " · simulação" : ""}</span>
      <span class="etiqueta ${m.situacao === "aberta" ? "e-site" : m.situacao === "enviada" ? "e-fechado" : "e-cancelado"}">${SIT_MSG[m.situacao] || m.situacao}</span>
      <span class="texto">${esc(m.texto)}</span>
      ${m.situacao === "aberta" ? `<span class="acoes-msg"><button class="btn" type="button" data-enviou="1">Enviei</button><button class="btn btn-sec" type="button" data-enviou="0">Não enviei</button><button class="texto-btn" type="button" data-reabrir>Abrir de novo</button></span>` : ""}
    </li>`).join("")}</ul>`;
  }
  function ligarMensagens(caixa, depois) {
    if (!caixa) return;
    caixa.addEventListener("click", (ev) => {
      const li = ev.target.closest("[data-m]");
      if (!li) return;
      const id = li.dataset.m;
      if (ev.target.hasAttribute("data-enviou")) {
        ev.target.disabled = true;
        api(`gestao/mensagens/${id}/confirmar`, "POST", { enviou: ev.target.dataset.enviou === "1" }).then((r) => { if (r.erro) alert(r.erro); depois(); });
      } else if (ev.target.hasAttribute("data-reabrir")) {
        if (!confirm("Abrir esta mesma mensagem de novo no WhatsApp? Não cria um registro novo.")) return;
        abrirNoWhats(() => api(`gestao/mensagens/${id}/reabrir`, "POST", {})).then((r) => { if (r.erro) alert(r.erro); });
      }
    });
  }

  // caixa da ficha: escolhe o modelo, confere o texto e abre no WhatsApp
  function abrirCaixaZap(c, depois) {
    const caixa = $("#caixa-zap");
    if (!caixa.hidden) { caixa.hidden = true; return; }
    caixa.hidden = false;
    caixa.innerHTML = '<p class="ajuda">Carregando os modelos...</p>';
    const chave = chaveNova();
    let regra = null;
    carregarModelos().then(() => {
      const ativos = modelos.filter((m) => m.ativo);
      // sugere o modelo da etapa da casa, de preferência o do mesmo perfil musical
      const etapa = { contatar: "primeiro", contatado: "cobranca", negociando: "proposta" }[c.etapa] || "outro";
      const daEtapa = ativos.filter((m) => m.etapa === etapa);
      const sugerido = daEtapa.find((m) => c.perfil && m.perfil === c.perfil) || daEtapa.find((m) => !m.perfil) || null;
      caixa.innerHTML = `
        <div class="ficha">
          <label class="c6">Modelo<select id="zap-modelo">${ativos.map((m) => `<option value="${m.id}"${m === sugerido ? " selected" : ""}>${esc(m.nome)} (${nomeDe(ETAPAS_MODELO, m.etapa)})</option>`).join("")}<option value=""${sugerido ? "" : " selected"}>Escrever sem modelo</option></select></label>
          <label class="c6">Mensagem (pode ajustar antes de abrir)<textarea id="zap-texto" rows="8"></textarea></label>
        </div>
        <p class="estado" id="zap-aviso" role="status"></p>
        <div class="acoes-rapidas" style="margin:12px 0 0"><button class="btn" type="button" id="zap-abrir">Abrir no WhatsApp</button><button class="texto-btn" type="button" id="zap-fechar">Cancelar</button></div>
        <p class="ajuda" style="margin:12px 0 0">Versão gratuita: o sistema abre o seu WhatsApp com o texto pronto, e quem envia é você. Não há envio automático nem aviso de entregue ou lida. As respostas chegam só no celular: marque aqui "Respondeu" ou "Pediu para parar".</p>`;
      const aviso = (t, tipo) => { const e = $("#zap-aviso"); e.textContent = t; e.className = "estado" + (tipo ? " " + tipo : ""); };
      const previa = () => {
        const id = $("#zap-modelo").value;
        api("gestao/mensagens/previa", "POST", { contratante_id: c.id, modelo_id: id ? Number(id) : null, texto: id ? null : $("#zap-texto").value }).then((r) => {
          if (id) $("#zap-texto").value = r.texto || "";
          regra = r.regra;
          const problemas = [...(r.erros || []), ...(r.regra && !r.regra.ok ? [r.regra.erro] : [])];
          aviso(problemas.join(" ") || (r.simulacao ? "Modo simulação: a mensagem fica registrada como teste e o WhatsApp não abre." : r.tipo === "abordagem" ? "Primeiro contato: conta no limite diário de novas abordagens." : ""), problemas.length ? "ruim" : "");
        });
      };
      $("#zap-modelo").addEventListener("change", previa);
      $("#zap-fechar").addEventListener("click", () => { caixa.hidden = true; });
      $("#zap-abrir").addEventListener("click", () => {
        let forcar = false;
        if (regra && !regra.ok && regra.codigo === "intervalo") {
          if (!confirm(regra.erro + "\n\nAbrir mesmo assim?")) return;
          forcar = true;
        }
        const b = $("#zap-abrir"); b.disabled = true;
        const id = $("#zap-modelo").value;
        abrirNoWhats(() => api("gestao/mensagens", "POST", { chave, contratante_id: c.id, modelo_id: id ? Number(id) : null, texto: $("#zap-texto").value, forcar })).then((r) => {
          b.disabled = false;
          if (r.erro) return aviso(r.erro, "ruim");
          caixa.hidden = true;
          depois();
        });
      });
      if (!ativos.length) aviso("Nenhum modelo ativo. Escreva a mensagem ou crie um modelo em Campanhas > Modelos.");
      previa();
    });
  }

  /* ---------- importar ---------- */
  function telaImportar() {
    const exemplo = "﻿Nome;Contato;Telefone;E-mail;Cidade;UF;Categoria;Perfil;Observações\r\nBar do Exemplo;Ana Souza;(31) 99999-0000;contato@bardoexemplo.com.br;Betim;MG;Bar ou casa de show;Autoral;Toca rock às sextas\r\n";
    tela.innerHTML = `
      <div class="cabeca"><h1 class="display">Funil</h1></div>
      ${subabas(SUB_FUNIL, "importar")}
      <p class="ajuda">Salve a planilha como CSV (no Excel: Arquivo > Salvar como > CSV; no Google Planilhas: Arquivo > Fazer download > CSV). A primeira linha precisa ter os títulos. Colunas reconhecidas: Nome, Contato, Telefone (ou WhatsApp), E-mail, Cidade, UF, Categoria, Perfil, Instagram, Observações. Até 1.000 linhas por vez.</p>
      <p class="ajuda">Antes de gravar, o sistema mostra quantas linhas entram e quais ficam de fora, com o motivo. Quem é importado entra como "a contatar": a importação não conta como contato feito nem autoriza mensagens.</p>
      <div class="acoes-rapidas"><a class="btn btn-sec" download="modelo-contratantes-7a.csv" href="data:text/csv;charset=utf-8,${encodeURIComponent(exemplo)}">Baixar planilha de exemplo</a></div>
      <label style="max-width:520px">Arquivo CSV<input type="file" id="arquivo" accept=".csv,text/csv"></label>
      <p class="estado" id="estado" role="status" style="margin-top:12px"></p>
      <div id="previa-csv"></div>`;
    let csv = "";
    $("#arquivo").addEventListener("change", (ev) => {
      const arq = ev.target.files[0];
      if (!arq) return;
      $("#previa-csv").innerHTML = "";
      estado("Lendo o arquivo...");
      arq.arrayBuffer().then((buf) => {
        // Excel em português costuma salvar em Windows-1252; Google Planilhas, em UTF-8
        try { csv = new TextDecoder("utf-8", { fatal: true }).decode(buf); } catch { csv = new TextDecoder("windows-1252").decode(buf); }
        return api("gestao/contratantes/importar", "POST", { csv });
      }).then((r) => {
        if (r.erro) return estado(r.erro, "ruim");
        estado("");
        $("#previa-csv").innerHTML = `
          <dl class="numeros" style="margin-top:8px"><div><dt>Entram</dt><dd class="num">${r.entram}</dd><small>de ${r.total} linhas</small></div><div><dt>Ficam de fora</dt><dd class="num">${r.recusadas.length}</dd></div><div><dt>Colunas reconhecidas</dt><dd style="font:600 15px/1.4 var(--f-texto)">${r.colunas.map(esc).join(", ")}</dd></div></dl>
          ${r.amostra.length ? `<h2 class="display">Como vão entrar</h2><ul class="lista">${r.amostra.map((x) => `<li><div class="item"><span class="nome">${esc(x.nome)}</span><span class="meta">${[x.contato, x.telefone, x.cidade].filter(Boolean).map(esc).join(" · ") || "&nbsp;"}</span></div></li>`).join("")}</ul>${r.entram > r.amostra.length ? `<p class="ajuda">E mais ${r.entram - r.amostra.length}.</p>` : ""}` : ""}
          ${r.recusadas.length ? `<h2 class="display">Ficam de fora</h2><ul class="lista">${r.recusadas.map((x) => `<li><div class="item"><span class="nome">Linha ${x.linha}: ${esc(x.nome)}</span><span class="meta">${esc(x.motivo)}</span></div></li>`).join("")}</ul>` : ""}
          ${r.entram ? `<div class="salvar-barra"><button class="btn" type="button" id="importar">Importar ${r.entram} contato${r.entram > 1 ? "s" : ""}</button><p class="estado" id="estado-imp" role="status"></p></div>` : '<p class="vazio">Nenhuma linha pode entrar. Corrija o arquivo e escolha de novo.</p>'}`;
        if (!r.entram) return;
        $("#importar").addEventListener("click", (ev) => {
          ev.target.disabled = true;
          api("gestao/contratantes/importar", "POST", { csv, confirmar: true }).then((f) => {
            if (f.erro) { ev.target.disabled = false; $("#estado-imp").textContent = f.erro; return; }
            $("#previa-csv").innerHTML = `<p class="aviso">${f.inseridos} contato${f.inseridos === 1 ? "" : "s"} importado${f.inseridos === 1 ? "" : "s"}${f.recusadas.length ? `, ${f.recusadas.length} linha${f.recusadas.length > 1 ? "s" : ""} de fora` : ""}. <a href="#contratantes">Ver contratantes</a></p>`;
            $("#arquivo").value = "";
            api("gestao/dados").then((d) => { if (d.contratantes) D = d; });
          });
        });
      }).catch(() => estado("Não deu para ler o arquivo.", "ruim"));
    });
  }

  /* ---------- shows ---------- */
  function itemShow(s) {
    const c = contratante(s.contratante_id);
    const onde = [s.evento, s.local || (c && c.nome), s.cidade].filter(Boolean).map(esc).join(" · ");
    const quando = s.data ? `<span class="dia num">${s.data.slice(8)}</span><span class="mes">${MESES[Number(s.data.slice(5, 7)) - 1].slice(0, 3)}</span>` : '<span class="mes">Sem data</span>';
    return `<li><a class="item show-item${s.status === "cancelado" ? " cancelado" : ""}" href="#show/${s.id}">
      <span class="quando">${quando}</span>
      <span class="nome">${esc(nomeArtista(s))}</span>
      <span class="lado"><span class="etiqueta e-${s.status}">${nomeDe(STATUS, s.status)}</span>${s.cache ? `<span class="valor num">${reais(s.cache)}</span>` : ""}</span>
      <span class="meta">${onde || "&nbsp;"}</span></a></li>`;
  }

  /* ---------- agenda: lista, mês e financeiro ---------- */
  const SUB_AGENDA = [["shows", "Lista"], ["calendario", "Mês"], ["financeiro", "Financeiro"]];
  // shows que ainda estão só na aba Agenda do "Editar o site" (antes da Gestão): aparecem aqui para tudo ficar num lugar
  const chaveSite = (d) => [d.data, d.hora, d.artista, d.artista_texto, d.evento, d.local, d.cidade].join("|");
  function itemSite(d) {
    const quando = `<span class="dia num">${d.data.slice(8)}</span><span class="mes">${MESES[Number(d.data.slice(5, 7)) - 1].slice(0, 3)}</span>`;
    const onde = [d.evento, d.local, d.cidade].filter(Boolean).map(esc).join(" · ");
    return `<li><div class="item show-item item-site">
      <span class="quando">${quando}</span>
      <span class="nome">${esc(artistas[d.artista] || d.artista_texto || d.artista || "Artista")}</span>
      <span class="lado"><span class="etiqueta e-site">Só no site</span></span>
      <span class="meta">${onde || "&nbsp;"} · <button class="texto-btn" type="button" data-trazer="${esc(chaveSite(d))}">Trazer para a Gestão</button></span></div></li>`;
  }
  function trazerDoSite(chave, botao) {
    if (!confirm("Trazer este show para a Gestão? Ele entra como confirmado e continua na agenda do site, agora com cachê, contratante e proposta.")) return;
    botao.disabled = true;
    api("conteudo").then((c) => {
      const lista = Array.isArray(c.agenda) ? c.agenda : [];
      const d = lista.find((x) => chaveSite(x) === chave);
      if (!d) { agendaSite = lista; telaShows(); return; }
      return api("gestao/shows", "POST", { ...d, status: "confirmado", publicar: true, obs: "Trazido da agenda do site." }).then((s) => {
        if (s.erro) { alert(s.erro); botao.disabled = false; return; }
        const resto = lista.filter((x) => x !== d);
        delete c._status;
        return api("conteudo", "PUT", { ...c, agenda: resto }).then((r) => {
          if (r.erro) alert("O show entrou na Gestão, mas não saiu da aba do site: " + r.erro + " Apague lá em Editar o site para não aparecer duas vezes.");
          agendaSite = r.erro ? lista : resto;
          D.shows.push(s);
          location.hash = "#show/" + s.id;
        });
      });
    });
  }

  let mesVisto = null;
  function telaCalendario() {
    const h = hoje();
    mesVisto = mesVisto || h.slice(0, 7);
    const [a, m] = mesVisto.split("-").map(Number);
    const primeiro = new Date(Date.UTC(a, m - 1, 1)), dias = new Date(Date.UTC(a, m, 0)).getUTCDate();
    const doMes = D.shows.filter((s) => s.data && s.data.startsWith(mesVisto) && s.status !== "cancelado").sort((x, y) => (x.data + x.hora).localeCompare(y.data + y.hora));
    const site = agendaSite.filter((d) => d.data && d.data.startsWith(mesVisto));
    const porDia = {};
    doMes.forEach((s) => (porDia[s.data] = porDia[s.data] || []).push(`<a class="chip e-${s.status}" href="#show/${s.id}">${esc(nomeArtista(s))}</a>`));
    site.forEach((d) => (porDia[d.data] = porDia[d.data] || []).push(`<span class="chip e-site">${esc(artistas[d.artista] || d.artista_texto || "Artista")}</span>`));
    let celulas = "";
    for (let i = 0; i < primeiro.getUTCDay(); i++) celulas += '<div class="dia-cal fora"></div>';
    for (let x = 1; x <= dias; x++) {
      const iso = `${mesVisto}-${String(x).padStart(2, "0")}`;
      const tem = porDia[iso] || [];
      celulas += `<div class="dia-cal${iso === h ? " hoje" : ""}${tem.length ? " cheio" : ""}"><span class="num">${x}</span>${tem.join("")}</div>`;
    }
    const mover = (n) => { const d = new Date(Date.UTC(a, m - 1 + n, 1)); mesVisto = d.toISOString().slice(0, 7); telaCalendario(); };
    const cache = doMes.filter((s) => s.status === "confirmado" || s.status === "realizado").reduce((t, s) => t + s.cache, 0);
    tela.innerHTML = `
      <div class="cabeca"><h1 class="display">Agenda</h1><a class="btn" href="#show/novo">Novo show</a></div>
      ${subabas(SUB_AGENDA, "calendario")}
      <div class="mes-nav"><button class="btn btn-sec" type="button" id="mes-ant" aria-label="Mês anterior">‹</button><h2 class="display">${MESES[m - 1]} ${a}</h2><button class="btn btn-sec" type="button" id="mes-prox" aria-label="Próximo mês">›</button>
        <p>${doMes.length + site.length ? `${doMes.length + site.length} ${doMes.length + site.length === 1 ? "data" : "datas"}${cache ? " · " + reais(cache) + " em cachês fechados" : ""}` : "Nenhuma data neste mês"}</p></div>
      <div class="calendario" role="grid" aria-label="${MESES[m - 1]} de ${a}">${DIAS.map((d) => `<div class="sem-dia">${d.slice(0, 3)}</div>`).join("")}${celulas}</div>
      ${doMes.length + site.length ? `<h2 class="display">Datas do mês</h2><ul class="lista">${[...doMes, ...site.map((d) => ({ ...d, _site: true }))].sort((x, y) => (x.data + (x.hora || "")).localeCompare(y.data + (y.hora || ""))).map((x) => (x._site ? itemSite(x) : itemShow(x))).join("")}</ul>` : ""}`;
    $("#mes-ant").addEventListener("click", () => mover(-1));
    $("#mes-prox").addEventListener("click", () => mover(1));
  }

  let anoVisto = null;
  function telaFinanceiro() {
    const h = hoje();
    anoVisto = anoVisto || h.slice(0, 4);
    const anos = [...new Set([h.slice(0, 4), ...D.shows.filter((s) => s.data).map((s) => s.data.slice(0, 4))])].sort();
    const fechados = D.shows.filter((s) => s.data && s.data.startsWith(anoVisto) && (s.status === "confirmado" || s.status === "realizado"));
    const soma = (lista) => lista.reduce((t, s) => {
      const k = contas(s);
      t.n++; t.cache += s.cache; t.comissao += k.comissao || 0; t.recebido += s.recebido; t.receber += Math.max(0, s.cache - s.recebido);
      t.repasse += k.repasse || 0; t.repassado += s.repassado; t.repassar += Math.max(0, k.falta_repassar || 0); t.semPct = t.semPct || k.pct == null;
      return t;
    }, { n: 0, cache: 0, comissao: 0, recebido: 0, receber: 0, repasse: 0, repassado: 0, repassar: 0, semPct: false });
    const tot = soma(fechados);
    const meses = MESES.map((nome, i) => [nome[0].toUpperCase() + nome.slice(1), soma(fechados.filter((s) => Number(s.data.slice(5, 7)) === i + 1))]).filter(([, t]) => t.n);
    const porArtista = {};
    fechados.forEach((s) => (porArtista[nomeArtista(s)] = porArtista[nomeArtista(s)] || []).push(s));
    const artistasOrd = Object.entries(porArtista).map(([n, l]) => [n, soma(l)]).sort((x, y) => y[1].cache - x[1].cache);
    const pendentes = fechados.filter((s) => s.data < h && (s.cache > s.recebido || (contas(s).falta_repassar || 0) > 0)).sort((x, y) => x.data.localeCompare(y.data));
    const pct = (t) => (t.semPct ? "—" : reais(t.comissao));
    const linha = (rotulo, t) => `<tr><th scope="row">${rotulo}</th><td class="num">${t.n}</td><td class="num">${reais(t.cache)}</td><td class="num forte">${pct(t)}</td><td class="num">${reais(t.recebido)}</td><td class="num${t.receber ? " alerta" : ""}">${reais(t.receber)}</td><td class="num${t.repassar ? " alerta" : ""}">${t.semPct ? "—" : reais(t.repassar)}</td></tr>`;
    tela.innerHTML = `
      <div class="cabeca"><h1 class="display">Agenda</h1><a class="btn btn-sec" href="/api/gestao/exportar/shows.csv">Baixar planilha</a></div>
      ${subabas(SUB_AGENDA, "financeiro")}
      <div class="filtros" role="group" aria-label="Ano">${anos.map((x) => `<button type="button" data-ano="${x}" aria-pressed="${x === anoVisto}">${x}</button>`).join("")}</div>
      ${tot.semPct ? '<p class="aviso">Algum show está sem o % da 7A. Defina o padrão em <a href="#ajustes">Ajustes</a> para a comissão e o repasse aparecerem.</p>' : ""}
      <dl class="numeros">
        <div><dt>Comissão 7A em ${anoVisto}</dt><dd class="num">${pct(tot)}</dd><small>${tot.n} ${tot.n === 1 ? "show fechado" : "shows fechados"} · ${reais(tot.cache)} em cachês</small></div>
        <div><dt>Falta receber</dt><dd class="num">${reais(tot.receber)}</dd><small>Dos contratantes</small></div>
        <div><dt>Falta repassar</dt><dd class="num">${tot.semPct ? "—" : reais(tot.repassar)}</dd><small>Aos artistas</small></div>
      </dl>
      <h2 class="display">Mês a mês</h2>
      ${meses.length ? `<div class="tabela-rola"><table class="tabela"><thead><tr><th scope="col">Mês</th><th scope="col">Shows</th><th scope="col">Cachês</th><th scope="col">Comissão 7A</th><th scope="col">Recebido</th><th scope="col">Falta receber</th><th scope="col">Falta repassar</th></tr></thead>
        <tbody>${meses.map(([n, t]) => linha(n, t)).join("")}</tbody><tfoot>${linha("Total", tot)}</tfoot></table></div>` : `<p class="vazio">Nenhum show confirmado ou realizado em ${anoVisto}. Shows em consulta ou reservados não entram na conta até serem confirmados.</p>`}
      ${artistasOrd.length ? `<h2 class="display">Por artista</h2><div class="tabela-rola"><table class="tabela"><thead><tr><th scope="col">Artista</th><th scope="col">Shows</th><th scope="col">Cachês</th><th scope="col">Comissão 7A</th><th scope="col">Cachê médio</th></tr></thead>
        <tbody>${artistasOrd.map(([n, t]) => `<tr><th scope="row">${esc(n)}</th><td class="num">${t.n}</td><td class="num">${reais(t.cache)}</td><td class="num forte">${pct(t)}</td><td class="num">${reais(Math.round(t.cache / t.n))}</td></tr>`).join("")}</tbody></table></div>` : ""}
      <h2 class="display">Para acertar</h2>
      ${pendentes.length ? `<ul class="lista">${pendentes.map((s) => { const k = contas(s); const falta = [s.cache > s.recebido ? "receber " + reais(s.cache - s.recebido) : "", (k.falta_repassar || 0) > 0 ? "repassar " + reais(k.falta_repassar) : ""].filter(Boolean).join(" · "); return itemShow(s) + `<li class="pendencia">Falta ${esc(falta)}</li>`; }).join("")}</ul>` : '<p class="vazio">Nenhum show que já passou com dinheiro pendente.</p>'}`;
    tela.querySelectorAll("[data-ano]").forEach((b) => b.addEventListener("click", () => { anoVisto = b.dataset.ano; telaFinanceiro(); }));
    tela.querySelectorAll(".numeros dd").forEach(contarAte);
  }

  function telaShows() {
    const h = hoje();
    const conta = (st) => D.shows.filter((s) => (!st || s.status === st) && (filtro.passados || !s.data || s.data >= h)).length;
    const lista = D.shows
      .filter((s) => (!filtro.status || s.status === filtro.status) && (filtro.passados || !s.data || s.data >= h))
      .sort((a, b) => filtro.passados ? (b.data || "9").localeCompare(a.data || "9") : (a.data || "9").localeCompare(b.data || "9"));
    const doSite = agendaSite.filter((d) => (!filtro.status || filtro.status === "confirmado") && (filtro.passados || d.data >= h)).map((d) => ({ ...d, _site: true }));
    const todos = [...lista, ...doSite].sort((a, b) => filtro.passados ? (b.data || "9").localeCompare(a.data || "9") : (a.data || "9").localeCompare(b.data || "9"));
    let html = "", mesAtual = null;
    for (const s of todos) {
      const m = s.data ? s.data.slice(0, 7) : "sem";
      if (m !== mesAtual) {
        if (mesAtual !== null) html += "</ul>";
        html += `<h2 class="mes-titulo">${m === "sem" ? "Sem data" : MESES[Number(m.slice(5)) - 1] + (m.slice(0, 4) !== h.slice(0, 4) ? " " + m.slice(0, 4) : "")}</h2><ul class="lista">`;
        mesAtual = m;
      }
      html += s._site ? itemSite(s) : itemShow(s);
    }
    if (mesAtual !== null) html += "</ul>";
    tela.innerHTML = `
      <div class="cabeca"><h1 class="display">Agenda</h1><a class="btn" href="#show/novo">Novo show</a></div>
      ${subabas(SUB_AGENDA, "shows")}
      ${agendaSite.length ? `<p class="aviso">${agendaSite.length === 1 ? "1 show está" : agendaSite.length + " shows estão"} só na agenda do site, sem cachê nem contratante. Toque em "Trazer para a Gestão" para ter tudo num lugar.</p>` : ""}
      <div class="filtros" role="group" aria-label="Status do show">
        <button type="button" data-status="" aria-pressed="${!filtro.status}">Todos<span class="conta">${conta("")}</span></button>
        ${STATUS.map(([k, n]) => `<button type="button" data-status="${k}" aria-pressed="${filtro.status === k}">${n}<span class="conta">${conta(k)}</span></button>`).join("")}
      </div>
      <p><label class="marcar"><input type="checkbox" id="passados"${filtro.passados ? " checked" : ""}> Mostrar shows que já passaram</label></p>
      ${html || `<p class="vazio">${D.shows.length ? "Nenhum show com esse filtro." : "Nenhum show ainda. Cadastre cada pedido de data como consulta e vá mudando o status até realizado."}</p>`}`;
    tela.querySelectorAll("[data-status]").forEach((x) => x.addEventListener("click", () => { filtro.status = x.dataset.status; telaShows(); }));
    $("#passados").addEventListener("change", (ev) => { filtro.passados = ev.target.checked; telaShows(); });
    tela.querySelectorAll("[data-trazer]").forEach((b) => b.addEventListener("click", () => trazerDoSite(b.dataset.trazer, b)));
  }
