        <label class="c6">Recado extra (opcional)<textarea id="email-msg" rows="3" placeholder="Ex.: Temos datas livres em novembro. Se quiser, respondo ainda hoje."></textarea></label>
        <p class="ajuda c6" style="margin:0">O e-mail já sai com "Olá, nome!", os dados do show, a carta do artista, o botão da proposta e a assinatura. O recado entra antes do fechamento. As respostas vão para contato@7aprodutora.com.br.</p>
        <div class="c6 acoes-rapidas" style="margin:0"><button class="btn" type="button" id="email-enviar">Enviar e-mail</button><button class="texto-btn" type="button" id="email-cancelar">Cancelar</button></div>
      </div>`}`;

    const form = $("#ficha");
    const ler = () => {
      const f = Object.fromEntries(new FormData(form));
      const pct = f.pct.trim() === "" ? null : Number(f.pct.replace(",", "."));
      return { ...f, contratante_id: f.contratante_id ? Number(f.contratante_id) : null, cache: centavos(f.cache), despesas: centavos(f.despesas), recebido: centavos(f.recebido), repassado: centavos(f.repassado), pct, publicar: form.publicar.checked ? 1 : 0, artista_texto: f.artista ? "" : f.artista_texto || "" };
    };
    const desenharConta = () => {
      const x = ler(), k = contas(x);
      const pctTxt = k.pct == null ? "" : ` (${String(k.pct).replace(".", ",")}%)`;
      $("#conta").innerHTML = `
        <dl>
          <dt>Cachê</dt><dd class="num">${reais(x.cache)}</dd>
          <dt>Despesas</dt><dd class="num">− ${reais(x.despesas)}</dd>
          <dt>Comissão 7A${pctTxt}</dt><dd class="num">${k.comissao == null ? "Falta o %" : "− " + reais(k.comissao)}</dd>
          <dt class="total">Repasse ao artista</dt><dd class="total num">${reais(k.repasse)}</dd>
        </dl>
        <dl>
          <dt>Falta receber</dt><dd class="num">${reais(k.falta_receber)}</dd>
          <dt>Falta repassar</dt><dd class="num">${reais(k.falta_repassar)}</dd>
        </dl>
        <p>A comissão é calculada sobre ${D.config.base === "liquido" ? "o cachê menos as despesas" : "o cachê bruto"}. Dá para mudar em <a href="#ajustes">Ajustes</a>.</p>`;
    };
    desenharConta();
    const mostrarDuracao = () => {
      const d = duracaoTexto(form.hora.value, form.hora_fim.value);
      const passa = d && form.hora_fim.value < form.hora.value;
      $("#duracao-calc").innerHTML = d ? `Duração: <b>${d}</b>${passa ? " (termina no dia seguinte)" : ""}` : form.hora.value && !form.hora_fim.value ? "Preencha a hora de fim para calcular a duração." : "";
      // a duração da proposta é sempre a conta do início e fim, nunca digitada
      const campo = $("#ficha-proposta [name=duracao]"), dica = $("#dur-dica");
      if (campo) {
        campo.value = d;
        dica.textContent = d ? `Calculada pelo início e fim do show (${form.hora.value} às ${form.hora_fim.value}).` : form.hora.value ? "Preencha o Fim do show acima para calcular a duração." : "Preencha o Início e o Fim do show acima para calcular a duração.";
        dica.classList.toggle("falta", !d);
      }
    };
    mostrarDuracao();
    form.addEventListener("input", (ev) => {
      if (ev.target.name === "hora" || ev.target.name === "hora_fim") mostrarDuracao();
      sujo = true; estado("");
      if (ev.target.name === "artista") $("#outro").hidden = !!ev.target.value;
      desenharConta();
    });
    form.addEventListener("change", (ev) => {
      if (ev.target.name === "contratante_id" && novo && ev.target.value) {
        const c = contratante(Number(ev.target.value));
        if (c && !form.local.value) form.local.value = c.nome;
        if (c && !form.cidade.value) form.cidade.value = c.cidade;
      }
    });
    $("#salvar").addEventListener("click", () => {
      const dados = ler();
      if (dados.pct != null && !(dados.pct >= 0 && dados.pct <= 100)) { estado("O % da 7A precisa ficar entre 0 e 100.", "ruim"); form.pct.focus(); return; }
      if (!dados.data && dados.status !== "consulta") { estado("Preencha a data. Só uma consulta pode ficar sem data.", "ruim"); form.data.focus(); return; }
      if (!dados.artista && !dados.artista_texto.trim()) { estado("Escreva o nome do artista.", "ruim"); form.artista_texto.focus(); return; }
      if (dados.hora_fim && !dados.hora) { estado("Preencha a hora de início.", "ruim"); form.hora.focus(); return; }
      salvar(novo ? "gestao/shows" : "gestao/shows/" + s.id, novo ? "POST" : "PUT", dados, (r) => {
        if (novo) D.shows.push(r); else Object.assign(s, r);
        sujo = false;
        if (novo) location.hash = "#show/" + r.id; else estado(r.status === "confirmado" && r.publicar && r.data >= hoje() ? "Salvo. Já aparece na agenda do site." : "Salvo.", "ok");
      });
    });
    if (novo) return;
    montarProposta(s);
    $("#apagar").addEventListener("click", () => {
      if (!confirm("Apagar este show? Se ele não aconteceu, prefira marcar como cancelado.")) return;
      api("gestao/shows/" + s.id, "DELETE").then((r) => {
        if (!r.ok) return estado(r.erro || "Não deu para apagar.", "ruim");
        D.shows = D.shows.filter((x) => x.id !== s.id);
        sujo = false; location.hash = "#shows";
      });
    });
  }

  /* ---------- proposta ---------- */
  // opções padronizadas da proposta; "Outro" abre um campo para escrever
  const PADRAO = {
    formato: ["Banda completa", "Acústico", "Voz e violão", "Duo acústico", "Cabine de DJ"],
    inclui: ["Som e equipamento de palco do artista", "Transporte dos músicos", "Passagem de som antes do evento", "Divulgação do show nas redes da 7A"],
    condicoes: ["À vista, por Pix, até o dia do show", "50% na confirmação e 50% no dia do show, por Pix", "100% na confirmação, por Pix", "Pix no dia do show, antes da apresentação"],
    rider: ["Ponto de energia perto do palco", "Espaço coberto para a apresentação", "Alimentação e água para os músicos", "Local para descarregar o equipamento"],
  };
  const OUTRO = "__outro";
  const opcoesLivres = (lista) => lista.map((t) => `<option>${esc(t)}</option>`).join("") + `<option value="${OUTRO}">Outro (escrever)</option>`;
  const FORMATOS = { "ordem-mor": "Banda completa", "sub-rosa": "Banda completa", "ossos-do-banquete": "Banda completa", "athos-tibaes": "Voz e violão", aenima: "Duo acústico", "dj-ivan-lennon": "Cabine de DJ" };
  const dataSP = (ms) => new Intl.DateTimeFormat("en-CA", { timeZone: "America/Sao_Paulo" }).format(new Date(ms));

  function montarProposta(s) {
    const form = $("#ficha-proposta"), msg = $("#estado-proposta");
    const aviso = (t, tipo) => { msg.textContent = t; msg.className = "estado" + (tipo ? " " + tipo : ""); };
    let validadeAtual = "";
    const validade = () => validadeAtual || dataSP(Date.now() + Number(form.prazo.value) * 86400e3);
    const mostrarValidade = () => { $("#validade-txt").textContent = "Válida até " + validade().split("-").reverse().join("/"); };
    const outros = () => document.querySelectorAll("[data-outro]").forEach((l) => { l.hidden = form[l.dataset.outro].value !== OUTRO; });
    // coloca um valor salvo no menu; se não for uma das opções, vai para "Outro"
    const escolher = (campo, valor) => {
      const sel = form[campo];
      if (!valor) return;
      if ([...sel.options].some((o) => o.value === valor)) sel.value = valor;
      else { sel.value = OUTRO; form[campo + "_outro"].value = valor; }
    };
    // itens salvos fora do padrão (propostas antigas) aparecem marcados, para poder desmarcar
    const marcar = (campo, texto) => {
      const itens = (texto || "").split("\n").map((t) => t.trim()).filter(Boolean);
      const caixa = form.querySelector(`[name=${campo}]`).closest("fieldset");
      itens.filter((t) => !PADRAO[campo].includes(t)).forEach((t) => caixa.insertAdjacentHTML("beforeend", `<label class="marcar"><input type="checkbox" name="${campo}" value="${esc(t)}"> ${esc(t)}</label>`));
      form.querySelectorAll(`[name=${campo}]`).forEach((c) => { c.checked = itens.includes(c.value); });
    };
    const ler = () => {
      const valor = (campo) => (form[campo].value === OUTRO ? form[campo + "_outro"].value.trim() : form[campo].value.trim());
      const marcados = (campo) => [...form.querySelectorAll(`[name=${campo}]:checked`)].map((c) => c.value).join("\n");
      return { formato: valor("formato"), duracao: form.duracao.value.trim(), condicoes: valor("condicoes"), inclui: marcados("inclui"), rider: marcados("rider"), validade: validade() };
    };
    let link = "";
    const mostrarLinks = (token) => {
      link = location.origin + "/proposta/" + token;
      const c = contratante(s.contratante_id);
      const texto = `Olá${c && c.contato ? ", " + c.contato.split(" ")[0] : ""}! Segue a proposta da 7A Produtora para o show de ${nomeArtista(s)}: ${link}`;
      $("#abrir-proposta").href = link;
      const w = c ? whats(c.telefone) : "";
      $("#zap-proposta").href = (w || "https://wa.me/") + "?text=" + encodeURIComponent(texto);
      $("#copiar-proposta").onclick = () => navigator.clipboard.writeText(link).then(() => aviso("Link copiado.", "ok"), () => prompt("Copie o link:", link));
      $("#links-proposta").hidden = false;
      $("#gerar").textContent = "Atualizar proposta";
    };
    // botão de aprovação: aparece só enquanto a proposta aguarda; aprovar já envia por e-mail
    const mostrarAprovacao = (aguarda) => {
      const b = $("#aprovar-proposta");
      b.hidden = !aguarda;
      if (aguarda) aviso("Esta proposta foi preparada pela Évora e aguarda a sua aprovação. Revise e salve com \"Atualizar proposta\", ou aprove e envie.");
    };
    api(`gestao/shows/${s.id}/proposta`).then((p) => {
      escolher("formato", p.formato ?? FORMATOS[s.artista]);
      escolher("condicoes", p.condicoes || PADRAO.condicoes[0]);
      marcar("inclui", p.token ? p.inclui : PADRAO.inclui.slice(0, 2).join("\n"));
      marcar("rider", p.token ? p.rider : "Alimentação e água para os músicos");
      validadeAtual = p.validade || "";
      outros(); mostrarValidade();
      if (p.token) mostrarLinks(p.token);
      // proposta preparada pela Évora: só sai depois da sua aprovação, pelo botão próprio
      mostrarAprovacao(p.situacao === "aguardando_aprovacao");
    });
    form.addEventListener("change", (ev) => {
      aviso(""); outros();
      if (ev.target.name === "prazo") { validadeAtual = ""; mostrarValidade(); }
    });
    $("#gerar").addEventListener("click", () => {
      if (sujo) return aviso("Salve o show antes, para a proposta sair com os dados novos.", "ruim");
      const dados = ler();
      if (!dados.duracao) return aviso("Preencha o Início e o Fim do show acima e salve. A duração sai dessa conta.", "ruim");
      if (!dados.formato || !dados.condicoes) return aviso("Escreva o texto do campo marcado como Outro.", "ruim");
      if (!s.cache) aviso("Atenção: o cachê está vazio, a proposta vai dizer \"a combinar\".");
      const b = $("#gerar"); b.disabled = true;
      api(`gestao/shows/${s.id}/proposta`, "PUT", dados).then((r) => {
        b.disabled = false;
        if (!r.token) return aviso(r.erro || "Não deu para gerar a proposta.", "ruim");
        validadeAtual = r.validade; mostrarValidade();
        mostrarLinks(r.token);
        aviso(s.cache ? "Proposta pronta. O link mostra sempre os dados atuais do show." : "Proposta pronta, com o cachê a combinar.", "ok");
      }).catch(() => { b.disabled = false; aviso("Sem conexão. Tente de novo.", "ruim"); });
    });

    // aprovar: salva a aprovação e manda a proposta por e-mail para a casa, depois de confirmar
    $("#aprovar-proposta").addEventListener("click", () => {
      if (sujo) return aviso("Salve o show antes de aprovar, para a proposta sair com os dados novos.", "ruim");
      const c = contratante(s.contratante_id);
      const destino = c && c.email ? c.email : "";
      const pergunta = destino
        ? `Aprovar esta proposta e enviar por e-mail para ${destino}?`
        : "Aprovar esta proposta? A casa não tem e-mail cadastrado, então o link terá que ir pelo WhatsApp.";
      if (!confirm(pergunta)) return;
      const b = $("#aprovar-proposta"); b.disabled = true;
      api(`gestao/shows/${s.id}/proposta/aprovar`, "POST", {}).then((r) => {
        b.disabled = false;
        if (!r.ok) return aviso(r.erro || "Não deu para aprovar. Tente de novo.", "ruim");
        b.hidden = true;
        aviso(r.enviada ? `Aprovada e enviada para ${r.para}.` : `Aprovada. ${r.motivo || ""}`, r.enviada ? "ok" : "");
      }).catch(() => { b.disabled = false; aviso("Sem conexão. Tente de novo.", "ruim"); });
    });

    // e-mail pelo Resend
    $("#email-proposta").addEventListener("click", () => {
      if (!D.config.email_ativo) return aviso("O envio por e-mail ainda não está ligado: falta a chave do Resend na Cloudflare.", "ruim");
      const c = contratante(s.contratante_id);
      $("#email-para").value = (c && c.email) || "";
      $("#email-msg").value = "";
      $("#caixa-email").hidden = false;
      $("#email-para").focus();
    });
    $("#email-cancelar").addEventListener("click", () => { $("#caixa-email").hidden = true; });
    $("#email-enviar").addEventListener("click", () => {
      const b = $("#email-enviar"), para = $("#email-para").value.trim();
      if (!para) return $("#email-para").focus();
      b.disabled = true; aviso("Enviando...");
      api(`gestao/shows/${s.id}/proposta/email`, "POST", { para, mensagem: $("#email-msg").value }).then((r) => {
        b.disabled = false;
        if (!r.ok) return aviso(r.erro || "Não deu para enviar.", "ruim");
        $("#caixa-email").hidden = true;
        aviso("E-mail enviado para " + para + ". Ficou anotado no histórico do contratante.", "ok");
      }).catch(() => { b.disabled = false; aviso("Sem conexão. Tente de novo.", "ruim"); });
    });
  }

  /* ---------- campanhas ---------- */
  const VERSAO_GRATIS = '<p class="ajuda">Versão gratuita: o sistema monta cada mensagem e abre o seu WhatsApp com o texto pronto; você confere e toca em enviar, uma por vez. Não há envio automático, disparo em lote, nem aviso de entregue ou lida. As respostas chegam só no celular: marque "Respondeu" ou "Pediu para parar" aqui.</p>';

  function telaCampanhas() {
    tela.innerHTML = `
      <div class="cabeca"><h1 class="display">Mensagens</h1><a class="btn" href="#campanha/nova">Nova campanha</a></div>
      ${subabas(SUB_MSG, "campanhas")}
      ${VERSAO_GRATIS}
      <div class="filtros" id="periodo" role="group" aria-label="Período dos números">${[7, 30, 90].map((n) => `<button type="button" data-dias="${n}" aria-pressed="${n === 30}">${n} dias</button>`).join("")}</div>
      <dl class="numeros" id="indicadores"><div><dt>Carregando...</dt><dd>&nbsp;</dd></div></dl>
      <h2 class="display">Campanhas</h2>
      <div id="lista-camp"><p class="vazio">Carregando...</p></div>`;
    const indicadores = (dias) => api("gestao/indicadores?dias=" + dias).then((r) => {
      if (!$("#indicadores") || r.enviadas == null) return;
      $("#indicadores").innerHTML = `
        <div><dt>Mensagens enviadas</dt><dd class="num">${r.enviadas}</dd><small>${r.por_tipo.abordagem} primeiros contatos · ${r.por_tipo.cobranca} cobranças · ${r.por_tipo.avulsa} avulsas</small></div>
        <div><dt>Responderam</dt><dd class="num">${r.respostas}</dd><small>${r.taxa_resposta != null ? r.taxa_resposta + "% das enviadas" : "—"}</small></div>
        <div><dt>Pediram para parar</dt><dd class="num">${r.bloqueios}</dd><small>No funil hoje: ${r.funil.negociando} negociando, ${r.funil.fechado} fechados</small></div>`;
    });
    $("#periodo").addEventListener("click", (ev) => {
      const b = ev.target.closest("[data-dias]"); if (!b) return;
      $("#periodo").querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === b));
      indicadores(Number(b.dataset.dias));
    });
    indicadores(30);
    api("gestao/campanhas").then((r) => {
      if (!$("#lista-camp")) return;
      if (!Array.isArray(r)) { $("#lista-camp").innerHTML = `<p class="vazio">${esc(r.erro || "Não deu para carregar.")}</p>`; return; }
      $("#lista-camp").innerHTML = r.length ? `<ul class="lista">${r.map((c) => `<li><a class="item" href="#campanha/${c.id}">
        <span class="nome">${esc(c.nome)}</span>
        <span class="lado"><span class="etiqueta e-${c.status}">${STATUS_CAMP[c.status]}</span>${c.simulada ? "<span>Simulação</span>" : ""}</span>
        <span class="meta">${c.status === "rascunho" ? "Falta revisar a prévia e confirmar" : `${c.total} casas · ${c.pendentes} na fila · ${c.cobrar_hoje ? c.cobrar_hoje + " cobranças para hoje · " : ""}${c.respostas} respostas`}</span></a></li>`).join("")}</ul>`
        : '<p class="vazio">Nenhuma campanha ainda. Uma campanha junta as casas de um público (por exemplo, todas "a contatar" de Betim com perfil autoral) e mostra uma por uma, com a mensagem pronta para abrir no WhatsApp.<br><a class="btn" href="#campanha/nova">Criar a primeira</a></p>';
    });
  }

  function fichaCampanha(id) {
    const voltar = '<a class="voltar" href="#campanhas">Voltar para campanhas</a>';
    if (id === "nova") return carregarModelos().then(() => formCampanha(null));
    tela.innerHTML = voltar + '<p class="vazio">Carregando...</p>';
    Promise.all([api("gestao/campanhas/" + Number(id)), carregarModelos()]).then(([f]) => {
      if (location.hash !== "#campanha/" + id) return;
      if (!f.campanha) { tela.innerHTML = voltar + '<p class="vazio">Campanha não encontrada.</p>'; return; }
      if (f.campanha.status === "rascunho") formCampanha(f.campanha);
      else painelCampanha(f);
    });
  }

  function formCampanha(ca) {
    const novo = !ca;
    const pub = ca ? JSON.parse(ca.publico || "{}") : { lista: "contatar", perfil: "", cidade: "", tipo: "" };
    const v = ca || { nome: "", objetivo: "", modelo_id: null, cobranca_modelo_id: null, cobranca_dias: 3, inicio: "" };
    const ativos = modelos.filter((m) => m.ativo);
    const cidades = [...new Set(D.contratantes.map((c) => c.cidade).filter(Boolean))].sort((a, b) => a.localeCompare(b, "pt-BR"));
    tela.innerHTML = `
      <a class="voltar" href="#campanhas">Voltar para campanhas</a>
      <div class="cabeca"><h1 class="display">${novo ? "Nova campanha" : esc(ca.nome)}</h1>${novo ? "" : '<span class="etiqueta e-rascunho">Rascunho</span>'}</div>
      <div class="bloco-ficha"><form class="ficha" id="ficha" novalidate>
        <label class="c6">Nome<input name="nome" value="${esc(v.nome)}" placeholder="Bares de Betim, novembro" autocomplete="off"></label>
        <label class="c6">Objetivo<input name="objetivo" value="${esc(v.objetivo)}" placeholder="Apresentar o casting e marcar datas de dezembro" autocomplete="off"></label>
        <label class="c2">Público<select name="lista">${opcoes(LISTAS, pub.lista)}</select></label>
        <label class="c2">Perfil musical<select name="perfil"><option value="">Todos</option>${opcoes(PERFIS.slice(1), pub.perfil)}</select></label>
        <label class="c2">Cidade<input name="cidade" list="cidades" value="${esc(pub.cidade)}" placeholder="Todas" autocomplete="off"><datalist id="cidades">${cidades.map((c) => `<option value="${esc(c)}">`).join("")}</datalist></label>
        <label class="c2">Tipo de casa<select name="tipo"><option value="">Todos</option>${opcoes(TIPOS, pub.tipo)}</select></label>
        <label class="c4">Modelo de mensagem<select name="modelo_id"><option value="">Automático (pela etapa e pelo perfil de cada casa)</option>${ativos.map((m) => `<option value="${m.id}"${m.id === v.modelo_id ? " selected" : ""}>${esc(m.nome)}</option>`).join("")}</select></label>
        <label class="c2">Início<input name="inicio" type="datetime-local" value="${esc(v.inicio)}"><span class="dica">Vazio: começa ao confirmar.</span></label>
        <label class="c2">Cobrança sem resposta<select name="cobranca_dias">${[[0, "Sem cobrança"], [3, "3 dias depois"], [5, "5 dias depois"], [7, "7 dias depois"]].map(([n, t]) => `<option value="${n}"${Number(v.cobranca_dias) === n ? " selected" : ""}>${t}</option>`).join("")}</select></label>
        <label class="c4">Modelo da cobrança<select name="cobranca_modelo_id"><option value="">Automático (modelo de cobrança do perfil)</option>${ativos.filter((m) => m.etapa === "cobranca").map((m) => `<option value="${m.id}"${m.id === v.cobranca_modelo_id ? " selected" : ""}>${esc(m.nome)}</option>`).join("")}</select></label>
      </form>
      <div class="salvar-barra">
        <button class="btn" type="button" id="salvar">${novo ? "Criar e ver a prévia" : "Salvar e ver a prévia"}</button>
        <p class="estado" id="estado" role="status"></p>
        ${novo ? "" : '<button class="texto-btn perigo apagar" type="button" id="cancelar">Descartar rascunho</button>'}
      </div></div>
      <div id="previa"></div>`;
    const form = $("#ficha");
    form.addEventListener("input", () => { sujo = true; estado(""); $("#previa").innerHTML = ""; });
    const ler = () => {
      const f = Object.fromEntries(new FormData(form));
      return { nome: f.nome, objetivo: f.objetivo, publico: { lista: f.lista, perfil: f.perfil, cidade: f.cidade.trim(), tipo: f.tipo }, modelo_id: f.modelo_id ? Number(f.modelo_id) : null, cobranca_modelo_id: f.cobranca_modelo_id ? Number(f.cobranca_modelo_id) : null, cobranca_dias: Number(f.cobranca_dias), inicio: f.inicio };
    };
    $("#salvar").addEventListener("click", () => {
      const dados = ler();
      if (!dados.nome.trim()) { estado("Dê um nome à campanha.", "ruim"); form.nome.focus(); return; }
      salvar(novo ? "gestao/campanhas" : "gestao/campanhas/" + ca.id, novo ? "POST" : "PUT", dados, (r) => {
        sujo = false;
        if (novo) { location.hash = "#campanha/" + r.id; return; }
        Object.assign(ca, r); estado("Salvo.", "ok"); mostrarPrevia(ca);
      });
    });
    if (novo) { form.nome.focus(); return; }
    $("#cancelar").addEventListener("click", () => {
      if (!confirm("Descartar este rascunho? Ele fica como cancelado no histórico.")) return;
      api(`gestao/campanhas/${ca.id}/cancelar`, "POST").then(() => { sujo = false; location.hash = "#campanhas"; });
    });
    mostrarPrevia(ca);
  }

  // o que o operador precisa ver antes de iniciar; a confirmação manda a assinatura desta lista
  function mostrarPrevia(ca, avisoMudou) {
    const caixa = $("#previa");
    caixa.innerHTML = '<p class="vazio">Montando a prévia...</p>';
    api(`gestao/campanhas/${ca.id}/previa`).then((p) => desenharPrevia(ca, p, avisoMudou));
  }
  function desenharPrevia(ca, p, avisoMudou) {
    const caixa = $("#previa");
    if (!caixa) return;
    if (!p.incluidos) { caixa.innerHTML = `<p class="vazio">${esc(p.erro || "Não deu para montar a prévia.")}</p>`; return; }
    const e = p.estimativa;
    const porMotivo = {};
    p.excluidos.forEach((x) => { const k = x.motivo.replace(/ \(.*\)$/, "").replace(/"[^"]*"/, "outra"); porMotivo[k] = (porMotivo[k] || 0) + 1; });
    caixa.innerHTML = `
      <h2 class="display">Prévia</h2>
      ${avisoMudou ? `<p class="aviso aviso-forte">${esc(avisoMudou)}</p>` : ""}
      ${p.alertas.map((a) => `<p class="aviso">${esc(a)}</p>`).join("")}
      <dl class="numeros">
        <div><dt>Destinatários</dt><dd class="num">${p.incluidos.length}</dd><small>${e.toques} toques para abrir, um por mensagem, e um para confirmar cada envio</small></div>
        <div><dt>Excluídos</dt><dd class="num">${p.excluidos.length}</dd><small>${Object.entries(porMotivo).map(([k, n]) => `${n} ${k.toLowerCase()}`).join(" · ") || "Nenhum"}</small></div>
        <div><dt>Quando</dt><dd style="font:700 16px/1.4 var(--f-texto)">${p.inicio ? `${dataCurta(p.inicio.slice(0, 10))} às ${p.inicio.slice(11)}` : "Ao confirmar"}</dd><small>${e.abordagens} primeiros contatos · limite de ${e.limite} por dia${e.dias > 1 ? ` · uns ${e.dias} dias` : ""}${p.cobranca.dias ? ` · cobrança ${p.cobranca.dias} dias depois, sem resposta (${esc(p.cobranca.modelo)})` : " · sem cobrança"}</small></div>
      </dl>
      ${p.incluidos.length ? `<h2 class="display">Quem recebe</h2><ul class="lista">${p.incluidos.map((x, i) => `<li><details class="item item-texto"><summary><span class="nome">${i + 1}. ${esc(x.nome)}</span><span class="meta">${[x.cidade, x.telefone, x.modelo].filter(Boolean).map(esc).join(" · ")}</span></summary><p class="texto-msg">${esc(x.texto)}</p></details></li>`).join("")}</ul>` : ""}
      ${p.excluidos.length ? `<h2 class="display">Ficam de fora</h2><ul class="lista">${p.excluidos.map((x) => `<li><a class="item" href="#contratante/${x.contratante_id}"><span class="nome">${esc(x.nome)}</span><span class="meta">${esc(x.motivo)}</span></a></li>`).join("")}</ul>` : ""}
      ${p.incluidos.length ? `<div class="salvar-barra"><button class="btn" type="button" id="confirmar">Confirmar e iniciar com ${p.incluidos.length} casa${p.incluidos.length > 1 ? "s" : ""}</button><p class="estado" id="estado-conf" role="status"></p></div>` : ""}`;
    if (!p.incluidos.length) return;
    $("#confirmar").addEventListener("click", (ev) => {
      if (sujo) return ($("#estado-conf").textContent = "Salve as mudanças antes de confirmar.");
      if (!confirm(`Iniciar "${ca.nome}" com ${p.incluidos.length} casas? A fila grava exatamente esta lista. Cada mensagem ainda depende do seu toque.`)) return;
      ev.target.disabled = true;
      api(`gestao/campanhas/${ca.id}/confirmar`, "POST", { assinatura: p.assinatura }).then((r) => {
        if (r.codigo === "mudou") return desenharPrevia(ca, r.previa, r.erro);
        if (r.erro) { ev.target.disabled = false; $("#estado-conf").textContent = r.erro; return; }
        fichaCampanha(String(ca.id));
      });
    });
  }

  function painelCampanha(f) {
    const ca = f.campanha, k = f.indicadores;
    const ativa = ca.status === "andamento" || ca.status === "pausada";
    tela.innerHTML = `
      <a class="voltar" href="#campanhas">Voltar para campanhas</a>
      <div class="cabeca"><div><h1 class="display">${esc(ca.nome)}</h1>${ca.objetivo ? `<p>${esc(ca.objetivo)}</p>` : ""}</div>
        <div class="acoes-rapidas" style="margin:0"><span class="etiqueta e-${ca.status}" style="align-self:center">${STATUS_CAMP[ca.status]}${ca.simulada ? " · simulação" : ""}</span>
        ${ca.status === "andamento" ? '<button class="btn btn-sec" type="button" data-acao="pausar">Pausar</button>' : ""}
        ${ca.status === "pausada" ? '<button class="btn" type="button" data-acao="retomar">Retomar</button>' : ""}
        ${ativa ? '<button class="texto-btn perigo" type="button" data-acao="cancelar">Cancelar campanha</button>' : ""}</div></div>

      <dl class="numeros" style="margin-top:20px">

        <div><dt>Respostas</dt><dd class="num">${k.respostas}</dd><small>${k.fechamentos} fecharam show</small></div>
        <div><dt>Bloqueios</dt><dd class="num">${k.bloqueios}</dd><small>${k.pendentes} na fila · ${k.aguardando_cobranca} esperando cobrança</small></div>
      </dl>
      <h2 class="display">Casas</h2>
      <ul class="lista">${f.destinatarios.map((d) => `<li><a class="item" href="#contratante/${d.contratante_id}"><span class="nome">${d.ordem}. ${esc(d.nome)}</span><span class="lado"><span class="etiqueta">${SIT_DEST[d.situacao] || d.situacao}</span></span><span class="meta">${[d.cidade, d.situacao === "aguardando" && d.cobrar_em ? "cobrança em " + dataCurta(d.cobrar_em) : "", d.motivo].filter(Boolean).map(esc).join(" · ") || "&nbsp;"}</span></a></li>`).join("")}</ul>
      <h2 class="display">Histórico</h2>
      <ul class="notas">${f.historico.map((h) => `<li><span class="quando">${dataHora(h.quando)}</span><span class="texto">${esc(h.acao.charAt(0).toUpperCase() + h.acao.slice(1))}${h.detalhe ? ": " + esc(h.detalhe) : ""}</span></li>`).join("")}</ul>`;
    tela.querySelectorAll("[data-acao]").forEach((b) => b.addEventListener("click", () => {
      const acao = b.dataset.acao;
      if (acao === "cancelar" && !confirm("Cancelar a campanha? Quem ainda está na fila sai dela, e não dá para retomar.")) return;
      api(`gestao/campanhas/${ca.id}/${acao}`, "POST").then((r) => { if (r.erro) alert(r.erro); fichaCampanha(String(ca.id)); });
    }));
    if (ativa) desenharFila(ca);
  }

  // a fila: uma casa por vez, com a mensagem pronta
  function desenharFila(ca) {
    const caixa = $("#fila");
    const recarregar = () => fichaCampanha(String(ca.id));
    api(`gestao/campanhas/${ca.id}/fila`).then((r) => {
      if (!$("#fila")) return;
      const cont = r.contagem || {};
      const resumo = `${cont.pendente || 0} na fila${cont.aguardando ? ` · ${cont.aguardando.n} esperando cobrança (a próxima em ${dataCurta(cont.aguardando.proxima)})` : ""}`;
      if (r.status === "pausada") { caixa.innerHTML = `<p class="vazio">Campanha pausada. Nada é mostrado nem aberto até você retomar. ${resumo}.</p>`; return; }
      if (r.status === "concluida") return recarregar();
      if (r.espera) { caixa.innerHTML = `<p class="vazio">A fila abre em ${dataCurta(r.espera.slice(0, 10))} às ${r.espera.slice(11)}. ${resumo}.</p>`; return; }
      if (r.limite) { caixa.innerHTML = `<p class="aviso">${esc(r.limite)} ${resumo}.</p>`; return; }
      if (r.vazia) { caixa.innerHTML = `<p class="vazio">Ninguém na vez agora.${r.esperando ? ` ${r.esperando} casa${r.esperando > 1 ? "s esperam" : " espera"} o intervalo mínimo entre mensagens.` : ""} ${resumo}.</p>`; return; }
      const a = r.atual, c = a.contratante;
      const chave = chaveNova();
      caixa.innerHTML = `
        <p class="fila-topo"><span class="etiqueta ${a.etapa === "cobranca" ? "e-site" : "e-andamento"}">${a.etapa === "cobranca" ? "Cobrança" : "Mensagem"}</span> ${resumo}${r.simulada ? " · simulação, o WhatsApp não abre" : ""}</p>
        <h2 class="display" style="margin:8px 0 4px"><a href="#contratante/${c.id}" style="text-decoration:none">${esc(c.nome)}</a></h2>
        <p class="ajuda" style="margin:0 0 12px">${[c.contato, c.cidade, c.telefone].filter(Boolean).map(esc).join(" · ")}</p>
        <p class="texto-msg">${esc(a.texto)}</p>
        ${r.mensagem ? `<p class="aviso">Aberta às ${dataHora(r.mensagem.criado).slice(-5)}. Você enviou?</p>
          <div class="acoes-rapidas"><button class="btn" type="button" data-f="enviei">Enviei</button><button class="btn btn-sec" type="button" data-f="nao">Não enviei</button><button class="texto-btn" type="button" data-f="reabrir">Abrir de novo</button></div>`
          : `<div class="acoes-rapidas"><button class="btn btn-grande" type="button" data-f="abrir">Abrir no WhatsApp</button><button class="btn btn-sec" type="button" data-f="pular">Pular</button></div>`}
        <div class="acoes-rapidas" style="margin:0"><button class="texto-btn" type="button" data-f="respondeu">Já respondeu</button><button class="texto-btn perigo" type="button" data-f="parar">Pediu para parar</button></div>
        <p class="estado" id="estado-fila" role="status"></p>`;
      const aviso = (t) => { $("#estado-fila").textContent = t; $("#estado-fila").className = "estado ruim"; };
      caixa.querySelectorAll("[data-f]").forEach((b) => b.addEventListener("click", () => {
        const f = b.dataset.f;
        if (f === "abrir") {
          b.disabled = true;
          abrirNoWhats(() => api("gestao/mensagens", "POST", { chave, contratante_id: c.id, destinatario_id: a.destinatario_id })).then((m) => (m.erro ? (aviso(m.erro), (b.disabled = false)) : desenharFila(ca)));
        } else if (f === "enviei" || f === "nao") {
          b.disabled = true;
          api(`gestao/mensagens/${r.mensagem.id}/confirmar`, "POST", { enviou: f === "enviei" }).then((m) => (m.erro ? aviso(m.erro) : desenharFila(ca)));
        } else if (f === "reabrir") {
          if (confirm("Abrir esta mesma mensagem de novo no WhatsApp? Não cria um registro novo.")) abrirNoWhats(() => api(`gestao/mensagens/${r.mensagem.id}/reabrir`, "POST", {})).then((m) => m.erro && aviso(m.erro));
        } else if (f === "pular") {
          const motivo = prompt("Por que pular esta casa? (opcional)", "");
          if (motivo === null) return;
          api(`gestao/campanhas/${ca.id}/pular`, "POST", { destinatario_id: a.destinatario_id, motivo }).then((m) => (m.erro ? aviso(m.erro) : desenharFila(ca)));
        } else if (f === "respondeu") {
          api(`gestao/contratantes/${c.id}/respondeu`, "POST", {}).then(recarregar);
        } else if (f === "parar") {
          const detalhe = prompt(`${c.nome} pediu para não receber mais mensagens? Se quiser, cole o que a pessoa escreveu.`, "");
          if (detalhe === null) return;
          api(`gestao/contratantes/${c.id}/parar`, "POST", { detalhe }).then(recarregar);
        }
      }));
    });
  }

  /* ---------- modelos ---------- */
  const EXEMPLO = { primeiro_nome: "Ana", nome_contato: "Ana Souza", casa: "Bar do Exemplo", cidade: "Betim", site: "https://7aprodutora.com.br" };
  // mesma conferência do servidor (src/modelos.js), para avisar enquanto digita
  function errosModelo(t) {
    const erros = [];
    if (!t.trim()) erros.push("Escreva o texto da mensagem.");
    let i = 0;
    while (i < t.length) {
      const abre = t.indexOf("{{", i), fecha = t.indexOf("}}", i);
      if (abre === -1 && fecha === -1) break;
      if (abre === -1 || (fecha !== -1 && fecha < abre)) { erros.push("Tem um }} sem o {{ de abertura."); break; }
      const prox = t.indexOf("{{", abre + 2);
      if (fecha === -1 || (prox !== -1 && prox < fecha)) { erros.push("Tem uma variável aberta com {{ e não fechada com }}."); break; }
      const chave = t.slice(abre + 2, fecha).split("|")[0].trim();
      if (!VARIAVEIS.includes(chave)) erros.push(chave ? `Variável desconhecida: {{${chave}}}.` : "Tem uma variável vazia: {{}}.");
      i = fecha + 2;
    }
    return erros;
  }
  const exemploDe = (t) => t.replace(/\{\{([^{}]*)\}\}/g, (todo, dentro) => { const [n, ...r] = dentro.split("|"); return EXEMPLO[n.trim()] || r.join("|").trim() || todo; });

  function telaModelos() {
    tela.innerHTML = '<div class="cabeca"><h1 class="display">Mensagens</h1><a class="btn" href="#modelo/novo">Novo modelo</a></div>' + subabas(SUB_MSG, "modelos") + '<div id="lista-mod"><p class="vazio">Carregando...</p></div>';
    carregarModelos().then(() => {
      if (!$("#lista-mod")) return;
      $("#lista-mod").innerHTML = `<p class="ajuda">Nas campanhas automáticas, cada casa recebe o modelo ativo da sua etapa (primeiro contato, cobrança ou proposta), de preferência o do mesmo perfil musical.</p>
        <ul class="lista">${modelos.map((m) => `<li><a class="item" href="#modelo/${m.id}"><span class="nome">${esc(m.nome)}</span><span class="lado"><span class="etiqueta${m.ativo ? "" : " e-cancelado"}">${m.ativo ? nomeDe(ETAPAS_MODELO, m.etapa) : "Desativado"}</span></span><span class="meta">${m.perfil ? nomeDe(PERFIS, m.perfil) : "Qualquer perfil"} · ${m.enviadas} enviadas</span></a></li>`).join("")}</ul>`;
    });
  }

  function fichaModelo(id) {
    carregarModelos().then(() => {
      const novo = id === "novo";
      const m = novo ? { nome: "", etapa: "primeiro", perfil: "", texto: "", ativo: 1 } : modelos.find((x) => x.id === Number(id));
      if (!m) { tela.innerHTML = '<a class="voltar" href="#modelos">Voltar para modelos</a><p class="vazio">Modelo não encontrado.</p>'; return; }
      tela.innerHTML = `
        <a class="voltar" href="#modelos">Voltar para modelos</a>
        <div class="cabeca"><h1 class="display">${novo ? "Novo modelo" : esc(m.nome)}</h1></div>
        <div class="bloco-ficha"><form class="ficha" id="ficha" novalidate>
          <label class="c6">Nome<input name="nome" value="${esc(m.nome)}" placeholder="Primeiro contato, bares de rock" autocomplete="off"></label>
          <label>Etapa<select name="etapa">${opcoes(ETAPAS_MODELO, m.etapa)}</select></label>
          <label>Perfil musical<select name="perfil"><option value="">Qualquer perfil</option>${opcoes(PERFIS.slice(1), m.perfil)}</select></label>
          <div class="c6 variaveis"><span>Inserir:</span>${VARIAVEIS.map((v) => `<button type="button" class="btn btn-sec" data-var="${v}">${v}</button>`).join("")}</div>
          <label class="c6">Texto<textarea name="texto" rows="9">${esc(m.texto)}</textarea><span class="dica">Use {{primeiro_nome|pessoal}} para escrever "pessoal" quando faltar o nome. Sem reserva, a casa sem o dado fica fora da campanha.</span></label>
          <p class="c6 estado ruim" id="erros-mod" role="status" style="margin:0"></p>
          <div class="c6"><span class="dica" style="margin:0 0 6px">Como fica (exemplo com Ana, do Bar do Exemplo, em Betim):</span><p class="texto-msg" id="exemplo-mod"></p></div>
          <label class="c6 marcar"><input type="checkbox" name="ativo"${m.ativo ? " checked" : ""}> Ativo (aparece para escolher e entra nas campanhas automáticas)</label>
        </form>
        <div class="salvar-barra"><button class="btn" type="button" id="salvar">${novo ? "Criar modelo" : "Salvar"}</button><p class="estado" id="estado" role="status"></p></div></div>`;
      const form = $("#ficha");
      const conferir = () => { $("#erros-mod").textContent = errosModelo(form.texto.value).join(" "); $("#exemplo-mod").textContent = exemploDe(form.texto.value); };
      form.addEventListener("input", () => { sujo = true; estado(""); conferir(); });
      form.querySelectorAll("[data-var]").forEach((b) => b.addEventListener("click", () => {
        const t = form.texto, ins = `{{${b.dataset.var}}}`, p = t.selectionStart ?? t.value.length;
        t.value = t.value.slice(0, p) + ins + t.value.slice(t.selectionEnd ?? p);
        t.focus(); t.setSelectionRange(p + ins.length, p + ins.length);
        sujo = true; conferir();
      }));
      conferir();
      $("#salvar").addEventListener("click", () => {
        const erros = errosModelo(form.texto.value);
        if (!form.nome.value.trim()) { estado("Dê um nome ao modelo.", "ruim"); form.nome.focus(); return; }
        if (erros.length) { estado(erros[0], "ruim"); form.texto.focus(); return; }
        const dados = { nome: form.nome.value, etapa: form.etapa.value, perfil: form.perfil.value, texto: form.texto.value, ativo: form.ativo.checked };
        salvar(novo ? "gestao/modelos" : "gestao/modelos/" + m.id, novo ? "POST" : "PUT", dados, (r) => {
          sujo = false; modelos = null;
          if (novo) location.hash = "#modelo/" + r.id; else estado("Salvo.", "ok");
        });
      });
    });
  }

  /* ---------- comum ---------- */
  function estado(t, tipo) { const e = $("#estado"); if (e) { e.textContent = t; e.className = "estado" + (tipo ? " " + tipo : ""); } }
  function salvar(rota, metodo, dados, depois, falhou) {
    const b = $("#salvar"); b.disabled = true; estado("Salvando...");
    api(rota, metodo, dados).then((r) => {
      b.disabled = false;
      if (r._status === 200 && !r.erro) depois(r);
      else if (r._status === 401) { estado("A sessão expirou. Entre de novo; o que você digitou continua aqui.", "ruim"); $("#tela-entrada").hidden = false; }
      else { estado(r.erro || "Não deu para salvar. Tente de novo.", "ruim"); if (falhou) falhou(r); }
    }).catch(() => { b.disabled = false; estado("Sem conexão. Tente de novo.", "ruim"); });
  }
  // com a sessão expirada, entrar de novo volta para a mesma tela sem perder o que foi digitado
  const abrirOriginal = abrir;
  abrir = function () { if (D) { $("#tela-entrada").hidden = true; } else abrirOriginal(); };

  api("sessao").then((r) => (r.ok ? abrir() : mostrarEntrada())).catch(mostrarEntrada);
})();
</script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("/admin/sw.js", { scope: "/admin/" }).catch(() => {});</script>
