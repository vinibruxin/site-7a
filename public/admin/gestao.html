    tela.querySelectorAll("[data-acao]").forEach((b) => b.addEventListener("click", () => {

  // a fila: uma casa por vez, com a mensagem pronta
  function desenharFila(ca) {
    const caixa = $("#fila");
    const recarregar = () => fichaCampanha(String(ca.id));
    api(`gestao/campanhas/${ca.id}/fila`).then((r) => {
      if (!$("#fila")) return;
      const cont = r.contagem || {};
      const resumo = `${cont.pendente || 0} na fila${cont.aguardando ? ` · ${cont.aguardando.n} esperando cobrança (a próxima em ${dataCurta(cont.aguardando.proxima)})` : ""}`;
      if (r.status === "pausada") { caixa.innerHTML = `<p class="vazio">Campanha pausada. Nada é mostrado nem aberto até você retomar. ${resumo}.</p>`; return; }
      if (r.status === "concluida") return recarregar();
      if (r.espera) { caixa.innerHTML = `<p class="vazio">A fila abre em ${dataCurta(r.espera.slice(0, 10))} às ${r.espera.slice(11)}. ${resumo}.</p>`; return; }
      if (r.limite) { caixa.innerHTML = `<p class="aviso">${esc(r.limite)} ${resumo}.</p>`; return; }
      if (r.vazia) { caixa.innerHTML = `<p class="vazio">Ninguém na vez agora.${r.esperando ? ` ${r.esperando} casa${r.esperando > 1 ? "s esperam" : " espera"} o intervalo mínimo entre mensagens.` : ""} ${resumo}.</p>`; return; }
      const a = r.atual, c = a.contratante;
      const chave = chaveNova();
      caixa.innerHTML = `
        <p class="fila-topo"><span class="etiqueta ${a.etapa === "cobranca" ? "e-site" : "e-andamento"}">${a.etapa === "cobranca" ? "Cobrança" : "Mensagem"}</span> ${resumo}${r.simulada ? " · simulação, o WhatsApp não abre" : ""}</p>
        <h2 class="display" style="margin:8px 0 4px"><a href="#contratante/${c.id}" style="text-decoration:none">${esc(c.nome)}</a></h2>
        <p class="ajuda" style="margin:0 0 12px">${[c.contato, c.cidade, c.telefone].filter(Boolean).map(esc).join(" · ")}</p>
        <p class="texto-msg">${esc(a.texto)}</p>
        ${r.mensagem ? `<p class="aviso">Aberta às ${dataHora(r.mensagem.criado).slice(-5)}. Você enviou?</p>
          <div class="acoes-rapidas"><button class="btn" type="button" data-f="enviei">Enviei</button><button class="btn btn-sec" type="button" data-f="nao">Não enviei</button><button class="texto-btn" type="button" data-f="reabrir">Abrir de novo</button></div>`
          : `<div class="acoes-rapidas"><button class="btn btn-grande" type="button" data-f="abrir">Abrir no WhatsApp</button><button class="btn btn-sec" type="button" data-f="pular">Pular</button></div>`}
        <div class="acoes-rapidas" style="margin:0"><button class="texto-btn" type="button" data-f="respondeu">Já respondeu</button><button class="texto-btn perigo" type="button" data-f="parar">Pediu para parar</button></div>
        <p class="estado" id="estado-fila" role="status"></p>`;
      const aviso = (t) => { $("#estado-fila").textContent = t; $("#estado-fila").className = "estado ruim"; };
      caixa.querySelectorAll("[data-f]").forEach((b) => b.addEventListener("click", () => {
        const f = b.dataset.f;
        if (f === "abrir") {
          b.disabled = true;
          abrirNoWhats(() => api("gestao/mensagens", "POST", { chave, contratante_id: c.id, destinatario_id: a.destinatario_id })).then((m) => (m.erro ? (aviso(m.erro), (b.disabled = false)) : desenharFila(ca)));
        } else if (f === "enviei" || f === "nao") {
          b.disabled = true;
          api(`gestao/mensagens/${r.mensagem.id}/confirmar`, "POST", { enviou: f === "enviei" }).then((m) => (m.erro ? aviso(m.erro) : desenharFila(ca)));
        } else if (f === "reabrir") {
          if (confirm("Abrir esta mesma mensagem de novo no WhatsApp? Não cria um registro novo.")) abrirNoWhats(() => api(`gestao/mensagens/${r.mensagem.id}/reabrir`, "POST", {})).then((m) => m.erro && aviso(m.erro));
        } else if (f === "pular") {
          const motivo = prompt("Por que pular esta casa? (opcional)", "");
          if (motivo === null) return;
          api(`gestao/campanhas/${ca.id}/pular`, "POST", { destinatario_id: a.destinatario_id, motivo }).then((m) => (m.erro ? aviso(m.erro) : desenharFila(ca)));
        } else if (f === "respondeu") {
          api(`gestao/contratantes/${c.id}/respondeu`, "POST", {}).then(recarregar);
        } else if (f === "parar") {
          const detalhe = prompt(`${c.nome} pediu para não receber mais mensagens? Se quiser, cole o que a pessoa escreveu.`, "");
          if (detalhe === null) return;
          api(`gestao/contratantes/${c.id}/parar`, "POST", { detalhe }).then(recarregar);
        }
      }));
    });
  }

  /* ---------- modelos ---------- */
  const EXEMPLO = { primeiro_nome: "Ana", nome_contato: "Ana Souza", casa: "Bar do Exemplo", cidade: "Betim", site: "https://7aprodutora.com.br" };
  // mesma conferência do servidor (src/modelos.js), para avisar enquanto digita
  function errosModelo(t) {
    const erros = [];
    if (!t.trim()) erros.push("Escreva o texto da mensagem.");
    let i = 0;
    while (i < t.length) {
      const abre = t.indexOf("{{", i), fecha = t.indexOf("}}", i);
      if (abre === -1 && fecha === -1) break;
      if (abre === -1 || (fecha !== -1 && fecha < abre)) { erros.push("Tem um }} sem o {{ de abertura."); break; }
      const prox = t.indexOf("{{", abre + 2);
      if (fecha === -1 || (prox !== -1 && prox < fecha)) { erros.push("Tem uma variável aberta com {{ e não fechada com }}."); break; }
      const chave = t.slice(abre + 2, fecha).split("|")[0].trim();
      if (!VARIAVEIS.includes(chave)) erros.push(chave ? `Variável desconhecida: {{${chave}}}.` : "Tem uma variável vazia: {{}}.");
      i = fecha + 2;
    }
    return erros;
  }
  const exemploDe = (t) => t.replace(/\{\{([^{}]*)\}\}/g, (todo, dentro) => { const [n, ...r] = dentro.split("|"); return EXEMPLO[n.trim()] || r.join("|").trim() || todo; });

  function telaModelos() {
    tela.innerHTML = '<a class="voltar" href="#campanhas">Voltar para campanhas</a><div class="cabeca"><h1 class="display">Modelos</h1><a class="btn" href="#modelo/novo">Novo modelo</a></div><div id="lista-mod"><p class="vazio">Carregando...</p></div>';
    carregarModelos().then(() => {
      if (!$("#lista-mod")) return;
      $("#lista-mod").innerHTML = `<p class="ajuda">Nas campanhas automáticas, cada casa recebe o modelo ativo da sua etapa (primeiro contato, cobrança ou proposta), de preferência o do mesmo perfil musical.</p>
        <ul class="lista">${modelos.map((m) => `<li><a class="item" href="#modelo/${m.id}"><span class="nome">${esc(m.nome)}</span><span class="lado"><span class="etiqueta${m.ativo ? "" : " e-cancelado"}">${m.ativo ? nomeDe(ETAPAS_MODELO, m.etapa) : "Desativado"}</span></span><span class="meta">${m.perfil ? nomeDe(PERFIS, m.perfil) : "Qualquer perfil"} · ${m.enviadas} enviadas</span></a></li>`).join("")}</ul>`;
    });
  }

  function fichaModelo(id) {
    carregarModelos().then(() => {
      const novo = id === "novo";
      const m = novo ? { nome: "", etapa: "primeiro", perfil: "", texto: "", ativo: 1 } : modelos.find((x) => x.id === Number(id));
      if (!m) { tela.innerHTML = '<a class="voltar" href="#modelos">Voltar para modelos</a><p class="vazio">Modelo não encontrado.</p>'; return; }
      tela.innerHTML = `
        <a class="voltar" href="#modelos">Voltar para modelos</a>
        <div class="cabeca"><h1 class="display">${novo ? "Novo modelo" : esc(m.nome)}</h1></div>
        <div class="bloco-ficha"><form class="ficha" id="ficha" novalidate>
          <label class="c6">Nome<input name="nome" value="${esc(m.nome)}" placeholder="Primeiro contato, bares de rock" autocomplete="off"></label>
          <label>Etapa<select name="etapa">${opcoes(ETAPAS_MODELO, m.etapa)}</select></label>
          <label>Perfil musical<select name="perfil"><option value="">Qualquer perfil</option>${opcoes(PERFIS.slice(1), m.perfil)}</select></label>
          <div class="c6 variaveis"><span>Inserir:</span>${VARIAVEIS.map((v) => `<button type="button" class="btn btn-sec" data-var="${v}">${v}</button>`).join("")}</div>
          <label class="c6">Texto<textarea name="texto" rows="9">${esc(m.texto)}</textarea><span class="dica">Use {{primeiro_nome|pessoal}} para escrever "pessoal" quando faltar o nome. Sem reserva, a casa sem o dado fica fora da campanha.</span></label>
          <p class="c6 estado ruim" id="erros-mod" role="status" style="margin:0"></p>
          <div class="c6"><span class="dica" style="margin:0 0 6px">Como fica (exemplo com Ana, do Bar do Exemplo, em Betim):</span><p class="texto-msg" id="exemplo-mod"></p></div>
          <label class="c6 marcar"><input type="checkbox" name="ativo"${m.ativo ? " checked" : ""}> Ativo (aparece para escolher e entra nas campanhas automáticas)</label>
        </form>
        <div class="salvar-barra"><button class="btn" type="button" id="salvar">${novo ? "Criar modelo" : "Salvar"}</button><p class="estado" id="estado" role="status"></p></div></div>`;
      const form = $("#ficha");
      const conferir = () => { $("#erros-mod").textContent = errosModelo(form.texto.value).join(" "); $("#exemplo-mod").textContent = exemploDe(form.texto.value); };
      form.addEventListener("input", () => { sujo = true; estado(""); conferir(); });
      form.querySelectorAll("[data-var]").forEach((b) => b.addEventListener("click", () => {
        const t = form.texto, ins = `{{${b.dataset.var}}}`, p = t.selectionStart ?? t.value.length;
        t.value = t.value.slice(0, p) + ins + t.value.slice(t.selectionEnd ?? p);
        t.focus(); t.setSelectionRange(p + ins.length, p + ins.length);
        sujo = true; conferir();
      }));
      conferir();
      $("#salvar").addEventListener("click", () => {
        const erros = errosModelo(form.texto.value);
        if (!form.nome.value.trim()) { estado("Dê um nome ao modelo.", "ruim"); form.nome.focus(); return; }
        if (erros.length) { estado(erros[0], "ruim"); form.texto.focus(); return; }
        const dados = { nome: form.nome.value, etapa: form.etapa.value, perfil: form.perfil.value, texto: form.texto.value, ativo: form.ativo.checked };
        salvar(novo ? "gestao/modelos" : "gestao/modelos/" + m.id, novo ? "POST" : "PUT", dados, (r) => {
          sujo = false; modelos = null;
          if (novo) location.hash = "#modelo/" + r.id; else estado("Salvo.", "ok");
        });
      });
    });
  }

  /* ---------- ajustes ---------- */
  function telaAjustes() {
    const c = D.config;
    tela.innerHTML = `
      <div class="cabeca"><h1 class="display">Ajustes</h1></div>
      <form class="ajustes" id="ficha" novalidate>
        <label>% padrão da 7A em cada show<input name="pct_padrao" inputmode="decimal" value="${c.pct_padrao === "" ? "" : String(c.pct_padrao).replace(".", ",")}" placeholder="Ex.: 20" autocomplete="off"></label>
        <p class="ajuda" style="margin:0">Vale para shows novos e para os que estão sem % próprio. Cada show pode ter um % diferente.</p>
        <fieldset class="radios" style="border:0;padding:0;margin:0">
          <legend style="font-weight:600;font-size:14px;color:var(--cinza);margin-bottom:12px">A comissão da 7A é calculada sobre</legend>
          <label class="marcar"><input type="radio" name="base" value="bruto"${c.base !== "liquido" ? " checked" : ""}> O cachê bruto</label>
          <label class="marcar"><input type="radio" name="base" value="liquido"${c.base === "liquido" ? " checked" : ""}> O cachê menos as despesas do show</label>
        </fieldset>
        <h2 class="display" style="margin:20px 0 0">WhatsApp</h2>
        <label>Novas abordagens por dia (no máximo)<input name="limite_diario" type="number" min="1" max="250" inputmode="numeric" value="${esc(c.limite_diario)}"></label>
        <p class="ajuda" style="margin:0">Primeiras mensagens para quem nunca falou com a 7A. Muitas num dia só fazem o WhatsApp desconfiar e podem bloquear o número. O padrão é 20.</p>
        <label>Dias mínimos entre duas mensagens para a mesma casa<input name="intervalo_dias" type="number" min="1" max="30" inputmode="numeric" value="${esc(c.intervalo_dias)}"></label>
        <label class="marcar"><input type="checkbox" name="simulacao"${c.simulacao === "1" ? " checked" : ""}> Modo simulação</label>
        <p class="ajuda" style="margin:0">Para treinar e testar: as mensagens ficam registradas como teste, o WhatsApp não abre, os contratantes não mudam de etapa e nada entra nos números. Campanhas iniciadas em simulação continuam como simulação até o fim.</p>
        <div><button class="btn" type="button" id="salvar">Salvar ajustes</button> <span class="estado" id="estado" role="status"></span></div>
      </form>
      <h2 class="display">Planilhas</h2>
      <p class="ajuda">Baixe tudo para abrir no Excel ou no Google Planilhas. Serve de cópia de segurança e para mandar ao contador.</p>
      <div class="acoes-rapidas">
        <a class="btn btn-sec" href="/api/gestao/exportar/contratantes.csv">Baixar contratantes</a>
        <a class="btn btn-sec" href="/api/gestao/exportar/shows.csv">Baixar shows e cachês</a>
        <a class="btn btn-sec" href="#importar">Importar contratantes</a>
      </div>`;
    const form = $("#ficha");
    form.addEventListener("input", () => { sujo = true; estado(""); });
    $("#salvar").addEventListener("click", () => {
      const v = form.pct_padrao.value.trim().replace(",", ".");
      const dados = { pct_padrao: v === "" ? "" : Number(v), base: form.base.value, limite_diario: Number(form.limite_diario.value), intervalo_dias: Number(form.intervalo_dias.value), simulacao: form.simulacao.checked };
      salvar("gestao/config", "PUT", dados, (r) => { D.config = r; sujo = false; estado("Salvo.", "ok"); });
    });
  }

  /* ---------- comum ---------- */
  function estado(t, tipo) { const e = $("#estado"); if (e) { e.textContent = t; e.className = "estado" + (tipo ? " " + tipo : ""); } }
  function salvar(rota, metodo, dados, depois, falhou) {
    const b = $("#salvar"); b.disabled = true; estado("Salvando...");
    api(rota, metodo, dados).then((r) => {
      b.disabled = false;
      if (r._status === 200 && !r.erro) depois(r);
      else if (r._status === 401) { estado("A sessão expirou. Entre de novo; o que você digitou continua aqui.", "ruim"); $("#tela-entrada").hidden = false; }
      else { estado(r.erro || "Não deu para salvar. Tente de novo.", "ruim"); if (falhou) falhou(r); }
    }).catch(() => { b.disabled = false; estado("Sem conexão. Tente de novo.", "ruim"); });
  }
  // com a sessão expirada, entrar de novo volta para a mesma tela sem perder o que foi digitado
  const abrirOriginal = abrir;
  abrir = function () { if (D) { $("#tela-entrada").hidden = true; } else abrirOriginal(); };

  api("sessao").then((r) => (r.ok ? abrir() : mostrarEntrada())).catch(mostrarEntrada);
})();
</script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("/admin/sw.js", { scope: "/admin/" }).catch(() => {});</script>
</body>
</html>
