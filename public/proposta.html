<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A0A0A">
<title>Proposta de show | 7A Produtora</title>
<link rel="icon" href="/img/logo-7a.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600;700&family=Space+Mono&display=swap">
<style>
:root {
  --preto: #0A0A0A; --vermelho: #B5121B; --offwhite: #F2EFEA; --grafite: #2B2B2B; --cinza: #B8B2AA; --ouro: #F2D27C; --tinta-2: #5A554F;
  --f-display: "Anton", Impact, "Arial Narrow Bold", sans-serif;
  --f-texto: "Montserrat", "Segoe UI", Arial, sans-serif;
  --f-serial: "Space Mono", ui-monospace, monospace;
  --m: 56px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--preto); }
body { margin: 0; background: var(--preto); color: var(--offwhite); font: 400 16px/1.55 var(--f-texto); -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
.display { font-family: var(--f-display); font-weight: 400; text-transform: uppercase; line-height: .92; letter-spacing: -0.01em; margin: 0; }
.num { font-variant-numeric: tabular-nums; }
p { margin: 0; }

.folha { max-width: 860px; margin: 0 auto; background: var(--preto); }

/* cabeça */
.cabeca { display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 32px var(--m) 0; }
.marca { display: flex; align-items: center; gap: 14px; }
.marca img { width: 44px; height: auto; }
.marca span { font: 400 22px/1 var(--f-display); text-transform: uppercase; }
.doc { text-align: right; font-size: 14px; color: var(--cinza); line-height: 1.5; }
.doc b { display: block; font: 400 15px/1.3 var(--f-serial); color: var(--offwhite); letter-spacing: .04em; }

/* abertura: a carta do artista e a chamada */
.abertura { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 48px; align-items: end; padding: 48px var(--m) 64px; }
.para { font-weight: 600; font-size: 16px; color: var(--cinza); margin-bottom: 14px; }
.abertura h1 { font-size: clamp(48px, 7.4vw, 76px); }
.chamada { margin-top: 22px; font-size: 21px; line-height: 1.4; font-weight: 500; max-width: 26em; }
.resumo { margin-top: 16px; color: var(--offwhite); max-width: 34em; }

.peca { position: relative; display: flex; flex-direction: column; aspect-ratio: 5 / 7; overflow: hidden; background: var(--grafite); }
.peca::after { content: ""; position: absolute; inset: 10px; border: 1px solid var(--ouro); pointer-events: none; z-index: 2; }
.peca .arte { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; background: var(--preto); }
.peca .arte img { width: 100%; height: 100%; object-fit: cover; display: block; }
.peca .arte.vazia { background: var(--vermelho); display: grid; place-items: center; }
.peca .arte.vazia span { font: 400 110px/.85 var(--f-display); text-transform: uppercase; }
.peca .indice { position: absolute; z-index: 3; top: 20px; left: 20px; display: grid; justify-items: center; gap: 5px; font: 400 18px/1 var(--f-display); color: var(--offwhite); }
.peca.claro .indice:not(.inf) { color: var(--preto); }
.peca .indice.inf { top: auto; left: auto; bottom: 20px; right: 20px; transform: rotate(180deg); }
.peca .indice i { width: 9px; height: 9px; background: var(--vermelho); transform: rotate(45deg); }
.peca .info { display: grid; gap: 5px; padding: 14px 22px 22px; background: var(--grafite); }
.peca .nome { font: 400 28px/1 var(--f-display); text-transform: uppercase; }
.peca .papel { font-size: 13px; color: var(--cinza); line-height: 1.4; }
.peca .serial { margin-top: 6px; font: 400 12px/1 var(--f-serial); letter-spacing: .06em; text-transform: uppercase; padding-right: 30px; }

/* o show */
.show { background: var(--offwhite); color: var(--preto); padding: 56px var(--m) 60px; }
.show h2, .valores h2, .rider h2 { font-size: 40px; margin-bottom: 28px; }
.fatos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 40px; margin: 0; }
.fatos div { display: grid; gap: 6px; align-content: start; }
.fatos dt { font-weight: 600; font-size: 14px; color: var(--tinta-2); }
.fatos dd { margin: 0; font: 400 30px/1.05 var(--f-display); text-transform: uppercase; overflow-wrap: anywhere; }
.fatos .largo { grid-column: 1 / -1; }

/* valores */
.valores { background: var(--vermelho); padding: 56px var(--m) 60px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 40px; }
.valores h2 { grid-column: 1 / -1; margin-bottom: 0; }
.cache { display: grid; gap: 8px; align-content: start; }
.cache span { font-weight: 600; font-size: 15px; }
.cache strong { font: 400 clamp(56px, 9vw, 84px)/.95 var(--f-display); letter-spacing: -0.01em; }
.cache small { font-size: 14px; }
.termos { display: grid; gap: 22px; align-content: start; }
.termos h3 { margin: 0 0 6px; font-weight: 700; font-size: 15px; }
.termos p, .termos ul { white-space: pre-line; }
.termos ul { margin: 0; padding-left: 20px; }

/* rider, formação e destaques */
.rider { background: var(--offwhite); color: var(--preto); padding: 56px var(--m) 60px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 40px; }
.rider h2 { grid-column: 1 / -1; }
.rider .bloco h3 { margin: 0 0 8px; font-weight: 700; font-size: 15px; }
.rider p { white-space: pre-line; }
.rider ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.rider li span { color: var(--tinta-2); }
.rider .inteiro { grid-column: 1 / -1; margin-top: 28px; }

/* fecho */
.fecho { padding: 64px var(--m) 56px; display: grid; gap: 36px; }
.fecho .lema { font-size: clamp(44px, 7vw, 68px); }
.acoes { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 16px 24px; font: 700 16px/1 var(--f-texto); background: var(--vermelho); color: var(--offwhite); border: 0; text-decoration: none; cursor: pointer; transition: transform .15s, background-color .2s; }
.btn:hover { background: #9A0F17; }
.btn:active { transform: scale(.97); }
.btn-sec { background: var(--grafite); }
.btn-sec:hover { background: #3A3A3A; }
.contato { display: flex; flex-wrap: wrap; gap: 8px 28px; font-size: 15px; }
.contato a { color: var(--offwhite); text-decoration: none; font-weight: 600; }
.contato a:hover { color: var(--cinza); }
.slogan { font-weight: 600; font-size: 14px; color: var(--cinza); }
:focus-visible { outline: 3px solid var(--ouro); outline-offset: 2px; }

.aviso { max-width: 560px; margin: 0 auto; padding: 120px 24px; text-align: left; }
.aviso h1 { font-size: 64px; margin-bottom: 16px; }

@media (max-width: 720px) {
  :root { --m: 20px; }
  .cabeca { padding-top: 20px; align-items: flex-start; }
  .marca span { display: none; }
  .abertura { grid-template-columns: minmax(0, 1fr); gap: 32px; padding-top: 32px; padding-bottom: 48px; }
  .abertura .peca { width: min(260px, 72vw); }
  .chamada { font-size: 19px; }
  .show, .valores, .rider { padding-top: 44px; padding-bottom: 48px; }
  .show h2, .valores h2, .rider h2 { font-size: 34px; }
  .fatos { grid-template-columns: minmax(0, 1fr); gap: 20px; }
  .fatos dd { font-size: 26px; }
  .valores, .rider { grid-template-columns: minmax(0, 1fr); gap: 28px; }
  .rider .inteiro { margin-top: 0; }
  .acoes .btn { flex: 1 1 100%; }
}

@page { size: A4; margin: 0; }
@media print {
  :root { --m: 15mm; }
  html, body { background: var(--preto); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .folha { max-width: none; }
  .so-tela { display: none !important; }
  .abertura { grid-template-columns: 62mm minmax(0, 1fr); padding: 12mm var(--m) 12mm; gap: 10mm; }
  .abertura h1 { font-size: 54px; }
  .show, .valores, .rider { padding: 10mm var(--m); break-inside: avoid; }
  .fecho { padding: 10mm var(--m); break-inside: avoid; }
  .fecho .lema { font-size: 44px; }
}
</style>
</head>
<body>
<div id="raiz"><p class="aviso" aria-live="polite">Carregando a proposta...</p></div>

<script>
(() => {
  const raiz = document.getElementById("raiz");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const MESES = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
  const DIAS = ["Domingo", "Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"];
  const dataLonga = (d) => { const [a, m, x] = d.split("-").map(Number); const w = new Date(Date.UTC(a, m - 1, x)).getUTCDay(); return `${DIAS[w]}, ${x} de ${MESES[m - 1]} de ${a}`; };
  const dataCurta = (d) => d.split("-").reverse().join("/");
  const reais = (c) => new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" }).format(c / 100);
  const token = (location.pathname.match(/\/proposta\/([a-f0-9]{24})$/) || [])[1];

  function erro() {
    raiz.innerHTML = '<div class="aviso"><h1 class="display">Proposta não encontrada</h1><p>O link pode estar incompleto ou a proposta foi retirada. Fale com a 7A pelo WhatsApp <a href="https://wa.me/5531992233295" style="color:inherit;font-weight:700">(31) 99223-3295</a>.</p></div>';
  }
  if (!token) return erro();

  fetch("/api/proposta/" + token).then((r) => (r.ok ? r.json() : null)).then((p) => {
    if (!p) return erro();
    const a = p.artista;
    const onde = p.evento || p.local || p.contratante;
    document.title = `Proposta ${a.nome}${onde ? " | " + onde : ""} | 7A Produtora`;
    const lista = (t) => t.split("\n").map((l) => l.replace(/^[-•*]\s*/, "").trim()).filter(Boolean);
    const inclui = lista(p.inclui || "");
    const fatos = [
      ["Data", p.data ? dataLonga(p.data) : "A combinar", true],
      ["Horário", p.hora ? p.hora.replace(":", "h") : "A combinar"],
      ["Formato", p.formato || "A combinar"],
      ["Local", [p.local, p.evento && p.evento !== p.local ? p.evento : ""].filter(Boolean).join(" · ") || "A combinar"],
      ["Cidade", p.cidade || "A combinar"],
      ["Duração", p.duracao || "A combinar", !p.duracao ? false : p.duracao.length > 24],
    ];
    const zap = `Olá, 7A! Quero fechar a proposta ${p.numero}: ${a.nome}${p.data ? ", " + dataCurta(p.data) : ""}${onde ? ", " + onde : ""}.`;
    const temRider = p.rider || a.formacao.length || a.destaques.length;
    raiz.innerHTML = `
    <article class="folha">
      <header class="cabeca">
        <div class="marca"><img src="/img/logo-7a.png" alt="7A Produtora" width="44" height="52"><span>7A Produtora</span></div>
        <div class="doc">Proposta de show<b>${esc(p.numero)}</b>Emitida em ${dataCurta(p.emitida)}</div>
      </header>

      <section class="abertura">
        <div class="peca${a.claro ? " claro" : ""}">
          <span class="indice">7A<i></i></span>
          <div class="arte${a.foto ? "" : " vazia"}">${a.foto ? `<img src="${esc(a.foto)}" alt="${esc(a.nome)}, foto em preto e branco" style="object-position:${esc(a.foco)}">` : `<span>${esc(a.nome.charAt(0))}</span>`}</div>
          <div class="info"><span class="nome">${esc(a.nome)}</span>${a.genero ? `<span class="papel">${esc(a.genero)}</span>` : ""}${a.serie ? `<span class="serial">Série ${esc(a.serie)}</span>` : ""}</div>
          <span class="indice inf">7A<i></i></span>
        </div>
        <div>
          ${p.contratante ? `<p class="para">Para ${esc(p.contratante)}${p.contato && p.contato !== p.contratante ? ", aos cuidados de " + esc(p.contato) : ""}</p>` : ""}
          <h1 class="display">${esc(a.nome)}</h1>
          ${a.chamada ? `<p class="chamada">${esc(a.chamada)}</p>` : ""}
          ${a.resumo ? `<p class="resumo">${esc(a.resumo)}</p>` : ""}
        </div>
      </section>

      <section class="show" aria-labelledby="t-show">
        <h2 class="display" id="t-show">O show</h2>
        <dl class="fatos">${fatos.map(([t, v, largo]) => `<div${largo ? ' class="largo"' : ""}><dt>${t}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>
      </section>

      <section class="valores" aria-labelledby="t-valores">
        <h2 class="display" id="t-valores">Investimento</h2>
        <div class="cache"><span>Cachê</span><strong class="num">${p.cache ? reais(p.cache) : "A combinar"}</strong>${p.validade ? `<small>Proposta válida até ${dataCurta(p.validade)}</small>` : ""}</div>
        <div class="termos">
          ${inclui.length ? `<div><h3>O que está incluso</h3><ul>${inclui.map((l) => `<li>${esc(l)}</li>`).join("")}</ul></div>` : ""}
          ${p.condicoes ? `<div><h3>Condições de pagamento</h3><p>${esc(p.condicoes)}</p></div>` : ""}
          ${!inclui.length && !p.condicoes ? "<div><p>Condições de pagamento a combinar com a 7A.</p></div>" : ""}
        </div>
      </section>

      ${temRider ? `<section class="rider" aria-labelledby="t-rider">
        <h2 class="display" id="t-rider">${p.rider ? "Rider e formação" : "Sobre o artista"}</h2>
        ${a.formacao.length ? `<div class="bloco"><h3>Formação</h3><ul>${a.formacao.map((f) => `<li>${esc(f.nome)}${f.funcao ? ` <span>${esc(f.funcao)}</span>` : ""}</li>`).join("")}</ul></div>` : ""}
        ${a.destaques.length ? `<div class="bloco"><h3>Destaques</h3><ul>${a.destaques.map((d) => `<li>${esc(d)}</li>`).join("")}</ul></div>` : ""}
        ${p.rider ? `<div class="bloco inteiro"><h3>Rider técnico</h3><p>${esc(p.rider)}</p></div>` : ""}
      </section>` : ""}

      <footer class="fecho">
        <p class="display lema">Aqui o artista é<br>levado a sério.</p>
        <div class="acoes so-tela">
          <a class="btn" href="https://wa.me/5531992233295?text=${encodeURIComponent(zap)}" target="_blank" rel="noopener">Fechar pelo WhatsApp</a>
          <button class="btn btn-sec" type="button" onclick="print()">Salvar em PDF</button>
        </div>
        <div class="contato">
          <a href="https://wa.me/5531992233295" target="_blank" rel="noopener">(31) 99223-3295</a>
          <a href="mailto:7a.produtora@gmail.com">7a.produtora@gmail.com</a>
          <a href="https://instagram.com/7a_produtora" target="_blank" rel="noopener">@7a_produtora</a>
          <a href="https://site-7a.7a-produtora.workers.dev/${a.slug ? esc(a.slug) + ".html" : ""}" target="_blank" rel="noopener">Site da 7A</a>
        </div>
        <p class="slogan">Criar, produzir, transformar. 7A Produtora, Betim, MG.</p>
      </footer>
    </article>`;
  }).catch(erro);
})();
</script>
</body>
</html>
