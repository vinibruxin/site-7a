<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A0A0A">
<title>Recibo | 7A Produtora</title>
<link rel="icon" href="/img/logo-7a.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600;700&family=Space+Mono&display=swap">
<style>
/* Recibo da 7A: folha A4 clara (imprime bem e gasta pouca tinta), faixa preta com a marca no topo,
   valor em Anton grande, vermelho só nos losangos e no aviso de cancelado. Space Mono só no número. */
:root {
  --preto: #0A0A0A; --vermelho: #B5121B; --offwhite: #F2EFEA; --grafite: #2B2B2B; --cinza: #B8B2AA; --ouro: #F2D27C;
  --tinta-2: #57524C; --papel-2: #E6E1D9;
  --f-display: "Anton", Impact, "Arial Narrow Bold", sans-serif;
  --f-texto: "Montserrat", "Segoe UI", Arial, sans-serif;
  --f-serial: "Space Mono", ui-monospace, monospace;
  --m: 56px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { background: var(--grafite); }
body { margin: 0; background: var(--grafite); color: var(--preto); font: 400 16px/1.55 var(--f-texto); -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.display { font-family: var(--f-display); font-weight: 400; text-transform: uppercase; line-height: .92; letter-spacing: -0.01em; margin: 0; }

.barra { max-width: 860px; margin: 0 auto; padding: 20px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; color: var(--offwhite); }
.barra p { font-weight: 600; font-size: 15px; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 14px 22px; font: 700 15px/1 var(--f-texto); background: var(--vermelho); color: var(--offwhite); border: 0; cursor: pointer; text-decoration: none; transition: transform .15s, background-color .2s; }
.btn:hover { background: #9A0F17; }
.btn:active { transform: scale(.97); }
:focus-visible { outline: 3px solid var(--ouro); outline-offset: 2px; }

.folha { max-width: 860px; margin: 0 auto 48px; background: var(--offwhite); display: flex; flex-direction: column; }

.topo { background: var(--preto); color: var(--offwhite); padding: 28px var(--m) 26px; display: flex; justify-content: space-between; align-items: center; gap: 24px; box-shadow: inset 0 -3px 0 var(--ouro); }
.marca { display: flex; align-items: center; gap: 14px; }
.marca img { width: 42px; height: auto; display: block; }
.marca span { font: 400 22px/1 var(--f-display); text-transform: uppercase; }
.doc { text-align: right; font-size: 14px; color: var(--cinza); line-height: 1.5; }
.doc b { display: block; font: 400 17px/1.3 var(--f-serial); color: var(--offwhite); letter-spacing: .04em; }

.abre { padding: 48px var(--m) 36px; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 24px 40px; }
.abre h1 { font-size: 96px; line-height: .9; }
.valor { text-align: right; }
.valor span { display: block; font-weight: 600; font-size: 15px; color: var(--tinta-2); margin-bottom: 8px; }
.valor strong { font: 400 72px/.95 var(--f-display); letter-spacing: -0.01em; }
.extenso { grid-column: 1 / -1; font-weight: 600; font-size: 18px; }
.extenso::first-letter { text-transform: uppercase; }

.texto { padding: 0 var(--m) 36px; font-size: 18px; line-height: 1.6; max-width: 46em; }
.texto b { font-weight: 700; }

.fatos { margin: 0; padding: 32px var(--m); background: var(--papel-2); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 40px; }
.fatos div { display: grid; gap: 4px; align-content: start; }
.fatos dt { font-weight: 600; font-size: 14px; color: var(--tinta-2); }
.fatos dd { margin: 0; font-weight: 600; font-size: 17px; overflow-wrap: anywhere; }
.fatos dd::first-letter { text-transform: uppercase; }
.fatos .largo { grid-column: 1 / -1; }

.falta { color: var(--vermelho); font-weight: 700; }
.falta::before { content: "◆ "; font-size: .8em; }

.quem { padding: 36px var(--m) 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 40px; align-items: end; }
.quem h2 { font-size: 30px; margin-bottom: 14px; }
.quem dl { margin: 0; display: grid; gap: 6px; }
.quem dl div { display: flex; gap: 8px; flex-wrap: wrap; }
.quem dt { font-weight: 600; color: var(--tinta-2); }
.quem dd { margin: 0; font-weight: 600; }
.assina { display: grid; gap: 6px; padding-top: 56px; }
.assina .linha { height: 2px; background: var(--preto); }
.assina p { font-weight: 600; }
.assina small { font-size: 14px; color: var(--tinta-2); }
.local { padding: 28px var(--m) 0; font-weight: 600; }

.pe { margin-top: auto; padding: 36px var(--m) 32px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 28px; font-size: 14px; color: var(--tinta-2); }
.pe b { color: var(--preto); }

.cancelado { margin: 0 var(--m) 28px; padding: 16px 20px; background: var(--vermelho); color: var(--offwhite); font-weight: 700; }
.rascunho { margin: 0 var(--m) 28px; padding: 16px 20px; background: var(--preto); color: var(--offwhite); font-weight: 600; }

.aviso { max-width: 560px; margin: 0 auto; padding: 120px 24px; color: var(--offwhite); }
.aviso h1 { font-size: 64px; margin-bottom: 16px; }
.aviso a { color: inherit; font-weight: 700; }

@media (max-width: 720px) {
  :root { --m: 20px; }
  .topo { padding-top: 20px; padding-bottom: 20px; }
  .marca span { display: none; }
  .abre { grid-template-columns: minmax(0, 1fr); padding-top: 32px; }
  .abre h1 { font-size: 64px; }
  .valor { text-align: left; }
  .valor strong { font-size: 52px; }
  .texto { font-size: 17px; }
  .fatos, .quem { grid-template-columns: minmax(0, 1fr); gap: 18px; }
  .assina { padding-top: 36px; }
  .barra .btn { flex: 1 1 100%; }
}

@page { size: A4; margin: 0; }
@media print {
  :root { --m: 16mm; }
  html, body { background: var(--offwhite); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .so-tela { display: none !important; }
  .folha { max-width: none; margin: 0; height: 296mm; overflow: hidden; }
  .topo { padding: 10mm var(--m) 9mm; }
  .marca span { display: inline; }
  .abre { grid-template-columns: minmax(0, 1fr) auto; padding: 12mm var(--m) 8mm; }
  .abre h1 { font-size: 80px; }
  .valor { text-align: right; }
  .valor strong { font-size: 60px; }
  .texto { padding-bottom: 8mm; font-size: 15px; }
  .cancelado, .rascunho { margin-bottom: 7mm; padding: 10px 16px; font-size: 14px; }
  .fatos { padding: 8mm var(--m); grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5mm 10mm; }
  .fatos dd { font-size: 15px; }
  .quem { padding-top: 10mm; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .assina { padding-top: 16mm; }
  .local { padding-top: 8mm; }
  .pe { padding: 10mm var(--m) 10mm; font-size: 12px; }
}
</style>
</head>
<body>
<div id="raiz"><p class="aviso" aria-live="polite">Carregando o recibo...</p></div>

<script>
(() => {
  const raiz = document.getElementById("raiz");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const MESES = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
  const dataCurta = (d) => (d ? d.split("-").reverse().join("/") : "");
  const dataLonga = (d) => { const [a, m, x] = d.split("-").map(Number); return `${x} de ${MESES[m - 1]} de ${a}`; };
  const reais = (c) => new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" }).format(c / 100);
  // campo sem dado: aparece marcado em vermelho, nunca inventado
  const ou = (v, rotulo = "A preencher") => (v ? esc(v) : `<span class="falta">${rotulo}</span>`);
  const FORMA = { Pix: "por Pix", "Transferência bancária": "por transferência bancária", Dinheiro: "em dinheiro", "Cartão": "no cartão", Boleto: "por boleto" };
  const token = (location.pathname.match(/\/recibo\/([a-f0-9]{24})$/) || [])[1];

  function erro() {
    raiz.innerHTML = '<div class="aviso"><h1 class="display">Recibo não encontrado</h1><p>O link pode estar incompleto. Fale com a 7A pelo WhatsApp <a href="https://wa.me/5531992233295">(31) 99223-3295</a>.</p></div>';
  }
  if (!token) return erro();

  fetch("/api/recibo/" + token).then((r) => (r.ok ? r.json() : null)).then((d) => {
    if (!d) return erro();
    const e = d.emitente, p = d.pagador;
    const cancelado = d.situacao === "cancelado";
    const rascunho = d.faltas.length > 0;
    document.title = `Recibo ${d.numero} | 7A Produtora`;
    const fatos = [
      ["Pagador", ou(p.nome)],
      ["CPF ou CNPJ do pagador", ou(p.doc, "Não informado")],
      ["Data do pagamento", ou(dataCurta(d.data))],
      ["Forma de pagamento", ou(d.forma, "Não informada")],
      ...(p.endereco || p.cidade ? [["Endereço do pagador", esc([p.endereco, p.cidade].filter(Boolean).join(", ")), true]] : []),
      ["Referente a", ou(d.referente), true],
    ];
    raiz.innerHTML = `
    <div class="barra so-tela">
      <p>${cancelado ? "Este recibo foi cancelado." : rascunho ? "Rascunho: faltam dados da 7A." : "Recibo " + esc(d.numero)}</p>
      <button class="btn" type="button" onclick="print()">Salvar em PDF</button>
    </div>
    <article class="folha">
      <header class="topo">
        <div class="marca"><img src="/img/logo-7a.png" alt="7A Produtora" width="42" height="49"><span>7A Produtora</span></div>
        <div class="doc">Recibo de pagamento<b>${esc(d.numero)}${rascunho && !cancelado ? " · rascunho" : ""}</b>Emitido em ${dataCurta(d.emitido)}</div>
      </header>

      <section class="abre">
        <h1 class="display">Recibo</h1>
        <div class="valor"><span>Valor recebido</span><strong class="num">${reais(d.valor)}</strong></div>
        <p class="extenso">${esc(d.extenso)}</p>
      </section>

      ${cancelado ? `<p class="cancelado">Recibo cancelado${d.motivo_cancelamento ? ": " + esc(d.motivo_cancelamento) : ""}. Não vale como comprovante.</p>` : ""}
      ${rascunho && !cancelado ? `<p class="rascunho">Faltam dados de quem recebe (${esc(d.faltas.join(", "))}). Enquanto isso, este recibo é só um rascunho.</p>` : ""}

      <p class="texto">${e.nome ? `<b>${esc(e.nome)}</b>` : "A 7A Produtora"} recebeu de <b>${ou(p.nome)}</b>${p.doc ? `, CPF/CNPJ ${esc(p.doc)}` : ""}, a importância de <b>${reais(d.valor)}</b> (${esc(d.extenso)}), referente a ${ou(d.referente)}${FORMA[d.forma] ? ", paga " + FORMA[d.forma] : ""}${d.data ? ` em ${dataCurta(d.data)}` : ""}. Pelo que dá quitação deste valor.</p>

      <dl class="fatos">${fatos.map(([t, v, largo]) => `<div${largo ? ' class="largo"' : ""}><dt>${t}</dt><dd>${v}</dd></div>`).join("")}</dl>

      <p class="local">${ou(e.cidade, "Cidade a preencher")}, ${dataLonga(d.emitido)}.</p>

      <section class="quem" aria-labelledby="t-quem">
        <div>
          <h2 class="display" id="t-quem">Quem recebe</h2>
          <dl>
            <div><dt>Nome:</dt><dd>${ou(e.nome)}</dd></div>
            <div><dt>CPF/CNPJ:</dt><dd>${ou(e.doc)}</dd></div>
            ${e.endereco ? `<div><dt>Endereço:</dt><dd>${esc(e.endereco)}</dd></div>` : ""}
          </dl>
        </div>
        <div class="assina">
          <div class="linha" aria-hidden="true"></div>
          <p>${ou(e.responsavel || e.nome, "Assinatura")}</p>
          <small>${e.responsavel && e.nome && e.responsavel !== e.nome ? "Por " + esc(e.nome) : "Assinatura de quem recebe"}</small>
        </div>
      </section>

      <footer class="pe">
        <span><b>7A Produtora</b> · Betim, MG · Aqui o artista é levado a sério.</span>
        <span>(31) 99223-3295 · contato@7aprodutora.com.br · 7aprodutora.com.br</span>
      </footer>
    </article>`;
  }).catch(erro);
})();
</script>
</body>
</html>
